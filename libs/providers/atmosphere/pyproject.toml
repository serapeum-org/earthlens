[build-system]
requires = ["setuptools>=80.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "earthlens-atmosphere"
version = "0.10.0"
description = "weather, climate, air quality and solar/wind resource backends for earthlens"
readme = { file = "README.md", content-type = "text/markdown" }
authors = [
    { name = "Mostafa Farrag", email = "moah.farag@gmail.com" }
]
license = "GPL-3.0-only"
keywords = ["remote sensing", "atmosphere"]

classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: Console",
    "Natural Language :: English",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering :: GIS",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Developers",
]

requires-python = ">=3.11,<4"

# Only the core abstractions. Every provider SDK is an extra, so installing
# this distribution brings the backends' code without their dependencies —
# `pip install earthlens-atmosphere[<backend>]` adds exactly one backend's SDK.
dependencies = [
    "earthlens-core ==0.10.0",
]

[project.optional-dependencies]
s3 = ["earthlens-core[s3]"]
ecmwf = ["cdsapi >=0.7.7"]
ecmwf-modern = ["ecmwf-datastores-client >=0.5.1"]
cmip6 = []
nwp = ["herbie-data >=2026.3", "ecmwf-opendata >=0.3", "ecmwflibs; sys_platform == 'win32'"]
radar = ["earthlens-core[s3]"]
goes = ["earthlens-core[s3]"]
tropycal = ["tropycal >=1.4", "cartopy >=0.22"]
eea_aq = ["airbase >=1.0", "nest_asyncio >=1.5"]

# This distribution's slice of the facade's data-source table.
[project.entry-points."earthlens.backends"]
atmosphere = "earthlens._atmosphere:BACKENDS"

[project.urls]
Homepage = "https://github.com/serapeum-org/earthlens"

# Ships only its own backends plus its registry package. `earthlens` itself is
# a PEP 420 namespace (no `__init__.py` in any distribution), so no two wheels
# write the same path.
[tool.setuptools.packages.find]
where = ["src"]
include = ["earthlens._atmosphere*", "earthlens.airnow*", "earthlens.chc*", "earthlens.climate_indices*", "earthlens.cmip6*", "earthlens.drought*", "earthlens.ecmwf*", "earthlens.eea_aq*", "earthlens.goes*", "earthlens.nrel*", "earthlens.nwp*", "earthlens.openaq*", "earthlens.pvgis*", "earthlens.radar*", "earthlens.s3*", "earthlens.sensor_community*", "earthlens.solar_wind_atlas*", "earthlens.tropycal*"]

[tool.setuptools.package-data]
"*" = ["*.yaml", "catalog/*.yaml"]

# Resolve the core distribution from the workspace, not PyPI, so this package
# locks and develops against the local earthlens-core.
[tool.uv.sources]
earthlens-core = { workspace = true }
