    units: kWh/m2/day
    long_name: Diffuse horizontal irradiation (long-term average daily total)
    license_note: >-
      Global Solar Atlas 2.0, © 2026 The World Bank, Solar resource data: Solargis. Licensed CC-BY-4.0.

  gti:
    atlas: gsa
    transport: download_zip
    url: https://api.globalsolaratlas.info/download/World/World_GTI_GISdata_LTAy_AvgDailyTotals_GlobalSolarAtlas-v2_GEOTIFF.zip
    units: kWh/m2/day
    long_name: Global irradiation for optimally tilted surface (long-term average daily total)
    license_note: >-
