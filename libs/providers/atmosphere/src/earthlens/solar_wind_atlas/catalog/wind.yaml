# Global Wind Atlas v3 — wind climatology layers (windowed /vsicurl COG read).
#
# The Global Wind Atlas v3 layers are range-accessible Cloud-Optimized GeoTIFFs
# (tiled + overview pyramids) on public figshare (article 9420803,
# data.dtu.dk), served via ndownloader.figshare.com -> presigned DTU S3 that
# honours HTTP range requests (verified live — see the A1/A1b gate,
# the A1 gate captures). They use the
# `vsicurl` transport: only the bbox window's byte ranges transfer, never the
# whole multi-GB file. Catalogued here is the publicly windowable layer set;
# per-height mean wind-speed at 10/50/150/200 m is not public on figshare
# (blocked behind a private_link) and is out of scope for now.
datasets:

  wind_100m:
    atlas: gwa
    transport: vsicurl
    url: https://ndownloader.figshare.com/files/17247017
    units: m/s
    long_name: Mean wind speed at 100 m above ground level
    license_note: >-
      Global Wind Atlas 3.0, © Technical University of Denmark (DTU) / World Bank (ESMAP). Licensed CC-BY-4.0.

  weibull_k_10m:
