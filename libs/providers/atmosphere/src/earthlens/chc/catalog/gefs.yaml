# CHC catalog slice: CHIRPS-GEFS v3 (ensemble precipitation forecasts).
# 16 dataset(s). Edit in place; the loader merges every
# *.yaml file in this directory into one Catalog at import time.
#
# MIGRATION (issue #1387, split off from the #1386 root reorg). CHC
# retired the `CHIRPS-GEFS_precip_v12/` tree and replaced it with
# `products/CHIRPS-GEFS/v3/`, a different forecast-lead layout that is a
# semantic remap rather than a rename. The nine v12 rows that #1386 left
# on their now-404 paths are replaced here by the v3 products, verified
# live against `data.chc.ucsb.edu` on 2026-11-08:
#
#   * Region: every shipped row is `global`. Where v3 also publishes an
#     `africa/` crop (only 05/10/15-day and dekad_lead_0), it is a smaller
#     cutout of the SAME data the global raster (50S-50N, the full CHIRPS
#     domain) already contains, so it is redundant with a global download
#     plus an AOI crop and is not shipped. The pentad leads and `daily`
#     publish only `global/`, and `16_day` has no region level at all --
#     it partitions straight into `year/month/`.
#   * Products: `data/` (the forecast) and `anom/` (anomaly vs
#     climatology). The old issue note mentioned a `zscore/` product, but
#     no `zscore/` directory exists on the live server for any lead, so
#     only data + anomaly rows are shipped.
#   * Lead scheme: the old pentad `first`/`second`/`last` map to
#     `pentad_lead_0`/`_1`/`_2`, confirmed by the valid-pentad index in
#     the filenames (lead_N's series is offset by N pentads). The two old
#     dekad rows (`first`/`last`) collapse to the single `dekad_lead_0`
#     the server now exposes (its files already hold every dekad of the
#     month). The new `daily` lead (no v12 ancestor) is also shipped.
#   * Filenames: `c3g_{year}.{month}.{day}.tif` (data) /
#     `c3g_anom_...` (anom); dekad/pentad use the index as the final
#     field (`c3g_{year}.{month}.{dekad|pentad}.tif`). Region, product and
#     year/month partitioning live in `ftp_bases` + `file_patterns`, so
#     the existing `{year}`/`{month}`/`{day}`/`{dekad}`/`{pentad}`
#     placeholders cover every row -- no backend change is required.
#
# Re-verify any row's live layout with
# `earthlens datasets probe chc <key>`, which lists the real filenames
# under its `ftp_base` and suggests a `file_patterns` template.

datasets:

  chirps-gefs-v3-05day:
    ftp_bases:
      tif: products/CHIRPS-GEFS/v3/05_day/global/
    region: global
    temporal_resolution: 5-day
    pandas_freq: 5D
    spatial_resolution: [0.05]
    formats: [tif]
    start_date: '2001-01-01'
    file_patterns:
      tif: data/{year}/c3g_{year}.{month}.{day}.tif
    variables:
      precipitation:
        description: 5-day accumulated CHIRPS-GEFS precipitation forecast (v3)
        units: mm/5-days
        types: flux
