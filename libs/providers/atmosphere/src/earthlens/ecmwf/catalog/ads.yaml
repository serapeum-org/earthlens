  cams-gridded-solar-radiation:
    endpoint: ads
    request_kind: form
    extras:
      sky_type: [clear]
      version: ["4.5"]
      day: null  # monthly product — keyed by year / month only
      time: null
      data_format: null  # no `data_format` widget on this form
    variables:
      global-horizontal-irradiation:
        cds_variable: global_horizontal_irradiation
        nc_variable: global_horizontal_clear_sky_irradiation
        units: W h m-2
        extras:
          sky_type: [clear, observed_cloud]
      # The hydrated name below is specific to the `sky_type: [clear]` pinned
      # in this row's extras — under `sky_type: [all]` the file carries no
      # `beam_horizontal_clear_sky_irradiation`, so changing that pin means
      # re-probing this row rather than only the extras.
      direct-horizontal-irradiation:
        cds_variable: direct_horizontal_irradiation
        nc_variable: beam_horizontal_clear_sky_irradiation
        units: W h m-2
      diffuse-horizontal-irradiation:
        cds_variable: diffuse_horizontal_irradiation
        nc_variable: diffuse_horizontal_clear_sky_irradiation
        units: W h m-2
        extras:
          sky_type: [clear, observed_cloud]
      direct-normal-irradiation:
        cds_variable: direct_normal_irradiation
        nc_variable: beam_normal_clear_sky_irradiation
        units: W h m-2
        extras:
          sky_type: [clear, observed_cloud]
  cams-solar-radiation-timeseries:
    endpoint: ads
    request_kind: cams_date
    extras:
      sky_type: [clear]
      time_reference: [true_solar_time]
      time_step: [15minute]
      time: null  # point timeseries keys on `time_step`, not time-of-day
      area: null  # point timeseries — `location` widget, no `area` bbox
    variables:
      all:
        cds_variable: all
        nc_variable: all
        units: unknown
