# CDS catalog — cmip5 family. See _index.yaml for the schema.

datasets:
  projections-cmip5-monthly-single-levels:
    product_type:
    - reanalysis
    extras:
      experiment: historical
      model: ec_earth
      ensemble_member: r12i1p1
      period: 195001-201212
    variables:
      2m-temperature-cmip5m:
        cds_variable: 2m_temperature
        nc_variable: tas
        types: state
        units: K
      mean-precipitation-flux-cmip5m:
        cds_variable: mean_precipitation_flux
        nc_variable: pr
        types: flux
        units: kg m-2 s-1
      maximum-2m-temperature-in-the-last-24-hours-cmip5m:
        cds_variable: maximum_2m_temperature_in_the_last_24_hours
        nc_variable: tasmax
        types: state
        units: K
      minimum-2m-temperature-in-the-last-24-hours-cmip5m:
        cds_variable: minimum_2m_temperature_in_the_last_24_hours
        nc_variable: tasmin
        types: state
        units: K
      mean-sea-level-pressure-cmip5m:
        cds_variable: mean_sea_level_pressure
        nc_variable: psl
        types: state
        units: Pa
      surface-solar-radiation-downwards-cmip5m:
        cds_variable: surface_solar_radiation_downwards
        nc_variable: rsds
        types: flux
        units: W m-2
      10m-wind-speed-cmip5m:
        cds_variable: 10m_wind_speed
        nc_variable: sfcWind
        types: state
        units: m s-1
      near-surface-specific-humidity-cmip5m:
        cds_variable: near_surface_specific_humidity
        nc_variable: huss
        types: state
        units: '1'
      snowfall-cmip5m:
        cds_variable: snowfall
        nc_variable: prsn
        types: flux
        units: kg m-2 s-1
  projections-cmip5-monthly-pressure-levels:
    product_type:
    - reanalysis
    pressure_level:
    - '1000'
    extras:
      experiment: historical
      model: ec_earth
      ensemble_member: r12i1p1
      period: 200001-201212
    variables:
      temperature-cmip5m:
        cds_variable: temperature
        nc_variable: ta
        types: state
        units: K
      u-component-of-wind-cmip5m:
        cds_variable: u_component_of_wind
        nc_variable: ua
        types: state
        units: m s-1
      v-component-of-wind-cmip5m:
        cds_variable: v_component_of_wind
        nc_variable: va
        types: state
        units: m s-1
      specific-humidity-cmip5m:
        cds_variable: specific_humidity
        nc_variable: hus
        types: state
        units: '1'
      geopotential-height-cmip5m:
        cds_variable: geopotential_height
        nc_variable: zg
        types: state
        units: m
  projections-cmip5-daily-pressure-levels:
    endpoint: cds
    request_kind: form
    extras:
      experiment: historical
      model: ec_earth
      ensemble_member: r12i1p1
      period: 19250101-19741231
    variables:
      geopotential-height:
        cds_variable: geopotential_height
        nc_variable: zg
        units: m
      temperature:
        cds_variable: temperature
        nc_variable: temperature
        units: unknown
      u-component-of-wind:
        cds_variable: u_component_of_wind
        nc_variable: u_component_of_wind
        units: unknown
      v-component-of-wind:
        cds_variable: v_component_of_wind
        nc_variable: v_component_of_wind
        units: unknown
  projections-cmip5-daily-single-levels:
    endpoint: cds
    request_kind: form
    extras:
      experiment: historical
      model: gfdl_esm2g
      ensemble_member: r1i1p1
