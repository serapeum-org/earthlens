        units: m s-1
      2m-temperature:
        cds_variable: 2m_temperature
        nc_variable: tas
        units: K
      maximum-2m-temperature-in-the-last-24-hours:
        cds_variable: maximum_2m_temperature_in_the_last_24_hours
        nc_variable: tasmax
        units: K
      mean-precipitation-flux:
        cds_variable: mean_precipitation_flux
        nc_variable: pr
        units: kg m-2 s-1
      mean-sea-level-pressure:
        cds_variable: mean_sea_level_pressure
        nc_variable: psl
        units: Pa
      minimum-2m-temperature-in-the-last-24-hours:
        cds_variable: minimum_2m_temperature_in_the_last_24_hours
        nc_variable: tasmin
        units: K
      near-surface-specific-humidity:
        cds_variable: near_surface_specific_humidity
        nc_variable: huss
        units: '1'
      snowfall:
        cds_variable: snowfall
        nc_variable: prsn
        units: kg m-2 s-1
