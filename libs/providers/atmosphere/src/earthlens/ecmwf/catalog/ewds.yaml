# CEMS Early Warning Data Store (EWDS) datasets for the ECMWF backend.
#
# Reached via the EWDS endpoint (`endpoint: ewds`) with the shared CDS
# Personal Access Token (the same token authenticates against CDS / ADS /
# EWDS; only the URL differs). See `earthlens.ecmwf.endpoints`.
#
# GloFAS (Global Flood Awareness System) river-discharge forecasts sit on a
# regular 0.05-degree WGS84 lat/lon grid (`grid_resolution: 0.05`) and are
# delivered as NetCDF, so the shipped NetCDF pipeline handles them unchanged.
# GloFAS selects the forecast horizon with `leadtime_hour` (in `extras`) rather
# than a time-of-day, so the row uses `request_kind: glofas`, which drops the
# four 6-hourly `time` slots the daily template adds.
#
# Verified live 2026-07-01 (real retrieve + grid inspection); see
# the A1 gate captures. GloFAS must be requested with
# `temporal_resolution="daily"` (the forecast-reference date is a day, and the
# monthly branch would drop the required `day` selector).

# The full EWDS universe (verified live 2026-07-01). `available_datasets:` is
# not repeated here — that index is the CDS STAC universe carried by
# `_index.yaml` (regenerated by `earthlens datasets refresh ecmwf`), and EWDS is
# a separate STAC. The GloFAS, CEMS-fire, and EFAS families are now curated
# across the EWDS shards (GloFAS in this file; CEMS-fire in fire.yaml, EFAS in
# efas.yaml):
#   GloFAS : cems-glofas-forecast, cems-glofas-historical,
#            cems-glofas-historical-intermediate, cems-glofas-reforecast,
#            cems-glofas-seasonal, cems-glofas-seasonal-reforecast
#   Fire   : cems-fire-historical-v1, cems-fire-seasonal
#   EFAS   : efas-forecast, efas-historical, efas-reforecast, efas-seasonal,
#            efas-seasonal-reforecast
# Discharge on the forecast / historical streams is verified live; the other
# variables carry constraint-derived request shapes with `units: unknown`
# placeholders pending per-variable live verification.

datasets:
  cems-glofas-forecast:
    endpoint: ewds
    grid_resolution: 0.05
    request_kind: glofas
    product_type: [control_forecast]
    extras:
      system_version: [operational]
      hydrological_model: [lisflood]
      leadtime_hour: ["24"]
      download_format: unarchived
    variables:
      river-discharge-in-the-last-24-hours:
        cds_variable: river_discharge_in_the_last_24_hours
        nc_variable: dis24
        units: m3 s-1
  cems-glofas-historical:
    endpoint: ewds
    grid_resolution: 0.05
    request_kind: glofas
    product_type: [consolidated]
    extras:
      system_version: [version_4_0]
      hydrological_model: [lisflood]
      timespan: [time_mean]  # serves the river-discharge / runoff outputs (the
      # snow-depth / soil-wetness state variables need timespan: instantaneous)
      download_format: unarchived
    variables:
      # All four variables verified live 2026-08-15: the NetCDF variables use
      # short GRIB codes (not the full cds_variable name), and snow-depth /
      # soil-wetness are only served under `timespan: instantaneous` (a per-row
      # extras override), while discharge / runoff use the dataset-level
      # `time_mean`.
      average-river-discharge-in-the-last-24-hours:
        cds_variable: average_river_discharge_in_the_last_24_hours
        nc_variable: avg_dis
        units: m3 s-1
      runoff-water-equivalent:
        cds_variable: runoff_water_equivalent
        nc_variable: rowe
        units: kg m-2
      snow-depth-water-equivalent:
        cds_variable: snow_depth_water_equivalent
        nc_variable: sd
        units: kg m-2
        extras:
          timespan: [instantaneous]
      soil-wetness-index:
        cds_variable: soil_wetness_index
        nc_variable: swir
        units: '1'
        extras:
          timespan: [instantaneous]

  # GloFAS historical — INTERMEDIATE stream (ERA5T-driven, ~2-5 days behind real
  # time). Same CDS dataset as cems-glofas-historical (see the explicit
  # `cds_dataset:` below — a second curated config of one dataset, differing only
  # by product_type), but `product_type: intermediate`, which covers the most
  # recent weeks/months the final `consolidated` reanalysis has not caught up to
  # yet. All four variables verified live 2026-08-15 (intermediate +
  # 2026-06-15/16, Danube bbox): discharge `avg_dis` + runoff `rowe` under
  # `timespan: time_mean`, snow-depth `sd` + soil-wetness `swir` under
  # `timespan: instantaneous`. The full consolidated variable set is mirrored
  # here via the per-row `cds_dataset` override (catalog.py). This is a curated
  # alias (no CDS/STAC id of its own), so `datasets audit ecmwf --coverage` does
  # not bucket it — its live probe resolves via the `cds_dataset` override.
  cems-glofas-historical-intermediate:
    endpoint: ewds
    grid_resolution: 0.05
    request_kind: glofas
    product_type: [intermediate]
    extras:
      system_version: [version_4_0]
      hydrological_model: [lisflood]
      timespan: [time_mean]
      download_format: unarchived
    variables:
      average-river-discharge-in-the-last-24-hours:
        cds_dataset: cems-glofas-historical
        cds_variable: average_river_discharge_in_the_last_24_hours
        nc_variable: avg_dis
        units: m3 s-1
      # runoff / snow-depth / soil-wetness mirror the consolidated stream (same
      # cds_dataset override + verified values); snow-depth / soil-wetness carry
      # the per-row `timespan: instantaneous` the intermediate stream serves them
      # under.
      runoff-water-equivalent:
        cds_dataset: cems-glofas-historical
        cds_variable: runoff_water_equivalent
        nc_variable: rowe
        units: kg m-2
      snow-depth-water-equivalent:
        cds_dataset: cems-glofas-historical
        cds_variable: snow_depth_water_equivalent
        nc_variable: sd
        units: kg m-2
        extras:
          timespan: [instantaneous]
      soil-wetness-index:
        cds_dataset: cems-glofas-historical
        cds_variable: soil_wetness_index
        nc_variable: swir
        units: '1'
        extras:
          timespan: [instantaneous]
  cems-glofas-reforecast:
    endpoint: ewds
    grid_resolution: 0.05
    request_kind: glofas_hindcast
    product_type: [control_reforecast]
    extras:
      system_version: [version_2_2]
      hydrological_model: [htessel_lisflood]
      leadtime_hour: ["24"]
      download_format: unarchived
    variables:
      river-discharge-in-the-last-24-hours:
        cds_variable: river_discharge_in_the_last_24_hours
        nc_variable: dis24
        units: m**3 s**-1
  cems-glofas-seasonal:
    endpoint: ewds
    grid_resolution: 0.05
    request_kind: seasonal
    extras:
      system_version: [operational]
      hydrological_model: [lisflood]
      leadtime_hour: ["24"]
      download_format: unarchived
    variables:
      river-discharge-in-the-last-24-hours:
        cds_variable: river_discharge_in_the_last_24_hours
        nc_variable: river_discharge_in_the_last_24_hours
        units: unknown
      runoff-water-equivalent:
        cds_variable: runoff_water_equivalent
        nc_variable: runoff_water_equivalent
        units: unknown
      snow-depth-water-equivalent:
        cds_variable: snow_depth_water_equivalent
        nc_variable: snow_depth_water_equivalent
        units: unknown
      soil-wetness-index:
        cds_variable: soil_wetness_index
        nc_variable: soil_wetness_index
        units: unknown
  cems-glofas-seasonal-reforecast:
    endpoint: ewds
    grid_resolution: 0.05
    request_kind: seasonal_hindcast
    extras:
      system_version: [version_2_2]
      hydrological_model: [htessel_lisflood]
      leadtime_hour: ["24"]
      download_format: unarchived
    variables:
      river-discharge-in-the-last-24-hours:
        cds_variable: river_discharge_in_the_last_24_hours
        nc_variable: dis24
        units: m**3 s**-1
