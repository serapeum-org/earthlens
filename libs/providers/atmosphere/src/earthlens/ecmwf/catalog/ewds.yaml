# CEMS Early Warning Data Store (EWDS) datasets for the ECMWF backend.
#
# Reached via the EWDS endpoint (`endpoint: ewds`) with the shared CDS
# Personal Access Token (the same token authenticates against CDS / ADS /
# EWDS; only the URL differs). See `earthlens.ecmwf.endpoints`.
#
# GloFAS (Global Flood Awareness System) river-discharge forecasts sit on a
# regular 0.05-degree WGS84 lat/lon grid (`grid_resolution: 0.05`) and are
# delivered as NetCDF, so the shipped NetCDF pipeline handles them unchanged.
# GloFAS selects the forecast horizon with `leadtime_hour` (in `extras`) rather
# than a time-of-day, so the row uses `request_kind: glofas`, which drops the
# four 6-hourly `time` slots the daily template adds.
#
# Verified live 2026-07-01 (real retrieve + grid inspection); see
# `planning/ecmwf/captures/ecmwf-ewds-facts.md`. GloFAS must be requested with
# `temporal_resolution="daily"` (the forecast-reference date is a day, and the
# monthly branch would drop the required `day` selector).

# The full EWDS universe (verified live 2026-07-01). `available_datasets:` is
# not repeated here — that index is the CDS STAC universe carried by
# `_index.yaml` (regenerated by `earthlens datasets refresh ecmwf`), and EWDS is
# a separate STAC. Only the curated entry under `datasets:` below is wired for
# download; the rest are documented follow-ups (see the open gaps in
# planning/ecmwf/ewds-completion.md):
#   GloFAS : cems-glofas-forecast (shipped), cems-glofas-reforecast,
#            cems-glofas-seasonal, cems-glofas-seasonal-reforecast,
#            cems-glofas-historical
#   Fire   : cems-fire-historical-v1, cems-fire-seasonal
#   EFAS   : efas-forecast, efas-historical, efas-reforecast, efas-seasonal,
#            efas-seasonal-reforecast
# Blockers: reforecast/historical use hyear/hmonth/hday date keys (need a
# date-key remap); seasonal is monthly + leadtime; the fire datasets need their
# valid product_type / dataset_type / system_version combos pinned; efas-* is
# the EFAS archive (public, licence-gated).

datasets:
  cems-glofas-forecast:
    endpoint: ewds
    grid_resolution: 0.05
    request_kind: glofas
    product_type: [control_forecast]
    extras:
      system_version: [operational]
      hydrological_model: [lisflood]
      leadtime_hour: ["24"]
      download_format: unarchived
    variables:
      river-discharge-in-the-last-24-hours:
        cds_variable: river_discharge_in_the_last_24_hours
        nc_variable: dis24
        units: m3 s-1
  cems-glofas-historical:
    endpoint: ewds
    grid_resolution: 0.05
    request_kind: glofas
    product_type: [consolidated]
    extras:
      system_version: [version_4_0]
      hydrological_model: [lisflood]
      timespan: [time_mean]  # serves the river-discharge / runoff outputs (the
      # snow-depth / soil-wetness state variables need timespan: instantaneous)
      download_format: unarchived
    variables:
      average-river-discharge-in-the-last-24-hours:
        cds_variable: average_river_discharge_in_the_last_24_hours
        nc_variable: average_river_discharge_in_the_last_24_hours
        units: unknown
      runoff-water-equivalent:
        cds_variable: runoff_water_equivalent
        nc_variable: runoff_water_equivalent
        units: unknown
      snow-depth-water-equivalent:
        cds_variable: snow_depth_water_equivalent
        nc_variable: snow_depth_water_equivalent
        units: unknown
      soil-wetness-index:
        cds_variable: soil_wetness_index
        nc_variable: soil_wetness_index
        units: unknown
  cems-glofas-reforecast:
    endpoint: ewds
    grid_resolution: 0.05
    request_kind: glofas_hindcast
    product_type: [control_reforecast]
    extras:
      system_version: [version_2_2]
      hydrological_model: [htessel_lisflood]
      leadtime_hour: ["24"]
      download_format: unarchived
    variables:
      river-discharge-in-the-last-24-hours:
        cds_variable: river_discharge_in_the_last_24_hours
        nc_variable: river_discharge_in_the_last_24_hours
        units: unknown
  cems-glofas-seasonal:
    endpoint: ewds
    grid_resolution: 0.05
    request_kind: seasonal
    extras:
      system_version: [operational]
      hydrological_model: [lisflood]
      leadtime_hour: ["24"]
      download_format: unarchived
    variables:
      river-discharge-in-the-last-24-hours:
        cds_variable: river_discharge_in_the_last_24_hours
        nc_variable: river_discharge_in_the_last_24_hours
        units: unknown
      runoff-water-equivalent:
        cds_variable: runoff_water_equivalent
        nc_variable: runoff_water_equivalent
        units: unknown
      snow-depth-water-equivalent:
        cds_variable: snow_depth_water_equivalent
        nc_variable: snow_depth_water_equivalent
        units: unknown
      soil-wetness-index:
        cds_variable: soil_wetness_index
        nc_variable: soil_wetness_index
        units: unknown
  cems-glofas-seasonal-reforecast:
    endpoint: ewds
    grid_resolution: 0.05
    request_kind: seasonal_hindcast
    extras:
      system_version: [version_2_2]
      hydrological_model: [htessel_lisflood]
      leadtime_hour: ["24"]
      download_format: unarchived
    variables:
      river-discharge-in-the-last-24-hours:
        cds_variable: river_discharge_in_the_last_24_hours
        nc_variable: river_discharge_in_the_last_24_hours
        units: unknown
