  # This dataset serves two products, and which one a row returns depends on
  # the row. The four hydrology outputs (river discharge, runoff, snow depth,
  # soil wetness) come from the stanza's historical / catchment / monthly
  # combination. The two meteorological forcings (2m temperature,
  # precipitation) are not produced by a hydrological model at all and are
  # served only as forecast / gridded_5_km / daily, so they override those keys
  # and strip `hydrological_model`. Those blocks also partition on
  # `leadtime_hour` and `meteorological_source`, which the two rows therefore
  # pin as well — without them the request names no combination the store
  # offers. So the dataset returns two different products on different grids
  # and cadences, and a caller asking for it as a whole gets whichever the row
  # implies.
  sis-hydrology-europe-seasonal:
    endpoint: cds
    request_kind: form
    extras:
      hydrological_model: [e_hypecatch00_v30]
      product_type: [historical]
      spatial_extent: [catchment]
      temporal_aggregation: [monthly]
      day: null
      time: null
      data_format: null
      area: null
    variables:
      2m-temperature:
        cds_variable: 2m_temperature
        nc_variable: tas
        units: K
        extras:
          hydrological_model: null
          leadtime_hour:
          - '4320'
          meteorological_source:
          - cmcc_s35
          product_type:
          - forecast
          spatial_extent:
          - gridded_5_km
          temporal_aggregation:
          - daily
      precipitation:
        cds_variable: precipitation
        nc_variable: pr
        units: kg m-2
        extras:
          hydrological_model: null
          leadtime_hour:
          - '4320'
          meteorological_source:
          - cmcc_s35
          product_type:
          - forecast
          spatial_extent:
          - gridded_5_km
          temporal_aggregation:
          - daily
      river-discharge:
        cds_variable: river_discharge
        nc_variable: rdis
        units: m3 s-1
      runoff-water-equivalent:
        cds_variable: runoff_water_equivalent
        nc_variable: run
        units: kg m-2
      soil-wetness-index-in-root-zone:
        cds_variable: soil_wetness_index_in_root_zone
        nc_variable: smoist
        units: ''
      snow-depth-water-equivalent:
        cds_variable: snow_depth_water_equivalent
        nc_variable: swe
        units: kg m-2
