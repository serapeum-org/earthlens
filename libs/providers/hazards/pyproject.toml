[build-system]
requires = ["setuptools>=80.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "earthlens-hazards"
version = "0.11.0"
description = "hazard, humanitarian and vector-basemap backends for earthlens"
readme = { file = "README.md", content-type = "text/markdown" }
authors = [
    { name = "Mostafa Farrag", email = "moah.farag@gmail.com" }
]
license = "GPL-3.0-only"
keywords = ["remote sensing", "hazards"]

classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: Console",
    "Natural Language :: English",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering :: GIS",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Developers",
]

requires-python = ">=3.11,<4"

# Only the core abstractions. Every provider SDK is an extra, so installing
# this distribution brings the backends' code without their dependencies —
# `pip install earthlens-hazards[<backend>]` adds exactly one backend's SDK.
dependencies = [
    "earthlens-core ==0.11.0",
]

[project.optional-dependencies]
fdsn = ["obspy >=1.5.0"]
hdx = ["hdx-python-api >=6,<7"]
overture = ["overturemaps >=1.0.0", "duckdb >=1.0.0"]
osm = ["overpy >=0.7", "ohsome >=0.4.0"]
osm-pbf = ["pyrosm >=0.11.0", "osmium >=4.3.1"]

# This distribution's slice of the facade's data-source table.
[project.entry-points."earthlens.backends"]
hazards = "earthlens._hazards:BACKENDS"

[project.urls]
Homepage = "https://github.com/serapeum-org/earthlens"

# Ships only its own backends plus its registry package. `earthlens` itself is
# a PEP 420 namespace (no `__init__.py` in any distribution), so no two wheels
# write the same path.
[tool.setuptools.packages.find]
where = ["src"]
# `earthlens` is a PEP 420 namespace shared across all distributions, so
# `namespaces = true` lets setuptools discover the __init__-less parent (matches
# earthlens-core).
namespaces = true
include = ["earthlens._hazards*", "earthlens.admin*", "earthlens.fdsn*", "earthlens.firms*", "earthlens.gdacs*", "earthlens.hdx*", "earthlens.osm*", "earthlens.overture*", "earthlens.risk_indicators*"]

[tool.setuptools.package-data]
"*" = ["*.yaml", "catalog/*.yaml"]
# hdx ships its (large, gzipped) available-datasets index alongside the YAML.
"earthlens.hdx" = ["catalog/*.json", "catalog/*.json.gz"]

# Resolve the core distribution from the workspace, not PyPI, so this package
# locks and develops against the local earthlens-core.
[tool.uv.sources]
earthlens-core = { workspace = true }

# Per-distribution pytest config: lets this member's tests run standalone
# (`cd libs/providers/hazards && uv run pytest`, or `pytest -c libs/providers/hazards/pyproject.toml libs/providers/hazards/tests`).
# The root pyproject aggregates all six member test roots for the whole-suite run.
[tool.pytest.ini_options]
testpaths = "tests"
consider_namespace_packages = true
addopts = "--import-mode=importlib"
markers = [
    "admin: tests for the administrative-boundaries backend (geoBoundaries + CGAZ + Natural Earth + US Census TIGER/Line; no extra SDK — core requests + pyramids; all four public, GADM omitted for license).",
    "e2e: end-to-end test against a live external service (e.g. CDS); select with `-m e2e`.",
    "fdsn: tests for the FDSN seismic-event backend (requires the `fdsn` extra: obspy).",
    "firms: tests for the NASA FIRMS active-fire backend (free MAP_KEY, no extra SDK; uses the core `requests` + `pandas` dependencies).",
    "gdacs: tests for the GDACS multi-hazard alert backend (public feed, no extra SDK).",
    "hdx: tests for the Humanitarian Data Exchange backend (requires the `hdx` extra: hdx-python-api).",
    "integration: exercises multiple modules together with mocked I/O.",
    "osm: tests for the OpenStreetMap backend (requires the `osm` extra: overpy + ohsome; two public keyless protocols — Overpass current-state via overpy, OSM history via ohsome; the non-e2e suite fakes both SDKs).",
    "osm_pbf: tests for the OpenStreetMap `pbf` protocol (bulk Geofabrik `.osm.pbf` reads; requires the `osm-pbf` extra: pyrosm + osmium/pyosmium; the non-e2e suite fakes the reader + HttpClient, the gated e2e downloads a small extract).",
    "overture: tests for the Overture Maps vector backend (requires the `overture` extra: overturemaps).",
    "risk_indicators: tests for the risk-indicators backend (GFDRR ThinkHazard! + INFORM Risk + Global Forest Watch; no extra SDK — core requests + pandas + pyramids; GFW datasets need GFW_API_KEY, ThinkHazard/INFORM are public).",
    "slow: mark test as slow.",
    "unit: in-process unit test, no network or filesystem outside tmp_path.",
]
