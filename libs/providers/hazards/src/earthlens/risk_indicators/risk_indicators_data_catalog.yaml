  # INFORM has two publication channels and they disagree. The Scores API
  # stopped serving the INFORM2026 group on 2026-08-18 - workflow 505 ("INFORM
  # Risk 2026") answers 200 [] for every indicator, as do 515 and 481 - while
  # the results page kept publishing the 2026 release as a spreadsheet
  # (INFORM_Risk_2026_v072.xlsx, 31 March 2026).
  #
  # So the four Risk rows below carry BOTH: a release_column, which reads the
  # current release straight from that spreadsheet (the default), and a
  # workflow_id pin of 503 ("INFORM Risk Mid 2025", published 2025-08-28) - the
  # newest workflow the API still serves - used when source="api" or a
  # workflow_id= override asks for a specific model release. Scores differ
  # between the two: KEN is 6.2 in the 2026 workbook and 5.8 under workflow 503,
  # and every returned row carries a `source` column saying which it came from.
  #
  # To unwind the API pin when JRC restores the 2026 group: re-probe
  # /countries/Scores/?WorkflowId=505&IndicatorId=INFORM (their own
  # /workflows/Default still names 505, so that pointer is no signal). A
  # non-empty answer means it is back - repin these four rows and update this
  # note; every returned row records the workflow it came from, so a repin that
  # contradicts this comment is visible in the data. inform:climate_risk
  # reads a different model and a different channel - see its own note.
  inform:risk:
    provider: inform
    output_kind: tabular
    selector: country
    workflow_id: 503
    indicator_id: INFORM
    release_column: "INFORM RISK"
    long_name: INFORM Risk composite index
    citation: "INFORM Risk Index, European Commission Joint Research Centre (JRC), Disaster Risk Management Knowledge Centre — https://drmkc.jrc.ec.europa.eu/inform-index."
  inform:hazard_exposure:
    provider: inform
    output_kind: tabular
    selector: country
    workflow_id: 503
    indicator_id: HA
    release_column: "HAZARD & EXPOSURE"
    long_name: INFORM Hazard & Exposure dimension
    citation: "INFORM Risk Index, European Commission Joint Research Centre (JRC), Disaster Risk Management Knowledge Centre — https://drmkc.jrc.ec.europa.eu/inform-index."
  inform:vulnerability:
    provider: inform
    output_kind: tabular
    selector: country
    workflow_id: 503
    indicator_id: VU
    release_column: "VULNERABILITY"
    long_name: INFORM Vulnerability dimension
    citation: "INFORM Risk Index, European Commission Joint Research Centre (JRC), Disaster Risk Management Knowledge Centre — https://drmkc.jrc.ec.europa.eu/inform-index."
  inform:coping_capacity:
    provider: inform
    output_kind: tabular
    selector: country
    workflow_id: 503
    indicator_id: CC
    release_column: "LACK OF COPING CAPACITY"
    long_name: INFORM Lack of Coping Capacity dimension
    citation: "INFORM Risk Index, European Commission Joint Research Centre (JRC), Disaster Risk Management Knowledge Centre — https://drmkc.jrc.ec.europa.eu/inform-index."
  # Climate Change is a separate model, not part of the Risk release above.
  # This row used to pin 435, whose upstream name is "INFORM Climate Change Risk
  # SSP5 2050"; it has FlagDataSaved: null and answers 200 [] for every
  # indicator, so the row never returned anything. Six Climate Change workflows
  # exist and only 451 serves scores (INFORM/HA/VU/CC, 191 countries each, KEN
  # 4.8/3.1/6.0/5.9, verified 2026-08-22). The other five are empty: 435, the
  # 2020 baseline (447), the pessimistic RCP8.5-SSP3 runs at 2050 (449) and 2080
  # (452), and the constant-population variant (466) - so none of them gets a
  # catalog row. 451 is the "optimistic" RCP4.5-SSP1 pathway at 2050, one of the
  # two scenarios INFORM publishes on its Climate Change results page, and the
  # long_name now names that scenario: the old label described 435's SSP5 run,
  # which is not one of the two published pathways. No release_column: the
  # Climate Change results are published as their own brochure spreadsheet with
  # a different layout, not in the INFORM Risk release workbook, so this row is
  # API-only and source="release" is rejected for it.
  inform:climate_risk:
    provider: inform
    output_kind: tabular
    selector: country
    workflow_id: 451
    indicator_id: INFORM
    long_name: INFORM Climate Change Risk 2050 (RCP4.5-SSP1)
    citation: "INFORM Risk Index, European Commission Joint Research Centre (JRC), Disaster Risk Management Knowledge Centre — https://drmkc.jrc.ec.europa.eu/inform-index."
  gfw:tree_cover_loss:
    provider: gfw
    output_kind: tabular
    selector: country
    gfw_dataset: gadm__tcl__iso_change
    gfw_version: v20260424
    sql_template: "SELECT iso, umd_tree_cover_loss__year, SUM(umd_tree_cover_loss__ha) AS umd_tree_cover_loss__ha FROM data WHERE iso='{iso}' AND umd_tree_cover_density_2000__threshold=30 GROUP BY iso, umd_tree_cover_loss__year ORDER BY umd_tree_cover_loss__year"
    long_name: Annual tree-cover loss (ha) by country (UMD/Hansen, canopy>=30%)
    citation: "Global Forest Watch / Hansen-UMD tree cover loss; GADM boundaries — https://www.globalforestwatch.org (CC BY 4.0)."
  gfw:tree_cover_loss_summary:
    provider: gfw
    output_kind: tabular
    selector: country
    gfw_dataset: gadm__tcl__iso_summary
    gfw_version: v20260424
    sql_template: "SELECT iso, SUM(umd_tree_cover_loss__ha) AS umd_tree_cover_loss__ha FROM data WHERE iso='{iso}' AND umd_tree_cover_density_2000__threshold=30 GROUP BY iso"
    long_name: Total tree-cover loss (ha) by country (UMD/Hansen, canopy>=30%)
    citation: "Global Forest Watch / Hansen-UMD tree cover loss; GADM boundaries — https://www.globalforestwatch.org (CC BY 4.0)."
  gfw:admin_boundary:
    provider: gfw
    output_kind: vector
    selector: country
    gfw_geostore: admin
    long_name: GADM admin boundary geometry the GFW indicators are computed over
    citation: "Global Forest Watch / Hansen-UMD tree cover loss; GADM boundaries — https://www.globalforestwatch.org (CC BY 4.0)."

