# risk_indicators_data_catalog.yaml
#
# Curated catalog for the earthlens.risk_indicators backend (M29): three
# country/admin-indexed risk sources — GFDRR ThinkHazard!, INFORM Risk (JRC),
# and the Global Forest Watch Data API. Each dataset row pins its provider, its
# output_kind (tabular -> DataFrame, vector -> FeatureCollection), and the
# provider-specific request detail. Endpoints/shapes live-verified 2026-06-27
# (see the A1 gate captures).
#
# admin_codes: ISO3 -> ThinkHazard ADM0 division code (== FAO GAUL 2015 ADM0
# code), used by resolve_admin() to turn a country= ISO3 into a ThinkHazard code.

