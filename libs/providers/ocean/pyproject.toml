[build-system]
requires = ["setuptools>=80.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "earthlens-ocean"
version = "0.19.0"
description = "ocean, freshwater and marine-life backends for earthlens"
readme = { file = "README.md", content-type = "text/markdown" }
authors = [
    { name = "Mostafa Farrag", email = "moah.farag@gmail.com" }
]
license = "GPL-3.0-only"
keywords = ["remote sensing", "ocean"]

classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: Console",
    "Natural Language :: English",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering :: GIS",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Developers",
]

requires-python = ">=3.11,<4"

# Only the core abstractions. Every provider SDK is an extra, so installing
# this distribution brings the backends' code without their dependencies —
# `pip install earthlens-ocean[<backend>]` adds exactly one backend's SDK.
dependencies = [
    "earthlens-core ==0.19.0",
    # Imported directly by earthlens.caravan for its cache directory, so it is
    # declared here rather than relied on transitively through core.
]

[project.optional-dependencies]
argo = ["argopy >=1.4"]
cmems = ["copernicusmarine >=2.0.0,<3"]
erddap = ["erddapy >=3.0"]
nwm = ["earthlens-core[s3]", "pyramids-gis[parquet] >=0.54.0"]
usgs-water = ["dataretrieval >=1.1.4"]
obis = ["pyobis >=1.6.1"]

# This distribution's slice of the facade's data-source table.
[project.entry-points."earthlens.backends"]
ocean = "earthlens._ocean:BACKENDS"

# This distribution's slice of the CLI catalog-tooling table (refresh / audit /
# probe / validate handlers), merged by earthlens._cli_tooling.
[project.entry-points."earthlens.cli"]
ocean = "earthlens._ocean_cli:CLI_TOOLING"

[project.urls]
Homepage = "https://github.com/serapeum-org/earthlens"

# Ships only its own backends plus its registry package. `earthlens` itself is
# a PEP 420 namespace (no `__init__.py` in any distribution), so no two wheels
# write the same path.
[tool.setuptools.packages.find]
where = ["src"]
# `earthlens` is a PEP 420 namespace shared across all distributions, so
# `namespaces = true` lets setuptools discover the __init__-less parent (matches
# earthlens-core).
namespaces = true
include = ["earthlens._ocean*", "earthlens.argo*", "earthlens.caravan*", "earthlens.cmems*", "earthlens.erddap*", "earthlens.nwm*", "earthlens.obis*", "earthlens.usgs_water*"]

[tool.setuptools.package-data]
"*" = ["*.yaml", "catalog/*.yaml"]

[tool.setuptools.exclude-package-data]
# The informational available_parameters.yaml (~1.5 MB, ~19.7k codes) is a
# repo/tooling + docs artefact that nothing loads at runtime (the Catalog reads
# only the curated file; raw codes pass through variables= without it), so it is
# deliberately excluded from the wheel.
"earthlens.usgs_water" = ["available_parameters.yaml"]

# Resolve the core distribution from the workspace, not PyPI, so this package
# locks and develops against the local earthlens-core.
[tool.uv.sources]
earthlens-core = { workspace = true }

# Per-distribution pytest config: lets this member's tests run standalone
# (`cd libs/providers/ocean && uv run pytest`, or `pytest -c libs/providers/ocean/pyproject.toml libs/providers/ocean/tests`).
# The root pyproject aggregates all six member test roots for the whole-suite run.
[tool.pytest.ini_options]
testpaths = "tests"
consider_namespace_packages = true
addopts = "--import-mode=importlib"
markers = [
    "argo: tests for the Argo float-profile backend (requires the `argo` extra: argopy; open data, no auth).",
    "caravan: tests for the Caravan large-sample hydrology backend (no extra SDK; static Zenodo archives read over HTTP Range, includes the open GRDC-Caravan subset).",
    "cmems: tests for the Copernicus Marine backend (requires the `cmems` extra: copernicusmarine).",
    "e2e: end-to-end test against a live external service (e.g. CDS); select with `-m e2e`.",
    "erddap: tests for the generic ERDDAP backend (requires the `erddap` extra: erddapy; griddap raster via direct .nc download + pyramids, tabledap tabular via to_pandas; public servers only).",
    "integration: exercises multiple modules together with mocked I/O.",
    "nwm: tests for the NOAA National Water Model backend (requires the `nwm` extra: boto3; unsigned noaa-nwm-pds bucket).",
    "obis: tests for the OBIS marine-occurrence backend (requires the `obis` extra: pyobis; search is anonymous).",
    "slow: mark test as slow.",
    "unit: in-process unit test, no network or filesystem outside tmp_path.",
    "usgs_water: tests for the USGS NWIS / Water Data backend (requires the `usgs-water` extra: dataretrieval; anonymous access works).",
]
