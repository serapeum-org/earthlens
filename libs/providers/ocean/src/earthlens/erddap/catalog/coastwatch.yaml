# ERDDAP curated catalog - NOAA CoastWatch / NCEI slice.
#
# Public datasets served by the NOAA CoastWatch ERDDAP
# (https://coastwatch.pfeg.noaa.gov/erddap): ocean-colour chlorophyll,
# NCEI AVHRR Pathfinder SST (griddap rasters), and the NDBC standard
# meteorological buoy network (a tabledap time-series). See the slice
# header in coral-reef-watch.yaml for the row schema.

datasets:

  erdMH1chla8day:
    server_url: https://coastwatch.pfeg.noaa.gov/erddap
    dataset_id: erdMH1chla8day
    protocol: griddap
    dim_names: [time, latitude, longitude]
    variables:
      - chlorophyll
    # Historical record: the Aqua MODIS mission product covers 2003-01 to
    # 2022-06 only (it stopped updating). Request dates inside that window;
    # a recent-date request returns a clear out-of-coverage ValueError.
    title: Chlorophyll-a, Aqua MODIS, NPP, Global, 4km, 8-day composite (2003-2022, historical)
    license_note: NASA OBPG / NOAA CoastWatch, U.S. Government public domain

  erdPH53sstd8day:
    server_url: https://coastwatch.pfeg.noaa.gov/erddap
    dataset_id: erdPH53sstd8day
    protocol: griddap
    dim_names: [time, latitude, longitude]
    variables:
      - sea_surface_temperature
    # Historical record: CoastWatch retired the `nceiPH53*` ids in favour of
    # `erdPH53*`, and dropped the daily cadence entirely - only 8-day and
    # monthly composites remain. This one covers 1981-08 to 2023-06; a
    # later-date request returns a clear out-of-coverage ValueError.
    title: SST, AVHRR Pathfinder Ver 5.3 (L3C), daytime, global, 0.0417 deg, 8-day composite (1981-2023, historical)
    license_note: NOAA NCEI AVHRR Pathfinder, U.S. Government public domain

  cwwcNDBCMet:
    server_url: https://coastwatch.pfeg.noaa.gov/erddap
    dataset_id: cwwcNDBCMet
    protocol: tabledap
    variables:
      - station
      - time
      - WTMP
    title: NDBC Standard Meteorological Buoy Data
    license_note: NOAA NDBC, U.S. Government public domain
