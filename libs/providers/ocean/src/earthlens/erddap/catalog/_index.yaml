# Informational index: every dataset id published by the ERDDAP servers the
# catalog curates from — the union of each distinct `server_url`'s
# `allDatasets` table. ERDDAP has no single global universe (it is a protocol
# spoken by many independent servers), so this is the universe of the curated
# servers, not of all ERDDAP. Every curated `datasets:` key in the per-slice
# *.yaml files must be a member of this list (the loader enforces it).
#
