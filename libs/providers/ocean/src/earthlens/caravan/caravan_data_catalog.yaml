  israel:
    title: Caravan extension Israel - Israel dataset for large-sample hydrology
    concept_doi: 10.5281/zenodo.7758515
    license: CC-BY-4.0
    attribution: >-
      Caravan extension Israel. Streamflow data provided by the Israeli
