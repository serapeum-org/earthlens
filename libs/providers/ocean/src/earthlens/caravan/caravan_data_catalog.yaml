# Informational index of every Caravan record known on Zenodo, including the
# ones this backend deliberately does not wrap. Regenerated by
# `earthlens datasets refresh caravan`; nothing reads it at runtime.
available_extensions:
  - key: base
    supported: true
  - key: grdc
    supported: true
  - key: germany
    supported: true
  - key: czechia
    supported: true
  - key: spain
    supported: true
  - key: denmark
    supported: true
  - key: israel
    supported: true
  - key: multimet
    supported: false
    records: [14196771, 14196772]
    reason: >-
      Caravan MultiMet ships zarr cubes of nowcast/forecast products (CPC,
      IMERG v07, CHIRPS, IFS-HRES, GraphCast, CHIRPS-GEFS) with lead-time bands
      on a UTC-0 time base. That is a gridded/cube shape, not the per-catchment
      daily table this backend returns, so it needs its own backend.
  - key: mswep4caravan
    supported: false
    records: [19199860]
    reason: >-
      MSWEP4Caravan is a Caravan-shaped rainfall-runoff dataset, but it is
      CC-BY-NC-4.0. earthlens makes no assumption about a user's commercial
      status, so non-commercial sources stay out of the default integration
      path - the same rule applied to the NC providers in
      docs/reference/deferred-providers.md.
  - key: caravan-qual
    supported: false
    records: [21337532]
    reason: >-
      Caravan-Qual (lite) is CC-BY-4.0 but is not in the Caravan timeseries
      layout: its tables are per-PARAMETER water-quality files
      (`wqms-csv/BOD7.csv`, `pH.csv`, ...) plus zarr cubes, not per-catchment
      daily series. Verified by opening the archive - it exposes no
      `timeseries/<fmt>/<source>/` members at all.
  - key: iceland
    supported: false
    reason: >-
      The Caravan extension Iceland (lamahice) is published on HydroShare
      rather than Zenodo, and is CC-BY-NC-4.0. Both put it outside what this
      backend fetches; see the project's data-contribution thread #27.
  - key: aus-vic
    supported: false
    records: [18736844]
    reason: >-
      Caravan-AUS-VIC (Maribyrnong River, Victoria) was published to Zenodo and
      then DELETED by its author on 2026-03-01 - the record now returns HTTP 410
      with a tombstone. There is nothing to fetch.
  - key: camels-de-native
    supported: false
    records: [16755906]
    reason: >-
      The native CAMELS-DE dataset, a different Zenodo concept from the
      Caravan-DE extension already wrapped as `germany`. Not in the Caravan
      layout.
  - key: deep-learning-in-hydrology
    supported: false
    records: [13975174]
    reason: >-
      A paper's supporting data, not a Caravan extension. Matches the discovery
      search only because it is hydrological.
  - key: floodnarrator
    supported: false
    records: [19657154]
    reason: >-
