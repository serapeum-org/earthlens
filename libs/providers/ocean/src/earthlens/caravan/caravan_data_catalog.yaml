# Caravan large-sample hydrology catalog.
#
# Caravan (Kratzert et al., Sci Data 10, 61 (2023)) publishes per-catchment daily
# streamflow plus ERA5-Land meteorological forcing, static attributes and basin
# polygons as static archives on Zenodo. One `extensions:` row = one Zenodo
# record set; a `sources:` entry = one directory *inside* an archive.
#
# Every row pins a SPECIFIC Zenodo version record, never the moving concept DOI,
# so a request is reproducible. Caravan is a versioned historical archive, not a
# live feed — see `data_period` on each row, and use `usgs_water` (US
# near-real-time) or GloFAS for current discharge.
#
# `archive_format` drives the transport: `zip` archives are read in place over
# HTTP Range requests (a member costs ~2 MB against a multi-GB archive), while
# `tar.gz` is a single gzip stream that cannot be seeked and must be downloaded
# whole. Sizes and md5 checksums below come from the Zenodo REST API on
# 2026-08-01; check them for drift with `earthlens datasets refresh caravan`.

# Friendly variable name -> the real Caravan column name.
#
# Column ORDER differs between archives (some alphabetical, some grouped by
# statistic), so selection is always by name. Three column-set variants exist:
#   * current (v1.5+): the split ERA5-Land / FAO Penman-Monteith PET pair.
#   * legacy (base v1.2 and earlier): one `potential_evaporation_sum`, named
#     here as `legacy_column` on `potential_evaporation`.
#   * Caravan-DE only: two extra observed columns, flagged via `sources`.
variables:
  streamflow:
    column: streamflow
    units: mm/d
    description: Observed daily discharge, normalised by catchment area.
  total_precipitation:
    column: total_precipitation_sum
    units: mm/d
    description: Daily total precipitation (ERA5-Land).
  potential_evaporation:
    column: potential_evaporation_sum_ERA5_LAND
    legacy_column: potential_evaporation_sum
    units: mm/d
    description: Daily potential evaporation as provided by ERA5-Land.
  potential_evaporation_fao:
    column: potential_evaporation_sum_FAO_PENMAN_MONTEITH
    units: mm/d
    description: Daily potential evaporation from FAO Penman-Monteith (v1.5+).
  temperature_2m_min:
    column: temperature_2m_min
    units: degC
    description: Daily minimum air temperature 2 m above ground.
  temperature_2m_mean:
    column: temperature_2m_mean
    units: degC
    description: Daily mean air temperature 2 m above ground.
  temperature_2m_max:
    column: temperature_2m_max
    units: degC
    description: Daily maximum air temperature 2 m above ground.
  dewpoint_temperature_2m_min:
    column: dewpoint_temperature_2m_min
    units: degC
    description: Daily minimum dewpoint temperature 2 m above ground.
  dewpoint_temperature_2m_mean:
    column: dewpoint_temperature_2m_mean
    units: degC
    description: Daily mean dewpoint temperature 2 m above ground.
  dewpoint_temperature_2m_max:
    column: dewpoint_temperature_2m_max
    units: degC
    description: Daily maximum dewpoint temperature 2 m above ground.
  snow_depth_water_equivalent_min:
    column: snow_depth_water_equivalent_min
    units: mm
    description: Daily minimum snow water equivalent.
  snow_depth_water_equivalent_mean:
    column: snow_depth_water_equivalent_mean
    units: mm
    description: Daily mean snow water equivalent.
  snow_depth_water_equivalent_max:
    column: snow_depth_water_equivalent_max
    units: mm
    description: Daily maximum snow water equivalent.
  surface_net_solar_radiation_min:
    column: surface_net_solar_radiation_min
    units: W/m2
    description: Daily minimum net shortwave radiation at the surface.
  surface_net_solar_radiation_mean:
    column: surface_net_solar_radiation_mean
    units: W/m2
    description: Daily mean net shortwave radiation at the surface.
  surface_net_solar_radiation_max:
    column: surface_net_solar_radiation_max
    units: W/m2
    description: Daily maximum net shortwave radiation at the surface.
  surface_net_thermal_radiation_min:
    column: surface_net_thermal_radiation_min
    units: W/m2
    description: Daily minimum net longwave radiation at the surface.
  surface_net_thermal_radiation_mean:
    column: surface_net_thermal_radiation_mean
    units: W/m2
    description: Daily mean net longwave radiation at the surface.
  surface_net_thermal_radiation_max:
    column: surface_net_thermal_radiation_max
    units: W/m2
    description: Daily maximum net longwave radiation at the surface.
  surface_pressure_min:
    column: surface_pressure_min
    units: kPa
    description: Daily minimum surface air pressure.
  surface_pressure_mean:
    column: surface_pressure_mean
    units: kPa
    description: Daily mean surface air pressure.
  surface_pressure_max:
    column: surface_pressure_max
    units: kPa
    description: Daily maximum surface air pressure.
  u_component_of_wind_10m_min:
    column: u_component_of_wind_10m_min
    units: m/s
    description: Daily minimum eastward wind component 10 m above ground.
  u_component_of_wind_10m_mean:
    column: u_component_of_wind_10m_mean
    units: m/s
    description: Daily mean eastward wind component 10 m above ground.
  u_component_of_wind_10m_max:
    column: u_component_of_wind_10m_max
    units: m/s
    description: Daily maximum eastward wind component 10 m above ground.
  v_component_of_wind_10m_min:
    column: v_component_of_wind_10m_min
    units: m/s
    description: Daily minimum northward wind component 10 m above ground.
  v_component_of_wind_10m_mean:
    column: v_component_of_wind_10m_mean
    units: m/s
    description: Daily mean northward wind component 10 m above ground.
  v_component_of_wind_10m_max:
    column: v_component_of_wind_10m_max
    units: m/s
    description: Daily maximum northward wind component 10 m above ground.
  volumetric_soil_water_layer_1_min:
    column: volumetric_soil_water_layer_1_min
    units: m3/m3
    description: Daily minimum soil moisture, layer 1 (0-7 cm).
  volumetric_soil_water_layer_1_mean:
    column: volumetric_soil_water_layer_1_mean
    units: m3/m3
    description: Daily mean soil moisture, layer 1 (0-7 cm).
  volumetric_soil_water_layer_1_max:
    column: volumetric_soil_water_layer_1_max
    units: m3/m3
    description: Daily maximum soil moisture, layer 1 (0-7 cm).
  volumetric_soil_water_layer_2_min:
    column: volumetric_soil_water_layer_2_min
    units: m3/m3
    description: Daily minimum soil moisture, layer 2 (7-28 cm).
  volumetric_soil_water_layer_2_mean:
    column: volumetric_soil_water_layer_2_mean
    units: m3/m3
    description: Daily mean soil moisture, layer 2 (7-28 cm).
  volumetric_soil_water_layer_2_max:
    column: volumetric_soil_water_layer_2_max
    units: m3/m3
    description: Daily maximum soil moisture, layer 2 (7-28 cm).
  volumetric_soil_water_layer_3_min:
    column: volumetric_soil_water_layer_3_min
    units: m3/m3
    description: Daily minimum soil moisture, layer 3 (28-100 cm).
  volumetric_soil_water_layer_3_mean:
    column: volumetric_soil_water_layer_3_mean
    units: m3/m3
    description: Daily mean soil moisture, layer 3 (28-100 cm).
  volumetric_soil_water_layer_3_max:
    column: volumetric_soil_water_layer_3_max
    units: m3/m3
    description: Daily maximum soil moisture, layer 3 (28-100 cm).
  volumetric_soil_water_layer_4_min:
    column: volumetric_soil_water_layer_4_min
    units: m3/m3
    description: Daily minimum soil moisture, layer 4 (100-289 cm).
  volumetric_soil_water_layer_4_mean:
    column: volumetric_soil_water_layer_4_mean
    units: m3/m3
    description: Daily mean soil moisture, layer 4 (100-289 cm).
  volumetric_soil_water_layer_4_max:
    column: volumetric_soil_water_layer_4_max
    units: m3/m3
    description: Daily maximum soil moisture, layer 4 (100-289 cm).
  streamflow_vol:
    column: streamflow_vol
    units: m3/s
    sources: [camelsde]
    description: Observed discharge as a volumetric rate (Caravan-DE only).
  water_level:
    column: water_level
    units: m
    sources: [camelsde]
    description: Observed gauge water level (Caravan-DE only).

extensions:
  base:
    title: Caravan - a global community dataset for large-sample hydrology
    # Since v1.6 base spans TWO Zenodo concepts, one per timeseries filetype.
    # This is the netCDF concept; the CSV concept is 10.5281/zenodo.15530021.
    # The authoritative pointer for a fetch is `files.<fmt>.record`, which is
    # per-format; `doi` below names the netCDF record for the same reason.
    concept_doi: 10.5281/zenodo.6522634
    concept_doi_csv: 10.5281/zenodo.15530021
    license: CC-BY-4.0
    attribution: >-
      Kratzert et al. (2023), Caravan - A global community dataset for
      large-sample hydrology, Scientific Data 10, 61. Cite the source datasets
      (CAMELS-US/AUS/BR/CL/GB, HYSETS, LamaH-CE) alongside Caravan itself.
    license_file: licenses/<source>/license_<source>.md
    sources:
      camels: {n_catchments: 482, name: CAMELS-US}
      camelsaus: {n_catchments: 561, name: CAMELS-AUS v2}
      camelsbr: {n_catchments: 376, name: CAMELS-BR}
      camelscl: {n_catchments: 314, name: CAMELS-CL}
      camelsgb: {n_catchments: 408, name: CAMELS-GB}
      hysets: {n_catchments: 4621, name: HYSETS}
      lamah: {n_catchments: 479, name: LamaH-CE}
    default_version: "1.6"
    versions:
      # The current release. Both formats are `tar.gz` - a single gzip stream
      # that cannot be seeked - so reaching one catchment means downloading the
      # whole archive. Guarded behind `allow_full_download=True`.
      "1.6":
        doi: 10.5281/zenodo.15529786
        release_date: "2025-05-27"
        data_period: [1950, 2023]
        # Changelog arithmetic (v0.4 6830 + v1.4 9130 + v1.6 CAMELS-AUS v2 ~339),
        # not measured - the tar.gz cannot be indexed without downloading it.
        n_catchments: 16300
        n_catchments_verified: false
        column_set: current
        files:
          csv:
            record: 15530022
            name: Caravan-csv.tar.gz
            size: 28951089034
            md5: ede5b507bd7e7ab9558d8ab1cedf65b1
            archive_format: tar.gz
            root_prefix: null
          netcdf:
            record: 15529786
            name: Caravan-nc.tar.gz
            size: 24775734275
            md5: ad3a7767db059f218380e9cce5f72452
            archive_format: tar.gz
            root_prefix: null
      # The newest range-readable base: a zip, so one catchment costs ~3 MB.
      # A materially different dataset, not merely an older cut - 6,830 of the
      # ~16,300 catchments, forcing stops in 2020, and a single PET column.
      "1.2":
        doi: 10.5281/zenodo.7944025
        release_date: "2023-05-17"
        data_period: [1981, 2020]
        n_catchments: 6830
        n_catchments_verified: true
        column_set: legacy
        files:
          csv:
            record: 7944025
            name: Caravan.zip
            size: 12515557400
            md5: bd9d6e9dd1d0da0731b53678f551f8f9
            archive_format: zip
            root_prefix: Caravan/
          netcdf:
            record: 7944025
            name: Caravan.zip
            size: 12515557400
            md5: bd9d6e9dd1d0da0731b53678f551f8f9
            archive_format: zip
            root_prefix: Caravan/

  grdc:
    title: >-
      GRDC-Caravan - extending the original dataset with data from the Global
      Runoff Data Centre
    concept_doi: 10.5281/zenodo.8425586
    license: CC-BY-4.0
    attribution: >-
      Faerber, C., Bertola, M., et al. GRDC-Caravan. Data provided by the Global
