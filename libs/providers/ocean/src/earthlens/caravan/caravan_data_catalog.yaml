  discharge_efas:
    column: dis_efas5
    units: mm/d
    sources: [camelses]
    description: >-
      EFAS v5 simulated discharge, normalised like `streamflow` so the two are
      directly comparable (Caravan-ES only).
  precipitation_emo1:
    column: pr_emo1
    units: mm/d
    sources: [camelses]
    description: Daily precipitation from the EMO-1 1 km grid (Caravan-ES only).
  potential_evaporation_emo1:
