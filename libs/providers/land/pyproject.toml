[build-system]
requires = ["setuptools>=80.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "earthlens-land"
version = "0.22.0"
description = "terrain, elevation, soil, ecology and population backends for earthlens"
readme = { file = "README.md", content-type = "text/markdown" }
authors = [
    { name = "Mostafa Farrag", email = "moah.farag@gmail.com" }
]
license = "GPL-3.0-only"
keywords = ["remote sensing", "land"]

classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: Console",
    "Natural Language :: English",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering :: GIS",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Developers",
]

requires-python = ">=3.11,<4"

# Only the core abstractions. Every provider SDK is an extra, so installing
# this distribution brings the backends' code without their dependencies —
# `pip install earthlens-land[<backend>]` adds exactly one backend's SDK.
dependencies = [
    "earthlens-core ==0.22.0",
]

[project.optional-dependencies]
dem = ["earthlens-core[s3]"]
ghsl = []
gbif = ["pygbif >=0.6.6"]
worldpop = ["worldpoppy >=0.4", "py7zr >=0.20"]

# This distribution's slice of the facade's data-source table.
[project.entry-points."earthlens.backends"]
land = "earthlens._land:BACKENDS"

[project.entry-points."earthlens.cli"]
land = "earthlens._land_cli:CLI_TOOLING"

[project.urls]
Homepage = "https://github.com/serapeum-org/earthlens"

# Ships only its own backends plus its registry package. `earthlens` itself is
# a PEP 420 namespace (no `__init__.py` in any distribution), so no two wheels
# write the same path.
[tool.setuptools.packages.find]
where = ["src"]
# `earthlens` is a PEP 420 namespace shared across all distributions, so
# `namespaces = true` lets setuptools discover the __init__-less parent (matches
# earthlens-core).
namespaces = true
include = ["earthlens._land*", "earthlens.bathymetry*", "earthlens.dem*", "earthlens.fabdem*", "earthlens.gbif*", "earthlens.ghsl*", "earthlens.glaciers*", "earthlens.iucn*", "earthlens.soilgrids*", "earthlens.wdpa*", "earthlens.worldpop*"]

[tool.setuptools.package-data]
"*" = ["*.yaml", "catalog/*.yaml"]
# GHSL ships the 18x36 Mollweide tile-grid index (the JRC land tile schema,
# converted to GeoJSON) alongside its catalog; `tiles_for_bbox` opens it
# unconditionally on the download path, so it must be in the wheel.
"earthlens.ghsl" = ["*.geojson"]

# Resolve the core distribution from the workspace, not PyPI, so this package
# locks and develops against the local earthlens-core.
[tool.uv.sources]
earthlens-core = { workspace = true }

# Per-distribution pytest config: lets this member's tests run standalone
# (`cd libs/providers/land && uv run pytest`, or `pytest -c libs/providers/land/pyproject.toml libs/providers/land/tests`).
# The root pyproject aggregates all six member test roots for the whole-suite run.
[tool.pytest.ini_options]
testpaths = "tests"
consider_namespace_packages = true
addopts = "--import-mode=importlib"
markers = [
    "bathymetry: tests for the bathymetry DEM backend (GEBCO 2020 + ETOPO1 ice/bedrock via NOAA ERDDAP griddap; no extra SDK — core requests + pyramids).",
    "dem: tests for the Copernicus DEM backend (GLO-30 / GLO-90; requires the `dem` extra: boto3; anonymous copernicus-dem-30m / -90m buckets; raw COG tiles — no decode, mosaic/crop is pyramids downstream).",
    "e2e: end-to-end test against a live external service (e.g. CDS); select with `-m e2e`.",
    "fabdem: tests for the FABDEM V1-2 bare-earth DEM backend (Forest And Buildings removed Copernicus DEM, ~30m; open HTTPS from the University of Bristol, no extra SDK — core requests + pyramids; CC-BY-NC-SA 4.0 non-commercial).",
    "gbif: tests for the GBIF species-occurrence backend (requires the `gbif` extra: pygbif; search is anonymous).",
    "ghsl: tests for the GHSL backend (JRC Global Human Settlement Layer; open HTTPS, no extra SDK for the direct path; localised via pyramids).",
    "glaciers: tests for the glaciers backend (RGI 7.0 per-region outlines via IHP-WINS + GLIMS WFS time-series outlines + WGMS Fluctuations of Glaciers tabular; no extra SDK — core requests + pandas + pyramids; mixed per-instance OUTPUT_KIND; all sources open, no auth).",
    "integration: exercises multiple modules together with mocked I/O.",
    "iucn: tests for the IUCN Red List v4 backend (no extra SDK; direct v4 REST via core `requests`; needs a Bearer token).",
    "slow: mark test as slow.",
    "soilgrids: tests for the SoilGrids backend (ISRIC SoilGrids 2.0 soil properties via OGC WCS at maps.isric.org; no extra SDK — core requests + pyramids' Dataset.from_wcs; all public, CC-BY 4.0, no auth).",
    "unit: in-process unit test, no network or filesystem outside tmp_path.",
    "wdpa: tests for the Protected Planet (WDPA) backend (no extra SDK; direct v4 REST via core `requests`; needs a token).",
    "worldpop: tests for the WorldPop population data hub backend (open CC-BY-4.0; default REST path needs only core requests + pyramids, optional `worldpop` extra adds worldpoppy).",
]
