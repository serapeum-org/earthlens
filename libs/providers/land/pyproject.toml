[build-system]
requires = ["setuptools>=80.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "earthlens-land"
version = "0.10.0"
description = "terrain, elevation, soil, ecology and population backends for earthlens"
readme = { file = "README.md", content-type = "text/markdown" }
authors = [
    { name = "Mostafa Farrag", email = "moah.farag@gmail.com" }
]
license = "GPL-3.0-only"
keywords = ["remote sensing", "land"]

classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: Console",
    "Natural Language :: English",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering :: GIS",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Developers",
]

requires-python = ">=3.11,<4"

# Only the core abstractions. Every provider SDK is an extra, so installing
# this distribution brings the backends' code without their dependencies —
# `pip install earthlens-land[<backend>]` adds exactly one backend's SDK.
dependencies = [
    "earthlens-core ==0.10.0",
]

[project.optional-dependencies]
dem = ["earthlens-core[s3]"]
ghsl = []
gbif = ["pygbif >=0.6.6"]
worldpop = ["worldpoppy >=0.4", "py7zr >=0.20"]

# This distribution's slice of the facade's data-source table.
[project.entry-points."earthlens.backends"]
land = "earthlens._land:BACKENDS"

[project.urls]
Homepage = "https://github.com/serapeum-org/earthlens"

# Ships only its own backends plus its registry package. `earthlens` itself is
# a PEP 420 namespace (no `__init__.py` in any distribution), so no two wheels
# write the same path.
[tool.setuptools.packages.find]
where = ["src"]
# `earthlens` is a PEP 420 namespace shared across all distributions, so
# `namespaces = true` lets setuptools discover the __init__-less parent (matches
# earthlens-core).
namespaces = true
include = ["earthlens._land*", "earthlens.bathymetry*", "earthlens.dem*", "earthlens.gbif*", "earthlens.ghsl*", "earthlens.glaciers*", "earthlens.iucn*", "earthlens.soilgrids*", "earthlens.wdpa*", "earthlens.worldpop*"]

[tool.setuptools.package-data]
"*" = ["*.yaml", "catalog/*.yaml"]
# GHSL ships the 18x36 Mollweide tile-grid index (the JRC land tile schema,
# converted to GeoJSON) alongside its catalog; `tiles_for_bbox` opens it
# unconditionally on the download path, so it must be in the wheel.
"earthlens.ghsl" = ["*.geojson"]

# Resolve the core distribution from the workspace, not PyPI, so this package
# locks and develops against the local earthlens-core.
[tool.uv.sources]
earthlens-core = { workspace = true }
