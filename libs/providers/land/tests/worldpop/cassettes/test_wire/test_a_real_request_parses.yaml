      '#01':
      - '[23:04:47 08659400 SQL QUERY      ] SELECT `id`,`rest` FROM `project` WHERE
        `alias` = "pop" LIMIT 1'
      '#02':
      - '[23:04:47 08788100 SQL QUERY      ] SELECT id FROM `category` WHERE `alias`
        = "wpgp" LIMIT 1'
      '#03':
      - '[23:04:47 08861300 SQL QUERY      ] SELECT g.id, g.title, g.desc, g.doi,
        g.date, g.popyear, g.citation, g.data_file, g.file_img, g.archive, g.public,
        g.source, g.data_format, g.author_email, g.author_name, g.license_path, g.maintainer_name,
        g.maintainer_email, p.name project, cat.name category, t.name gtype, cn.name
        continent, c.name country, c.iso3 FROM gdata g LEFT JOIN project p ON p.id
        = g.project_id LEFT JOIN category cat ON cat.id = g.category_id LEFT JOIN
        gtype t ON t.id = g.gtype_id LEFT JOIN continent cn ON cn.id = g.continent_id
        LEFT JOIN country c ON c.id = g.country_id WHERE c.iso3 = ''MCO'' AND g.category_id
        = 29'
