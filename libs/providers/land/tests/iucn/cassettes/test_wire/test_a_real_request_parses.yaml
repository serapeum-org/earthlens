        Extinct\"},\"code\":\"RE\"},\"supplementary_info\":{\"area_restricted_is_restricted\":null,\"number_of_locations\":null,\"upper_elevation_limit\":4200,\"lower_elevation_limit\":0,\"lower_depth_limit\":null,\"upper_depth_limit\":null,\"population_size\":null,\"population_severely_fragmented\":\"No\",\"population_continuing_decline\":null,\"generational_length\":\"6.5\",\"congregatory\":null,\"movement_patterns\":null,\"continuing_decline_in_area\":null,\"conservation_actions_in_place\":[{\"name\":\"In-place
