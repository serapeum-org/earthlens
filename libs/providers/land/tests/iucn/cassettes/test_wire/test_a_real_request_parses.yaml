        or introduced benignly\",\"value\":\"Yes\"},{\"name\":\"Subject to ex-situ
        conservation\",\"value\":\"Yes\"}]},{\"name\":\"In-place education\",\"actions\":[{\"name\":\"Subject
        to recent education and awareness programmes\",\"value\":\"Yes\"}]}],\"identification_information\":null,\"extreme_fluctuations\":null,\"no_of_subpopulations\":null,\"continuing_decline_in_subpopulations\":null,\"extreme_fluctuations_in_subpopulations\":null,\"all_individuals_in_one_subpopulation\":null,\"no_of_individuals_in_largest_subpopulation\":null,\"estimated_area_of_occupancy\":null,\"continuing_decline_in_area_of_occupancy\":null,\"extreme_fluctuations_in_area_of_occupancy\":null,\"estimated_extent_of_occurence\":null,\"continuing_decline_in_extent_of_occurence\":null,\"extreme_fluctuations_in_extent_of_occurence\":null,\"continuing_decline_in_number_of_locations\":null,\"extreme_fluctuations_in_number_of_locations\":null,\"past_percent_change\":null,\"past_reduction_or_increase\":null,\"past_population_reduction_basis\":null,\"past_causes_of_reduction\":null,\"ongoing_percent_change\":null,\"ongoing_reduction_or_increase\":null,\"ongoing_population_reduction_basis\":null,\"ongoing_causes_of_reduction\":null,\"future_percent_change\":null,\"future_reduction_or_increase\":null,\"future_population_reduction_basis\":null,\"future_causes_of_reduction\":null},\"documentation\":{\"range\":\"Lions
        are found in most countries in sub-Saharan Africa.  In 2005-2006 the Wildlife
        Conservation Society and the IUCN SSC Cat Specialist Group undertook an extensive
        collaborative exercise to map and assess current lion range in sub-Saharan
        Africa (IUCN 2006a,b; Bauer 2008).  Extent of occurrence is estimated at over
        4.5 million km\xB2, 22% of historical range.  Most lion range is in eastern
        and southern Africa (77%).  Current lion status is still unknown over large
        parts of Africa, 7.6 million km\xB2.  \\u003cbr/\\u003e\\u003cbr/\\u003eThe
        lion formerly ranged from northern Africa through southwest Asia (where it
        disappeared from most countries within the last 150 years), west into Europe,
        where it apparently became extinct almost 2,000 years ago, and east into India
        (Nowell and Jackson 1996, Sunquist and Sunquist 2002).  Today, the only remainder
        of this once widespread population is a single isolated population of the
        Asiatic lion \\u003cem\\u003eP. leo persica\\u003c/em\\u003e in the 1,400
        km\xB2 Gir Forest National Park and Wildlife Sanctuary. Lions are extinct
        in North Africa, having perhaps survived in the High Atlas Mountains up to
        the 1940s (Nowell and Jackson 1996, West and Packer in press).\",\"population\":\"There
        have been few efforts in the past to estimate the number of lions in Africa.
        Myers (1975) wrote, \\\"Since 1950, their [lion] numbers may well have been
        cut in half, perhaps to as low as 200,000 in all or even less\\\". Later,
        Myers (1986) wrote, \\\"In light of evidence from all the main countries of
        its range, the lion has been undergoing decline in both range and numbers,
        often an accelerating decline, during the past two decades\\\". In the early
        1990s, IUCN SSC Cat Specialist Group members made educated \\\"guesstimates\\\"
        of 30,000 to 100,000 for the African lion population (Nowell and Jackson 1996).
        \\u003cbr/\\u003e\\u003cbr/\\u003eThe most quantitative historical estimate
        of the African lion population in the recent past was made by Ferreras and
        Cousins (1996), who developed a GIS-based model to predict African lion range
        and numbers, calibrated by surveying experts about the factors affecting lion
        populations. First they correlated vegetation (Leaf Area Index) with lion
        densities, using known values from 37 studies in 19 African protected areas,
        and mapped potential lion range. Then the reduction effect of human activities
        on lion range and numbers were estimated. Lion experts were surveyed in order
        to develop and rank a set of factors which would lead to lower lion densities
        as well as lion absence. These included agriculture, human population density,
        cattle grazing, and distance from a protected area, and were derived from
        GIS databases of varying age. For example, in areas identified as main cattle
        grazing areas lion density was reduced by 90%, and in areas identified as
        having widespread agricultural cultivation or high human population density
        (\\u0026gt; 2.5 people/km\xB2) Lions were considered absent. Lion density
        was reduced by 50% in areas with low human population density (1-2.5 people/km\xB2).
        Because of the age of their data sources on extent of agriculture and pastoralism,
        Ferreras and Cousins (1996) selected 1980 as the base year for their predicted
        African lion population of 75,800. They emphasized the need for ground-truthing
        their estimate by censusing lions, particularly outside protected areas.\\u003cbr/\\u003e\\u003cbr/\\u003eTwo
        recent surveys have provided current estimates of the African lion population,
        with some ground-truthing. The African Lion Working Group, a network of specialists
        affiliated with the IUCN SSC Cat Specialist Group, conducted a mail survey
        and compiled estimates of 100 known African lion populations. Not included
        were populations of known existence, but unknown or unestimated size. The
        ALWG African lion population estimate is 23,000, with a range of 16,500-30,000
        (Bauer and Van Der Merwe 2004). The second survey was carried out by Philippe
        Chardonnet and sponsored by the International Foundation for the Conservation
        of Wildlife and Conservation Force (Chardonnet 2002). He also compiled estimates
        for 144 individual African lion populations, grouped into 36 largely isolated
        subpopulations. His methodology included extrapolation of estimates of known
        populations into areas where lion status was unknown, and his total figure
        is not surprisingly larger: 39,000 lions in Africa, with a range of 29,000-47,000.\\u003cbr/\\u003e\\u003cbr/\\u003eApproximately
        30% of the individual population estimates compiled by the African Lion Working
        Group were based on scientific surveys. Techniques for these surveys included
        total count based on individually identified body features, sampling by use
        of calling stations playing recordings of hyaena and/or lion prey, and mark-recapture
        methods including radio telemetry, photo databases, and spoor counts (Bauer
        and Van Der Merwe 2004). Seventy percent of their population figures were
        derived from expert opinion or guesstimate. In the other survey, 63% of Chardonnet's
        (2002) individual population estimates were based on expert opinions or guesstimates.
        Twelve percent of Chardonnet's (2002) estimates were based on scientific surveys,
        and a further 25% were derived from extrapolation of variables from nearby
        populations and catch-per-unit effort-estimates based on lion trophy hunting.\\u003cbr/\\u003e\\u003cbr/\\u003eEstimating
        the size of the African lion population is an ambitious exercise involving
        many uncertainties. The three main efforts (Ferreras and Cousins 1996; Chardonnet
        2002; Bauer and Van Der Merwe 2004) all use different methods. The African
        Lion Working Group compiled individual population estimates primarily from
        protected areas (23,000 lions: Bauer and Van Der Merwe 2004). In 1980, Ferreras
        and Cousins (1996) predicted 18,600 lions to occur in protected areas. This
        was probably an underestimate as not all protected areas inhabited by lions
        at that time were included. Still, the comparison suggests that the number
        of lions in African protected areas has remained stable or possibly increased
        over time. But Ferreras and Cousins (1996) predicted that most lions in 1980
        were found outside protected areas. Chardonnet (2002) finds that unprotected
        areas still comprise a significant portion (half) of the lion's current African
        range. Comparison of Ferreras and Cousin's (1996) prediction of 75,800 lions
        in 1980 (roughly three lion generations ago) to Chardonnet's (2002) estimate
        of 39,000 lions yields a suspected decline of 48.5%. This calculation suggests
        a substantial decline in lions outside protected areas over the past two decades.
        Ferreras and Cousins (1996) may have over-estimated the African lion population
        in 1980, as their number was derived from a model rather than actual lion
        counts, and so it is possible that the rate of decline of the African lion
        population may be lower.  A group exercise led by WCS and the IUCN SSC Cat
        Specialist Group estimated that 42% of major lion populations were declining
        (Bauer 2008).  The rate of decline is most unlikely to have been as high as
        90%, as reported in a series of news reports in 2003 (Kirby 2003, Frank and
        Parker 2003).\\u003cbr/\\u003e\\u003cbr/\\u003eGenetic population models indicate
        that large populations (50-100 lion prides) are necessary to conserve genetic
        diversity and avoid inbreeding, which increases significantly when populations
        fall below 10 prides.  Male dispersal is also an important factor in conserving
        genetic variation (Bjorklund 2003).  These conditions are met in few wild
        lion populations, although there are at least 17 lion \\\"strongholds\\\"
        \\u0026gt;50,000 km\xB2 in extent (Bauer 2008).  \\u003cbr/\\u003e\\u003cbr/\\u003eOutside
        sub-Saharan Africa, the Asiatic lion \\u003cem\\u003eP. leo persica\\u003c/em\\u003e
        occurs as an isolated single wild population in India's Gir Forest.  The Gir
        lion population had been reduced to a very low number in the early years of
        the 20th century, possibly fewer than 20.  In 1936, 234 lions were estimated,
        falling to approximately 100 iin the 1970s, and estimates in the 1980s and
        1990s around 200 adults (Nowell and Jackson 1996).  In 2005,  the population
        was estimated at 359, +/- 10, including cubs, based on, according to the Chief
        Minister of Forests for Gujarat state, a total count of lions by direct sighting
        in a block-system methodology.  This is an increase from 327 reported in 2001
        (Anon. 2006).  The Wildlife Protection Society of India reported 34 lion deaths
        in 2007, due to poaching, electrocution, falling into open wells, and death
        by motor vehicle and unknown causes.  Single populations are vulnerable to
        extinction from catastrophic events, and it has long been recommended by scientists
        to establish a second wild population in Madhya Pradesh's Kuno Wildlife Sanctuary,
        but this has not yet been done (Jackson 2008).  The Asiatic lion shows reduced
        genetic variation due to small population size (O'Brien \\u003cem\\u003eet
        al.\\u003c/em\\u003e 1987).  It is feared that the size of the population
        is larger than the estimated carrying capacity of the habitat and prey base
        (Nowell and Jackson 1996).\",\"habitats\":\"The lion has a broad habitat tolerance,
        absent only from tropical rainforest and the interior of the Sahara desert
        (Nowell and Jackson 1996). There are records of lion to elevations of more
        than 4,000 m in the Bale Mountains and on Kilimanjaro (West and Packer in
        press).  Although lions drink regularly when water is available, they are
        capable of obtaining their moisture requirements from prey and even plants
        (such as the tsama melon in the Kalahari desert), and thus can survive in
        very arid environments. Medium- to large-sized ungulates (including antelopes,
        zebra and wildebeest) are the bulk of their prey, but lions will take almost
        any animal, from rodents to a rhino. They also scavenge, displacing other
        predators (such as the Spotted Hyaena) from their kills. \\u003cbr/\\u003e\\u003cbr/\\u003eLions
        are the most social of the cats, with related females remaining together in
        prides, and related and unrelated males forming coalitions competing for tenure
        over prides. Average pride size (including males and females) is four to six
        adults; prides generally break into smaller groups when hunting.  Lions tend
        to live at higher densities than most other felids, but with a wide variation
        from 1.5 adults per 100 km\xB2 in southern African semi-desert to 55/100 km\xB2
        in parts of the Serengeti (Sunquist and Sunquist 2002).  Pride ranges can
        vary widely even in the same region: e.g.,  from 266-4,532 km\xB2  in the
        Kgalagadi Transfrontier Park of South Africa (Funston 2001), and 20,500 km\xB2
        in the Serengeti (West and Packer in press). \\u003cbr/\\u003e\\u003cbr/\\u003eIn
        India, the habitat of the Asiatic lion is dry deciduous forest.  The Gir National
        Park and Wildlife Sanctuary is surrounded by cultivated areas and inhabited
        by the pastoralist Maldharis and their livestock.  Domestic cattle have historically
        been a major part of the Asiatic lion's diet, although the most common prey
        is the chital deer.  Mean pride size, measured by the number of adult females,
        tends to be smaller than for African lions: most Gir prides contain an average
        of two adult females (Nowell and Jackson 1996).\",\"threats\":\"The main threats
        to lions are indiscriminate killing (primarily as a result of retaliatory
        or pre-emptive killing to protect life and livestock) and prey base depletion.
        \ Habitat loss and conversion has led to a number of populations becoming
        small and isolated (Bauer 2008).  \\u003cbr/\\u003e\\u003cbr/\\u003eThe economic
        impact of stock raiding can be significant: Patterson \\u003cem\\u003eet al.\\u003c/em\\u003e
        (2004) estimated that each lion cost ranchers in Kenya living alongside Tsavo
        East National Park US$290 per year in livestock losses. Likewise, annual losses
        of cattle to lions in areas adjacent to Waza National Park in Cameroon comprised
        only about 3.1% of all livestock losses, but were estimated to represent more
        than 22% of financial losses amounting to about US$370 per owner (Bauer 2003).
        Consequently, lions are persecuted intensely in livestock areas across Africa;
        their scavenging behaviour makes them particularly vulnerable to poisoned
        carcasses put out to eliminate predators. Little actual information exists
        on the number of lions killed as problem animals by local people, even though
        this is considered the primary threat to their survival outside protected
        areas. Implementation of appropriate livestock management measures, coupled
        with problem animal control measures and mechanisms for compensating livestock
        losses, are some of the primary responses to resolving human-lion conflict
        (Frank \\u003cem\\u003eet al.\\u003c/em\\u003e 2006).\\u003cbr/\\u003e\\u003cbr/\\u003eTrophy
        hunting is carried out in a number of sub-Saharan African countries and is
        considered an important management tool for providing financial resource for
        lion conservation for both governments and local communities.  However, there
        is concern that current management regimes can lead to unsustainable offtakes
        (Packer \\u003cem\\u003eet al.\\u003c/em\\u003e 2006).\\u003cbr/\\u003e\\u003cbr/\\u003eDisease
        has also been a threat to lion populations (Ray \\u003cem\\u003eet al.\\u003c/em\\u003e
        2005).\\u003cbr/\\u003e\\u003cbr/\\u003eIn parts of southeastern Tanzania
        there have been alarmingly high incidences of people killed by lions, with
        up to 400 human lion-related fatalities recorded from 1997-2007 (Ikanda 2007).\",\"measures\":\"\\u003cem\\u003eP.
        leo\\u003c/em\\u003e is included in CITES Appendix II; the Critically Endangered
        Asiatic lion subspecies \\u003cem\\u003eP. leo persica\\u003c/em\\u003e is
        included in CITES Appendix I. \\u003cbr/\\u003e\\u003cbr/\\u003eIn Africa,
        lions are present in a number of large and well-managed protected areas, and
        remain one of the most popular animals on the must-see lists of tourists and
        visitors to Africa. Most range states in East and Southern Africa have an
        infrastructure which supports wildlife tourism, and in this way lions generate
        significant cash revenue for park management and local communities and provide
        a strong incentive for wildland conservation.\\u003cbr/\\u003e\\u003cbr/\\u003eRegional
        conservation strategies have been developed for lions in west and central
        Africa (IUCN 2006a) and eastern and southern Africa (IUCN 2006b).  The West
        and Central African Lion Conservation Strategy focuses on three primary objectives
        to address threats that directly impact lions:  to reduce lion-human conflict,
        and to conserve and increase lion habitat and wild prey base.  The objectivs
        of the Eastern and Southern African Lion Conservation Strategy are aarticulated
        around the root issues in lion conservation, including policy and land use,
        socio-economics, trade, and conservation politics.  For example, the policy
        and land use objective is \\\"to develop and implement harmonious and comprehensive
        legal and institutional frameworks that provide for the expansion of wildife-integrated
        land use, lion conservation and associated socio-economic benefits in current
        and potential lion range.\\\"  The trade objective is \\\"to prevent illegal
        trade in lions and lion products while promoting and safegarding sustainable
        legal trade.\\\"  Both regional strategies share common priorities of conserving
        and restoring lion populations, improving managemetn capacity, and increasing
        the flow of benefits to communities living with lions.  These strategies should
        be used by governments to guide national lion action plans, policies and programs,
        and by the conservation community to guide their project development.  By
        setting out common priorities to guide action on both national, community
        and landscape levels, the regional conservation strategies have the potential
        for broad and significant improvement of lion status and management (Nowell
        \\u003cem\\u003eet al.\\u003c/em\\u003e 2006).\\u003cbr/\\u003e\\u003cbr/\\u003eFor
        the Asiatic lion, resolving human lion-conflict is a high priority, as well
        as establishing a second wild population (Jackson 2008).\",\"use_trade\":null,\"rationale\":\"Lions
        are extinct in the Mediterranean region, having perhaps survived in the High
        Atlas Mountains up to the 1940s.\",\"trend_justification\":null,\"taxonomic_notes\":\"Based
        on genetic analysis (O'Brien \\u003cem\\u003eet al.\\u003c/em\\u003e 1987,
        Dubach \\u003cem\\u003eet al.\\u003c/em\\u003e 2005), two subspecies are recognized:
        \\u003cbr/\\u003e \\u003cbr/\\u003eAfrican lion \\u003cem\\u003ePanthera leo
        leo\\u003c/em\\u003e (Linnaeus, 1758) \\u003cbr/\\u003eAsiatic lion \\u003cem\\u003ePanthera
        leo persica\\u003c/em\\u003e (Meyer, 1826) \\u003cbr/\\u003e \\u003cbr/\\u003eIn
        their review in \\u003cem\\u003eMammalian Species\\u003c/em\\u003e, Haas \\u003cem\\u003eet
        al.\\u003c/em\\u003e (2005) recognized six African subspecies, although these
