# Informational index: every glaciers dataset id curated across the per-source
# *.yaml files in this directory (rgi / glims / wgms). The curated `datasets:`
# blocks live in those files; every curated id is a member of this list, and the
# loader enforces that. The glaciers surface is a small, hand-curated set (three
# sources, five datasets), so this index equals the curated keys — there is no
# larger auto-discovered universe to track. Verified live 2026-06-28 (see
# the A1 gate captures).
available_datasets:
  - rgi:outlines
  - glims:outlines
  - wgms:mass_balance
  - wgms:front_variation
  - wgms:state
