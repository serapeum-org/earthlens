# RGI 7.0 — Randolph Glacier Inventory, glacier outlines (vector).
#
# The "G" (glacier) product, one shapefile ZIP per GTN-G first-order region
# (01-19; region 20 "Antarctic Mainland" is the ice sheet, not in the G
# product). Served openly — no login — by the UNESCO IHP-WINS CKAN portal
# (the NSIDC host is Earthdata-gated). The backend maps a request bbox to the
# overlapping region(s) via the `regions:` table below, downloads + caches each
# region ZIP once, reads the inner shapefile via
# `pyramids FeatureCollection.read_file("/vsizip/<zip>/<shp>")`, and clips to
# the bbox. CRS is already EPSG:4326. Verified live 2026-06-28.

datasets:
  rgi:outlines:
    source: rgi
    output_kind: vector
    long_name: RGI 7.0 glacier outlines (per GTN-G region)
    citation: >-
      RGI 7.0 Consortium (2023), Randolph Glacier Inventory 7.0, DOI
      10.5067/F6JMOVY5NAVZ (CC-BY-4.0); open mirror UNESCO IHP-WINS.

# GTN-G first-order region table. `bboxes` are [west, south, east, north] in
# EPSG:4326, derived from the official RGI2000-v7.0-o1regions polygons. Region
# 10 (North Asia) crosses the antimeridian, so it carries two sub-boxes. `url`
# is the full IHP-WINS resource download (random resource UUID per region — no
# derivable template). Zip member names are lowercase; the inner `.shp` is
# uppercase and is resolved from the zip namelist at read time.
regions:
  "01":
    name: Alaska
    bboxes: [[-180.0, 50.0, -126.7917, 72.0]]
    url: https://ihp-wins.unesco.org/dataset/33a5017a-e6e9-43cc-82d6-62da7fbb74d8/resource/87ed4714-cdcf-45bd-9d1e-827082861656/download/rgi2000-v7.0-g-01_alaska.zip
