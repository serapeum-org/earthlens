# OSI SAF sea-ice concentration and sea-surface temperature collections.
# Ids, titles and start dates walked from the public browse endpoint
# (api.eumetsat.int/data/browse/collections) on 2026-05-26. Hand-tuned rows
# (HRSEVIRI, the S5P gases, ASCAT soil moisture, the MTG suite, ...) keep their
# vetted metadata; the rest carry browse-derived format/output_kind/cadence
# heuristics (advisory for the whole-product download) refined per product as
# needed. Reconcile with tools/eumetsat/audit_eumetsat_catalog.py.
datasets:
  osi-saf-amsr2-global-sea-ice-concentration-interim:
    collection_id: "EO:EUM:DAT:1064"
    group: OSI-SAF
    mission: multi
    output_kind: raster
    format: netcdf
    cadence: irregular
    selectors: []
    tailor_product_type: null
    extent: { lat: [-90, 90], lon: [-180, 180] }
    temporal: { start: 2021-01-01, end: null }
  osi-saf-global-sea-ice-concentration-interim-climate:
    collection_id: "EO:EUM:DAT:0645"
    group: OSI-SAF
    mission: multi
    output_kind: raster
    format: netcdf
    cadence: irregular
    selectors: []
    tailor_product_type: null
    extent: { lat: [-90, 90], lon: [-180, 180] }
    temporal: { start: 2023-09-03, end: null }
  osi-saf-metop-sst:
    collection_id: "EO:EUM:DAT:METOP:GLB-SST-NC"
    group: OSI-SAF
    mission: metop
    output_kind: raster
    format: netcdf
    cadence: subdaily
    selectors: [GLB-SST-NC]
    tailor_product_type: GLBSST
    extent: { lat: [-90.0, 90.0], lon: [-180.0, 180.0] }
    temporal: { start: 2016-01-01, end: null }
  osi-saf-sea-ice-conc:
