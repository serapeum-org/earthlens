# Source Cooperative — no STAC-queryable named repos register here (yet).
#
# A1 probe (2026-06-17): the three named candidate repos all return HTTP 403
# on the direct https://data.source.coop/<owner>/<name>/catalog.json URL,
# indicating they are **flat S3 prefixes** rather than static STAC catalogs
# or STAC APIs. Per `G4` in the STAC extensions plan, flat-S3 Source
# Cooperative repos are out of scope for the STAC backend; they belong as
# future `earthlens.s3` (or `worldpop`-shaped) dataset rows.
#
# Excluded flat-S3 candidates:
#   - radiantearth/gebco-2024            (GEBCO 2024 bathymetry COGs)
#   - microsoft/global-ml-buildings      (Microsoft Global ML Buildings mirror)
#   - overturemaps/release               (Overture Maps release mirror)
#
# A new STAC-queryable Source Cooperative repo would land here as a separate
# `endpoints:` entry in `_index.yaml` (key `source-coop-<repo-slug>`) plus a
# curated `collections:` block in this file (keyed `source-coop-<slug>/<id>`),
# one endpoint per repo — there is no single SoCo STAC API. Update the facade
# `_LazyRegistry` to register the new key and rerun the catalog tests.
