# Curated collections served by Digital Earth Australia (Open Data Cube STAC
# over AWS ap-southeast-2). All assets are anonymous on `s3://dea-public-data`;
# the endpoint default signer (`anonymous`) applies — no per-row override.
#
# Five collections (ARD + WOfS) carry full asset blocks probed from live items;
# the remaining five (FC, GeoMedian, Intertidal, Mangrove, SRTM DEM) are
# curated with conservative asset blocks based on the DEA product
# documentation since the live STAC API did not return sample items for them
# during the A1 probe — refine when items become discoverable.

collections:
  dea/ga_ls8c_ard_3:
    assets:
      nbart_blue:
        common_name: blue
        title: NBART blue surface reflectance
      nbart_coastal_aerosol:
        common_name: coastal
        title: NBART coastal/aerosol surface reflectance
      nbart_green:
        common_name: green
        title: NBART green surface reflectance
      nbart_nir:
        common_name: nir
        title: NBART near-infrared surface reflectance
      nbart_panchromatic:
        common_name: pan
        title: NBART panchromatic
      nbart_red:
        common_name: red
        title: NBART red surface reflectance
      nbart_swir_1:
        common_name: swir16
        title: NBART SWIR1 surface reflectance
      nbart_swir_2:
        common_name: swir22
        title: NBART SWIR2 surface reflectance
    collection_id: ga_ls8c_ard_3
    default_assets:
    - nbart_red
    - nbart_green
    - nbart_blue
    - nbart_nir
    endpoint: dea
  dea/ga_ls8c_nbart_gm_cyear_3:
