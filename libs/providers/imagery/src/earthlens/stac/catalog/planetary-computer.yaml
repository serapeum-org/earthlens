# Curated collections served by Microsoft Planetary Computer.
# Endpoint-namespaced COG-imagery entries (<endpoint>/<id>) are bulk-curated
# from item_assets by _curate_cog.py; the bare keys are hand-curated.

collections:
  cop-dem-glo-30:
    aliases:
      earth-search: cop-dem-glo-30
    assets:
      data:
        common_name: elevation
        dtype: float32
        title: Copernicus DEM GLO-30 elevation
    collection_id: cop-dem-glo-30
    default_assets:
    - data
    endpoint: planetary-computer
    extent:
      bbox:
      - -180.0
      - -90.0
      - 180.0
      - 90.0
      start_date: '2021-04-22'
    resolution: 30.0
