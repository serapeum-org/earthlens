  sentinel-2-l2a:
    aliases:
      cdse: sentinel-2-l2a
      earth-search: sentinel-2-c1-l2a
    # HAND-CURATED, like the `aliases` block above: no tool derives it.
    # CDSE publishes Sentinel-2 per resolution, so the catalog's B04 is
    # B04_10m there, and nothing in the upstream STAC metadata says so.
    # `refresh stac --write` only rewrites the available_* index in
    # _index.yaml, and `curate` has no stac emitter, so this file is
    # maintained by hand -- keep the two blocks in step when either
    # changes. See docs/reference/stac/introduction.md.
    asset_aliases:
      cdse:
        B02: B02_10m
        B03: B03_10m
        B04: B04_10m
        B08: B08_10m
    assets:
      B02:
        common_name: blue
        dtype: uint16
        nodata: 0
        title: Blue (490 nm)
      B03:
        common_name: green
        dtype: uint16
        nodata: 0
        title: Green (560 nm)
      B04:
        common_name: red
        dtype: uint16
        nodata: 0
        title: Red (665 nm)
      B08:
        common_name: nir
        dtype: uint16
        nodata: 0
        title: NIR (842 nm)
    cadence: 5-day
    collection_id: sentinel-2-l2a
    default_assets:
    - B02
    - B03
    - B04
    - B08
    endpoint: planetary-computer
    extent:
      bbox:
      - -180.0
      - -90.0
      - 180.0
      - 90.0
      start_date: '2015-06-27'
    resolution: 10.0
