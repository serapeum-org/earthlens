# Curated CDSE openEO collections (logical key -> collection metadata).
#
# Every collection_id is the UPPERCASE openEO id verified live against
# https://openeo.dataspace.copernicus.eu; the `bands:` mapping carries the
# per-band metadata from `describe_collection` (eo:bands) -- common_name,
# description, units, dtype, gsd, center_wavelength, min/max where the backend
# advertises them. `default_bands` is what `load_collection` pulls when a
# request names no bands. All 19 CDSE openEO collections are curated (the same
# set as `_index.yaml::available_collections`); regenerate band metadata with
# `tools/openeo/probe_openeo_collection.py`.
