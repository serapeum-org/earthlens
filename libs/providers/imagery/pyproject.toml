[build-system]
requires = ["setuptools>=80.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "earthlens-imagery"
version = "0.19.0"
description = "satellite platform, SAR and EO catalog backends for earthlens"
readme = { file = "README.md", content-type = "text/markdown" }
authors = [
    { name = "Mostafa Farrag", email = "moah.farag@gmail.com" }
]
license = "GPL-3.0-only"
keywords = ["remote sensing", "imagery"]

classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: Console",
    "Natural Language :: English",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering :: GIS",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Developers",
]

requires-python = ">=3.11,<4"

# Only the core abstractions. Every provider SDK is an extra, so installing
# this distribution brings the backends' code without their dependencies —
# `pip install earthlens-imagery[<backend>]` adds exactly one backend's SDK.
dependencies = [
    "earthlens-core ==0.19.0",
    # Reprojects the lat/lon AOI when a projected output `crs` is requested. Not
    # behind the `[eedai]` extra: the CRS-support check runs from the eligibility
    # gate before the extra is consulted, so a projected request imports pyproj
    # whether or not the reader is installed.
    "pyproj >=3.7.0",
]

[project.optional-dependencies]
earthdata = ["earthaccess >=0.18.0; python_version >= '3.12'"]
asf = ["asf_search >=12.2.2", "earthlens-imagery[earthdata]"]
eedai = ["pyramids-eo >=0.5.0,<0.6"]
eumetsat = ["eumdac >=3.1"]
gee = ["earthengine-api >=1.7.26", "google-api-python-client >=2.0", "google-cloud-storage >=2.0", "Rtree >=1.0.0", "urllib3 >=1.26"]
jaxa = ["jaxa.earth >=0.1.6,<0.2", "gportal >=0.4,<0.5"]
openeo = ["openeo >=0.47,<0.52"]
sentinel-hub = ["sentinelhub >=3.11.5"]
stac = ["pyramids-gis[stac] >=0.58.0"]

# This distribution's slice of the facade's data-source table.
[project.entry-points."earthlens.backends"]
imagery = "earthlens._imagery:BACKENDS"

[project.entry-points."earthlens.cli"]
imagery = "earthlens._imagery_cli:CLI_TOOLING"

[project.urls]
Homepage = "https://github.com/serapeum-org/earthlens"

# Ships only its own backends plus its registry package. `earthlens` itself is
# a PEP 420 namespace (no `__init__.py` in any distribution), so no two wheels
# write the same path.
[tool.setuptools.packages.find]
where = ["src"]
# `earthlens` is a PEP 420 namespace shared across all distributions, so
# `namespaces = true` lets setuptools discover the __init__-less parent (matches
# earthlens-core).
namespaces = true
include = ["earthlens._imagery*", "earthlens.asf*", "earthlens.earthdata*", "earthlens.eumetsat*", "earthlens.gee*", "earthlens.jaxa*", "earthlens.openeo*", "earthlens.sentinel_hub*", "earthlens.stac*"]

[tool.setuptools.package-data]
"*" = ["*.yaml", "catalog/*.yaml"]
# Sentinel Hub ships its bundled evalscript recipes; read_evalscript() reads
# these at request time, so they must be in the wheel.
"earthlens.sentinel_hub" = ["evalscripts/*.js"]
# earthdata ships its auto-generated dataset index alongside the curated YAML.
"earthlens.earthdata" = ["catalog/*.json"]

# Resolve the core distribution from the workspace, not PyPI, so this package
# locks and develops against the local earthlens-core.
[tool.uv.sources]
earthlens-core = { workspace = true }

# Per-distribution pytest config: lets this member's tests run standalone
# (`cd libs/providers/imagery && uv run pytest`, or `pytest -c libs/providers/imagery/pyproject.toml libs/providers/imagery/tests`).
# The root pyproject aggregates all six member test roots for the whole-suite run.
[tool.pytest.ini_options]
testpaths = "tests"
consider_namespace_packages = true
addopts = "--import-mode=importlib"
markers = [
    "asf: tests for the ASF InSAR backend (requires the `asf` extra: asf_search; reuses EDL auth from `earthdata`).",
    "e2e: end-to-end test against a live external service (e.g. CDS); select with `-m e2e`.",
    "earthdata: tests for the NASA Earthdata backend (requires the `earthdata` extra: earthaccess; Python >=3.12).",
    "eumetsat: tests for the EUMETSAT Data Store backend (requires the `eumetsat` extra: eumdac).",
    "gee: tests for the Google Earth Engine backend (requires the `gee` extra: earthengine-api).",
    "integration: exercises multiple modules together with mocked I/O.",
    "jaxa: tests for the JAXA backend (three protocols — authless STAC/COG via jaxa.earth, credentialed SFTP via gportal, credentialed FTP via P-Tree/Himawari; the jaxa-earth and gportal branches need the `jaxa` extra, the ptree branch uses stdlib `ftplib` only).",
    "openeo: tests for the openEO server-side-processing backend (requires the `openeo` extra: openeo).",
    "ptree: e2e-only selector for the live P-Tree Himawari HSD FTP fetch (needs $JAXA_PTREE_USERNAME + $JAXA_PTREE_PASSWORD; 30-day rolling archive; the no-network ptree unit tests carry `@pytest.mark.jaxa + @pytest.mark.unit` instead so `-m ptree` does not pick them up).",
    "sentinel_hub: tests for the Sentinel Hub server-side-render backend (requires the `sentinel-hub` extra: sentinelhub).",
    "slow: mark test as slow.",
    "stac: tests for the STAC backend (requires the `stac` extra: pyramids-gis[stac] → pystac-client + stac-asset).",
    "unit: in-process unit test, no network or filesystem outside tmp_path.",
]
