[build-system]
requires = ["setuptools>=80.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "earthlens-imagery"
version = "0.29.0"
description = "satellite platform, SAR and EO catalog backends for earthlens"
readme = { file = "README.md", content-type = "text/markdown" }
authors = [
    { name = "Mostafa Farrag", email = "moah.farag@gmail.com" }
]
license = "GPL-3.0-only"
keywords = ["remote sensing", "imagery"]

classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: Console",
    "Natural Language :: English",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering :: GIS",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Developers",
]

requires-python = ">=3.11,<4"

# Only the core abstractions. Every provider SDK is an extra, so installing
# this distribution brings the backends' code without their dependencies —
# `pip install earthlens-imagery[<backend>]` adds exactly one backend's SDK.
dependencies = [
    "earthlens-core ==0.29.0",
    # Reprojects the lat/lon AOI when a projected output `crs` is requested. Not
    # behind the `[eedai]` extra: the CRS-support check runs from the eligibility
    # gate before the extra is consulted, so a projected request imports pyproj
    # whether or not the reader is installed.
    "pyproj >=3.7.0",
    # pyramids-eo: the EO tier on top of pyramids. A base dependency, not an
    # extra, because `earthlens.gee.analysis.TasseledCap` ships in the analysis
    # surface and applies pyramids-eo's per-sensor tasseled-cap coefficients
    # (`pyramids_eo.spectral.tasseled_cap`, added in pyramids-eo#117 / 0.9.0).
    # The floor is 0.11.0: that release pins pyramids-core >=0.71.0
    # (pyramids-eo#127/#128), the version whose #1348 routes a custom S3 endpoint
    # to GDAL's multi-threaded read workers -- which is what lets the CDSE signer
    # read eodata without the GDAL_NUM_THREADS=1 stopgap. One consequence of
    # pyramids-eo always being present: `engine="auto"` now prefers the EEDAI
    # reader whenever it can serve a raw fetch -- previously that preference was
    # gated on the (now redundant) `[eedai]` extra being installed, which was how
    # the reader stayed opt-in. The reader is still only *reachable* through
    # `engine=`, so `engine="ee"` keeps Earth Engine's exact semantics.
    "pyramids-eo >=0.11.0,<0.12",
]

[project.optional-dependencies]
earthdata = ["earthaccess >=0.18.0; python_version >= '3.12'"]
asf = ["asf_search >=12.2.2", "earthlens-imagery[earthdata]"]
# pyramids-eo is now a base dependency (see `[project.dependencies]`), so this
# extra is redundant -- retained as a no-op alias so `earthlens-imagery[eedai]`
# (and the meta-package's `[eedai]`) keep resolving. The floor is kept in step
# with the base pin.
eedai = ["pyramids-eo >=0.11.0,<0.12"]
eumetsat = ["eumdac >=3.1"]
# scikit-learn drives the two client-side learning operations in
# `earthlens.gee.analysis` (k-means clustering and the supervised classifier).
# It is imported lazily through `analysis/_sklearn.py`, the same guarded shape
# `_eedai.py` uses, so the import cost is paid only by a request that asks for
# one of those operations - but it is declared here because the code imports it.
gee = ["earthengine-api >=1.7.26", "google-api-python-client >=2.0", "google-cloud-storage >=2.0", "Rtree >=1.0.0", "scikit-learn >=1.5", "urllib3 >=1.26"]
jaxa = ["jaxa.earth >=0.1.6,<0.2", "gportal >=0.4,<0.5"]
openeo = ["openeo >=0.47,<0.52"]
sentinel-hub = ["sentinelhub >=3.11.5"]
stac = ["pyramids-core[stac] >=0.71.0"]

# This distribution's slice of the facade's data-source table.
[project.entry-points."earthlens.backends"]
imagery = "earthlens._imagery:BACKENDS"

[project.entry-points."earthlens.cli"]
imagery = "earthlens._imagery_cli:CLI_TOOLING"

[project.urls]
Homepage = "https://github.com/serapeum-org/earthlens"

# Ships only its own backends plus its registry package. `earthlens` itself is
# a PEP 420 namespace (no `__init__.py` in any distribution), so no two wheels
# write the same path.
[tool.setuptools.packages.find]
where = ["src"]
# `earthlens` is a PEP 420 namespace shared across all distributions, so
# `namespaces = true` lets setuptools discover the __init__-less parent (matches
# earthlens-core).
namespaces = true
include = ["earthlens._imagery*", "earthlens.asf*", "earthlens.earthdata*", "earthlens.eumetsat*", "earthlens.gee*", "earthlens.jaxa*", "earthlens.openeo*", "earthlens.sentinel_hub*", "earthlens.stac*"]

[tool.setuptools.package-data]
"*" = ["*.yaml", "catalog/*.yaml"]
# Sentinel Hub ships its bundled evalscript recipes; read_evalscript() reads
# these at request time, so they must be in the wheel.
"earthlens.sentinel_hub" = ["evalscripts/*.js"]
# earthdata ships its auto-generated dataset index alongside the curated YAML.
"earthlens.earthdata" = ["catalog/*.json"]

# Resolve the core distribution from the workspace, not PyPI, so this package
# locks and develops against the local earthlens-core.
[tool.uv.sources]
earthlens-core = { workspace = true }

# Per-distribution pytest config: lets this member's tests run standalone
# (`cd libs/providers/imagery && uv run pytest`, or `pytest -c libs/providers/imagery/pyproject.toml libs/providers/imagery/tests`).
# The root pyproject aggregates all six member test roots for the whole-suite run.
[tool.pytest.ini_options]
testpaths = "tests"
consider_namespace_packages = true
addopts = "--import-mode=importlib --strict-markers"
