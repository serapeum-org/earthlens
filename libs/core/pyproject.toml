[build-system]
requires = ["setuptools>=80.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "earthlens-core"
version = "0.21.0"
description = "Core abstractions, facade and CLI for earthlens — no provider SDKs"
readme = { file = "README.md", content-type = "text/markdown" }
authors = [
    { name = "Mostafa Farrag", email = "moah.farag@gmail.com" }
]
license = "GPL-3.0-only"
keywords = ["remote sensing", "ecmwf"]

classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: Console",
    "Natural Language :: English",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering :: GIS",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Developers",
]

requires-python = ">=3.11,<4"

# Core carries only what is always reachable: the package surface, the
# `EarthLens` facade, the abstractions every backend subclasses, and the
# unconditionally-registered console script. No provider SDK belongs here —
# those live in the thematic provider distributions' own dependencies.
dependencies = [
    "pyramids-gis >=0.59.0",
    "geopandas >=1.0.0",
    "joblib >=1.5.0",
    "loguru >=0.7.3",
    "numpy >=2.0.0",
    "pandas >=2.0.0",
    "platformdirs >=3.0.0",
    "pydantic >=2.0",
    "pyproj >=3.7.0",
    "PyYAML >=6.0.2",
    "requests >=2.28.1",
    "shapely >=2.0.0",
    "tqdm >=4.66.0",
    "typer >=0.12",
    "urllib3 >=1.26",
    "rich >=13",
]

# Unsigned AWS S3 is a shared transport (`earthlens.base.s3`), not any one
# provider's concern: the ERA5, Copernicus DEM, GOES, radar and NWM backends
# all read open buckets through it. `boto3` lives here with the code that
# imports it, so a provider distribution never depends on a sibling for it.
[project.optional-dependencies]
s3 = ["boto3 >=1.43.0", "botocore >=1.34.0"]
# `earthlens.testing` ships the pytest fixtures each member's tests/conftest.py
# imports (and that downstream code testing its own backend can reuse). It is
# the one module in core that imports pytest, so the dependency is declared here
# rather than relied on transitively; nothing in the runtime package imports it.
#
# RELEASE NOTE: this module and this extra are new in the working tree while
# `version` is still 0.12.0, and every provider pins `earthlens-core ==0.12.0`.
# Nothing shipped breaks — provider wheels package only `src/earthlens/<backend>*`,
# so the conftests that import it never leave the repo, where core and the
# providers are always in lockstep. But a downstream caller taking core at its
# word and importing `earthlens.testing` from a published 0.12.0 would not find
# it. Bump core (and the provider pins) before the next release rather than
# shipping a new public module under an old version number.
test = ["pytest >=8"]

[project.scripts]
earthlens = "earthlens.cli:main"

[project.urls]
Homepage = "https://github.com/serapeum-org/earthlens"

# `earthlens` is a PEP 420 namespace (no `earthlens/__init__.py` in any
# distribution); core ships the `earthlens.core` entry point plus its
# subpackages and loose modules, and each provider ships only its own
# `earthlens/<provider>/*`, so no two wheels write the same path.
[tool.setuptools.packages.find]
where = ["src"]
# `earthlens` is a PEP 420 namespace (no __init__.py) shared with the provider
# distributions; core ships the `earthlens.core` entry point plus the shared
# subpackages. `namespaces = true` is required so setuptools discovers the
# namespace and its loose top-level modules (earthlens.py, aggregate.py, …).
namespaces = true
include = ["earthlens*"]

[tool.setuptools.package-data]
"*" = ["*.yaml", "catalog/*.yaml"]

# Per-distribution pytest config: lets this member's tests run standalone
# (`cd libs/core && uv run pytest`, or `pytest -c libs/core/pyproject.toml libs/core/tests`).
# The root pyproject aggregates all six member test roots for the whole-suite run.
[tool.pytest.ini_options]
testpaths = "tests"
consider_namespace_packages = true
addopts = "--import-mode=importlib"
markers = [
    "biodiversity: tests for the shared biodiversity-cluster helpers (`wkt_from_bbox`, `occurrences_to_fc`, `LicenseWarning`; no extra SDK).",
    "chc: tests for the Climate Hazards Center (CHC) FTP backend (no extra SDK; covers CHIRPS / CHIRP / CHIRTS / WBGT / SPI / SPEI / CHC_CMIP6 etc.).",
    "cli: tests for the `earthlens` console script / federated catalog-query CLI (typer and rich are core dependencies; no extra needed).",
    "e2e: end-to-end test against a live external service (e.g. CDS); select with `-m e2e`.",
    "ecmwf: tests for the ECMWF/CDS backend (requires the `ecmwf` extra: cdsapi).",
    "gee: tests for the Google Earth Engine backend (requires the `gee` extra: earthengine-api).",
    "integration: exercises multiple modules together with mocked I/O.",
    "nwm: tests for the NOAA National Water Model backend (requires the `nwm` extra: boto3; unsigned noaa-nwm-pds bucket).",
    "s3: tests for the S3 backend (requires the `s3` extra: boto3).",
    "slow: mark test as slow.",
    "unit: in-process unit test, no network or filesystem outside tmp_path.",
]
