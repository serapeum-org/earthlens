<svg xmlns="http://www.w3.org/2000/svg" viewBox="34 66 444 774" width="444" height="774"
  role="img" aria-label="earthlens logo: a satellite resolving the Earth through the pyramids stack of downscaled raster overviews">
  <defs>
    <radialGradient id="ocean" cx="0.38" cy="0.32" r="0.85">
      <stop offset="0" stop-color="#5A93BE"/>
      <stop offset="0.5" stop-color="#234C70"/>
      <stop offset="1" stop-color="#0A2036"/>
    </radialGradient>
    <radialGradient id="hi3d" cx="0.30" cy="0.26" r="0.62">
      <stop offset="0" stop-color="#DCF2FF" stop-opacity="0.40"/>
      <stop offset="0.55" stop-color="#DCF2FF" stop-opacity="0.06"/>
      <stop offset="1" stop-color="#DCF2FF" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="sh3d" cx="0.74" cy="0.82" r="0.95">
      <stop offset="0" stop-color="#04101E" stop-opacity="0.60"/>
      <stop offset="0.45" stop-color="#04101E" stop-opacity="0.24"/>
      <stop offset="1" stop-color="#04101E" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <g id="rig" transform="translate(0,60) translate(256,40) scale(0.78) translate(-256,-40)">
  <!-- satellite -->
  <g>
    <!-- left panel -->
    <polygon points="234,44 186,20 202,12 250,36" fill="#2E9CB8" stroke="#14555E" stroke-width="1.2"/>
    <path d="M218,32 L234,24 M202,24 L218,16" stroke="#14555E" stroke-width="1.2" fill="none"/>
    <!-- right panel -->
    <polygon points="276,52 324,76 340,68 292,44" fill="#2E9CB8" stroke="#14555E" stroke-width="1.2"/>
    <path d="M292,60 L308,52 M308,68 L324,60" stroke="#14555E" stroke-width="1.2" fill="none"/>
    <!-- body: the pyramids gem cube -->
    <polygon points="256,34 274,43 256,52 238,43" fill="#2CA6A4"/>
    <polygon points="238,43 256,52 256,74 238,65" fill="#1F8B8A"/>
    <polygon points="256,52 274,43 274,65 256,74" fill="#15706F"/>
    <circle cx="256" cy="80" r="2.8" fill="#F2C879"/>
  </g>

  <!-- capture frustum from satellite onto the full-res level -->
  <path d="M256,84 L128,332 M256,84 L384,332" stroke="#8FD8D2" stroke-width="1.8"
    stroke-dasharray="5 5" opacity="0.7" fill="none"/>
  <polygon points="256,84 384,332 256,396 128,332" fill="#8FD8D2" opacity="0.06"/>

  <g transform="translate(256,270) scale(0.8) translate(-256,-270)">
  <!-- normal (upright) overview pyramid: full-res base near the globe, thumbnail capstone near the satellite -->
  <g>
    <polygon points="96,348 256,428 256,452 96,372" fill="#A89F72"/>
    <polygon points="256,428 416,348 416,372 256,452" fill="#8D855E"/>
    <g transform="matrix(160,80,160,-80,96,348)" stroke="#0A2228" stroke-opacity="0.25" stroke-width="0.006">
        <rect x="0" y="0" width="0.167" height="0.167" fill="#8FB573"/>
        <rect x="0.167" y="0" width="0.167" height="0.167" fill="#8FB573"/>
        <rect x="0.333" y="0" width="0.167" height="0.167" fill="#D9BC7E"/>
        <rect x="0.5" y="0" width="0.167" height="0.167" fill="#8FB573"/>
        <rect x="0.667" y="0" width="0.167" height="0.167" fill="#5FA8C0"/>
        <rect x="0.833" y="0" width="0.167" height="0.167" fill="#5FA8C0"/>
        <rect x="0" y="0.167" width="0.167" height="0.167" fill="#8FB573"/>
        <rect x="0.167" y="0.167" width="0.167" height="0.167" fill="#D9BC7E"/>
        <rect x="0.333" y="0.167" width="0.167" height="0.167" fill="#8FB573"/>
        <rect x="0.5" y="0.167" width="0.167" height="0.167" fill="#5FA8C0"/>
        <rect x="0.667" y="0.167" width="0.167" height="0.167" fill="#5FA8C0"/>
        <rect x="0.833" y="0.167" width="0.167" height="0.167" fill="#D9BC7E"/>
        <rect x="0" y="0.333" width="0.167" height="0.167" fill="#D9BC7E"/>
        <rect x="0.167" y="0.333" width="0.167" height="0.167" fill="#8FB573"/>
        <rect x="0.333" y="0.333" width="0.167" height="0.167" fill="#5FA8C0"/>
        <rect x="0.5" y="0.333" width="0.167" height="0.167" fill="#5FA8C0"/>
        <rect x="0.667" y="0.333" width="0.167" height="0.167" fill="#8FB573"/>
        <rect x="0.833" y="0.333" width="0.167" height="0.167" fill="#8FB573"/>
        <rect x="0" y="0.5" width="0.167" height="0.167" fill="#8FB573"/>
        <rect x="0.167" y="0.5" width="0.167" height="0.167" fill="#5FA8C0"/>
        <rect x="0.333" y="0.5" width="0.167" height="0.167" fill="#5FA8C0"/>
        <rect x="0.5" y="0.5" width="0.167" height="0.167" fill="#8FB573"/>
        <rect x="0.667" y="0.5" width="0.167" height="0.167" fill="#D9BC7E"/>
        <rect x="0.833" y="0.5" width="0.167" height="0.167" fill="#8FB573"/>
        <rect x="0" y="0.667" width="0.167" height="0.167" fill="#5FA8C0"/>
        <rect x="0.167" y="0.667" width="0.167" height="0.167" fill="#5FA8C0"/>
        <rect x="0.333" y="0.667" width="0.167" height="0.167" fill="#8FB573"/>
        <rect x="0.5" y="0.667" width="0.167" height="0.167" fill="#D9BC7E"/>
        <rect x="0.667" y="0.667" width="0.167" height="0.167" fill="#8FB573"/>
        <rect x="0.833" y="0.667" width="0.167" height="0.167" fill="#D9BC7E"/>
        <rect x="0" y="0.833" width="0.167" height="0.167" fill="#5FA8C0"/>
        <rect x="0.167" y="0.833" width="0.167" height="0.167" fill="#8FB573"/>
        <rect x="0.333" y="0.833" width="0.167" height="0.167" fill="#D9BC7E"/>
        <rect x="0.5" y="0.833" width="0.167" height="0.167" fill="#8FB573"/>
        <rect x="0.667" y="0.833" width="0.167" height="0.167" fill="#8FB573"/>
        <rect x="0.833" y="0.833" width="0.167" height="0.167" fill="#D9BC7E"/>
      </g>
  </g>
  <g>
    <polygon points="152,248 256,300 256,320 152,268" fill="#99A084"/>
    <polygon points="256,300 360,248 360,268 256,320" fill="#7F866C"/>
    <g transform="matrix(104,52,104,-52,152,248)" stroke="#0A2228" stroke-opacity="0.25" stroke-width="0.008">
        <rect x="0" y="0" width="0.334" height="0.334" fill="#9AB286"/>
        <rect x="0.333" y="0" width="0.334" height="0.334" fill="#CDB67F"/>
        <rect x="0.666" y="0" width="0.334" height="0.334" fill="#74A8B5"/>
        <rect x="0" y="0.333" width="0.334" height="0.334" fill="#CDB67F"/>
        <rect x="0.333" y="0.333" width="0.334" height="0.334" fill="#74A8B5"/>
        <rect x="0.666" y="0.333" width="0.334" height="0.334" fill="#9AB286"/>
        <rect x="0" y="0.666" width="0.334" height="0.334" fill="#74A8B5"/>
        <rect x="0.333" y="0.666" width="0.334" height="0.334" fill="#9AB286"/>
        <rect x="0.666" y="0.666" width="0.334" height="0.334" fill="#CDB67F"/>
      </g>
  </g>
  <g>
    <polygon points="196,160 256,190 256,206 196,176" fill="#8C9379"/>
    <polygon points="256,190 316,160 316,176 256,206" fill="#747B64"/>
    <g transform="matrix(60,30,60,-30,196,160)" stroke="#0A2228" stroke-opacity="0.25" stroke-width="0.01">
        <rect x="0" y="0" width="0.5" height="0.5" fill="#BBA97E"/>
        <rect x="0.5" y="0" width="0.5" height="0.5" fill="#84A7AE"/>
        <rect x="0" y="0.5" width="0.5" height="0.5" fill="#84A7AE"/>
        <rect x="0.5" y="0.5" width="0.5" height="0.5" fill="#93A88C"/>
      </g>
  </g>
  <g>
    <polygon points="256,88 286,103 256,118 226,103" fill="#9FA98F"/>
    <polygon points="226,103 256,118 256,136 226,121" fill="#828C74"/>
    <polygon points="256,118 286,103 286,121 256,136" fill="#6F7A62"/>
  </g>

  <!-- focus line from the pyramid tip down to the globe -->
  <path d="M256,454 L256,462" stroke="#F2C879" stroke-width="2.2" stroke-dasharray="4 4" opacity="0.8" fill="none"/>
  <!-- tiles resolving off the globe up into the pyramid -->
  <g stroke="#0A2228" stroke-opacity="0.2" stroke-width="0.5">
    <polygon points="222,446 238,454 222,462 206,454" fill="#8FB573" opacity="0.85"/>
    <polygon points="292,442 308,450 292,458 276,450" fill="#5FA8C0" opacity="0.85"/>
    <polygon points="256,432 270,439 256,446 242,439" fill="#D9BC7E" opacity="0.7"/>
  </g>
  </g>
  </g><!-- /rig -->

  <g id="globe" transform="translate(256,618) scale(1.26) translate(-256,-618)">
  <!-- the Earth (Africa-centered) -->
  <g>
    <circle cx="256" cy="618" r="155" fill="url(#ocean)"/>
    <!-- Africa -->
    <path d="M232,548 C250,542 272,544 286,552 C296,558 296,570 292,580 C288,590 284,596 286,606
             C288,620 282,634 272,648 C266,657 262,672 254,674 C246,676 242,664 240,654
             C237,640 230,632 224,620 C218,606 214,592 216,578 C218,564 220,552 232,548 Z" fill="#6E97AE"/>
    <!-- Sahara band -->
    <path d="M228,566 C246,558 274,558 290,568 C294,573 292,580 286,583 C266,589 244,589 232,582 C226,578 224,570 228,566 Z"
      fill="#C6B98E" opacity="0.85"/>
    <!-- Eurasia -->
    <path d="M240,540 C258,524 292,520 316,530 C332,537 330,549 314,553 C300,556 292,552 284,556
             C274,561 262,558 252,556 C242,554 232,550 240,540 Z" fill="#7AA0B6"/>
    <!-- Arabia -->
    <path d="M300,566 C312,560 326,564 330,574 C333,584 324,592 314,590 C305,588 296,578 300,566 Z" fill="#C6B98E"/>
    <!-- South America at the west limb -->
    <path d="M138,596 C150,590 162,596 162,608 C162,618 156,624 154,634 C152,646 146,660 138,660
             C132,660 130,650 132,640 C134,628 128,618 132,608 C134,601 134,600 138,596 Z" fill="#6E97AE" opacity="0.92"/>
    <!-- Madagascar -->
    <ellipse cx="300" cy="662" rx="7" ry="12" fill="#6E97AE" transform="rotate(20 300 662)"/>
    <!-- natural features -->
    <clipPath id="natclip"><circle cx="256" cy="618" r="155"/></clipPath>
    <g clip-path="url(#natclip)">
      <!-- extra continent SE (Australia-like) -->
      <path d="M328,640 C346,630 376,630 392,644 C402,653 400,666 386,670 C374,673 368,668 356,670
               C342,672 328,668 324,656 C321,648 320,644 328,640 Z" fill="#4E8C6A"/>
      <path d="M336,644 C354,637 376,639 386,648 C377,653 362,655 350,654 C341,653 332,650 336,644 Z"
        fill="#C6B98E" opacity="0.7"/>
      <!-- northern continent cap -->
      <path d="M298,510 C324,499 362,499 384,512 C396,519 392,531 375,534 C358,537 348,532 335,535
               C322,538 307,535 298,529 C291,524 290,516 298,510 Z" fill="#5E8AA6"/>

      <!-- ocean currents -->
      <path d="M104,600 C138,586 164,610 140,632" fill="none" stroke="#7FB6D8" stroke-width="2.2" opacity="0.35" stroke-linecap="round"/>
      <path d="M362,694 C392,684 402,704 376,716" fill="none" stroke="#7FB6D8" stroke-width="1.8" opacity="0.3" stroke-linecap="round"/>

      <!-- BIG FOREST: layered canopy + tree texture across central/southern Africa -->
      <path d="M224,614 C244,598 274,600 286,622 C296,640 288,668 262,680 C240,689 216,676 214,654
               C213,636 212,624 224,614 Z" fill="#2F8F53"/>
      <path d="M230,620 C248,608 270,610 280,626 C288,642 280,664 260,672 C240,679 224,668 224,650
               C224,638 222,628 230,620 Z" fill="#3EA863" opacity="0.92"/>
      <g fill="#1F6338" opacity="0.85">
        <circle cx="240" cy="632" r="4.4"/><circle cx="256" cy="626" r="5"/><circle cx="270" cy="638" r="4"/>
        <circle cx="246" cy="650" r="4.6"/><circle cx="262" cy="654" r="4.2"/><circle cx="234" cy="644" r="3.6"/>
        <circle cx="252" cy="644" r="3.8"/><circle cx="268" cy="626" r="3.4"/><circle cx="256" cy="666" r="3.6"/>
        <circle cx="242" cy="664" r="3"/>
      </g>
      <g fill="#68D28E" opacity="0.7">
        <circle cx="243" cy="629" r="1.8"/><circle cx="258" cy="623" r="2"/><circle cx="272" cy="640" r="1.6"/>
        <circle cx="248" cy="648" r="1.8"/><circle cx="238" cy="642" r="1.5"/><circle cx="260" cy="662" r="1.6"/>
      </g>

      <!-- lake -->
      <ellipse cx="284" cy="600" rx="9" ry="11" fill="#2FA8E0"/>
      <ellipse cx="281" cy="596" rx="4" ry="5" fill="#8FD8F5" opacity="0.85"/>

      <!-- BIG bold river to the coast -->
      <path d="M266,552 C255,574 282,590 264,610 C250,628 274,642 258,662 C250,675 254,688 242,700"
        fill="none" stroke="#1487C4" stroke-width="11" opacity="0.4" stroke-linecap="round"/>
      <path d="M266,552 C255,574 282,590 264,610 C250,628 274,642 258,662 C250,675 254,688 242,700"
        fill="none" stroke="#29B6E6" stroke-width="6.5" stroke-linecap="round"/>
      <path d="M266,552 C255,574 282,590 264,610 C250,628 274,642 258,662 C250,675 254,688 242,700"
        fill="none" stroke="#A6E7F8" stroke-width="2.2" opacity="0.9" stroke-linecap="round"/>
      <!-- tributary -->
      <path d="M232,596 C246,610 240,628 258,640" fill="none" stroke="#29B6E6" stroke-width="4.2" stroke-linecap="round"/>
      <path d="M232,596 C246,610 240,628 258,640" fill="none" stroke="#A6E7F8" stroke-width="1.5" opacity="0.85" stroke-linecap="round"/>

      <!-- mountain ridge -->
      <path d="M222,566 l7,-8 l6,8 l7,-7 l7,8" fill="none" stroke="#D9E2E8" stroke-width="1.6" opacity="0.5" stroke-linejoin="round"/>
    </g>
    <!-- graticule grid -->
    <clipPath id="globeclip"><circle cx="256" cy="618" r="155"/></clipPath>
    <g clip-path="url(#globeclip)">
    <ellipse cx="256" cy="618" rx="155" ry="155" fill="none" stroke="#AEE0F0" stroke-width="1.4" opacity="0.55"/>
    <ellipse cx="256" cy="618" rx="31" ry="155" fill="none" stroke="#AEE0F0" stroke-width="1.1" opacity="0.5"/>
    <ellipse cx="256" cy="618" rx="62" ry="155" fill="none" stroke="#AEE0F0" stroke-width="1.1" opacity="0.5"/>
    <ellipse cx="256" cy="618" rx="93" ry="155" fill="none" stroke="#AEE0F0" stroke-width="1.1" opacity="0.5"/>
    <ellipse cx="256" cy="618" rx="124" ry="155" fill="none" stroke="#AEE0F0" stroke-width="1.1" opacity="0.5"/>
    <ellipse cx="256" cy="618" rx="155" ry="31" fill="none" stroke="#AEE0F0" stroke-width="1.1" opacity="0.5"/>
    <ellipse cx="256" cy="618" rx="155" ry="62" fill="none" stroke="#AEE0F0" stroke-width="1.1" opacity="0.5"/>
    <ellipse cx="256" cy="618" rx="155" ry="93" fill="none" stroke="#AEE0F0" stroke-width="1.1" opacity="0.5"/>
    <ellipse cx="256" cy="618" rx="155" ry="124" fill="none" stroke="#AEE0F0" stroke-width="1.1" opacity="0.5"/>
    <line x1="101" y1="618" x2="411" y2="618" stroke="#AEE0F0" stroke-width="1.2" opacity="0.55"/>
    <line x1="256" y1="463" x2="256" y2="773" stroke="#AEE0F0" stroke-width="1.2" opacity="0.55"/>
    </g>
    <!-- 3D spherical shading -->
    <circle cx="256" cy="618" r="155" fill="url(#sh3d)"/>
    <circle cx="256" cy="618" r="155" fill="url(#hi3d)"/>
    <ellipse cx="212" cy="566" rx="42" ry="30" fill="#EAF7FF" opacity="0.16" transform="rotate(-24 212 566)"/>
    <path d="M120,556 A155,155 0 0 1 214,470" fill="none" stroke="#EAF7FF" stroke-width="3" stroke-linecap="round" opacity="0.35"/>
    <!-- footprint highlight where the pyramid tip focuses -->
    <ellipse cx="256" cy="474" rx="26" ry="9" fill="#F2C879" opacity="0.4"/>
    <ellipse cx="256" cy="474" rx="13" ry="4.5" fill="#FFF3D6" opacity="0.8"/>
    <!-- day-side highlight -->
    <path d="M118,556 A155,155 0 0 1 210,468" fill="none" stroke="#CFE8F5" stroke-width="7" stroke-linecap="round" opacity="0.5"/>
    <!-- atmosphere -->
    <circle cx="256" cy="618" r="163" fill="none" stroke="#4FA8D0" stroke-width="8" opacity="0.28"/>
  </g>


  </g><!-- /globe -->
  <!-- bridge focus line rig-tip -> globe -->
  <path d="M256,372 L256,414" stroke="#F2C879" stroke-width="2" stroke-dasharray="4 5" opacity="0.7" fill="none"/>
</svg>
