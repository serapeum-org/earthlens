site_name: earthlens
site_description: One Python facade for 48 Earth-observation data providers
site_url: https://serapeum-org.github.io/earthlens/
repo_url: https://github.com/serapeum-org/earthlens
repo_name: serapeum-org/earthlens

theme:
  name: material
  custom_dir: overrides
  language: en
  # The transparent globe mark reads on both the light and dark palettes, so one
  # asset serves both. The full kit lives under
  # docs/_images/branding/earthlens-brand-kit/ with its own BRAND-GUIDE.md.
  logo: _images/branding/earthlens-brand-kit/icon/earthlens-icon.svg
  favicon: _images/branding/earthlens-brand-kit/favicon/favicon-32.png
  features:
    - navigation.instant
    - navigation.tracking
    - navigation.footer
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.top
    - content.code.copy
    - content.code.annotate
    - content.action.edit
    - content.action.view
    - content.tooltips
    - search.highlight
    - search.suggest
    - toc.follow
    - announce.dismiss
  palette:
  - media: "(prefers-color-scheme)"
    toggle:
      icon: material/brightness-auto
      name: Switch to light mode
  - media: "(prefers-color-scheme: light)"
    scheme: default
    primary: teal
    accent: purple
    toggle:
      icon: material/weather-sunny
      name: Switch to dark mode
  - media: "(prefers-color-scheme: dark)"
    scheme: slate
    primary: black
    accent: lime
    toggle:
      icon: material/weather-night
      name: Switch to system preference
  icon:
    repo: fontawesome/brands/github


# Notebook runs write their downloads next to the notebook, and mkdocs copies
# everything under docs/ into the site verbatim — which shipped ~4.8 GB of raw
# granules (docs/examples/showcases/out/ alone is 4.5 GB). None of it is
# tracked, and none of it belongs in the published site: the notebooks render
# from their stored outputs, not from these files.
exclude_docs: |
  examples/*/out/
  examples/*/*/out/
  examples/*/data/
  examples/*/*/data/
  examples/*/_nb_out/
  examples/*/*/_nb_out/
  examples/*/_overture_out/
  examples/*/*/_overture_out/
  examples/*/*_out/
  examples/*/*/*_out/
  examples/*/*_output/
  examples/*/*/*_output/
  examples/*/ohsome_log/
  examples/*/*/ohsome_log/
  examples/*/insar_stack*/
  examples/*/*/insar_stack*/
  examples/*/soilgrids_*/
  examples/*/*/soilgrids_*/
  # Branding: publish the curated kit only. Everything loose beside it — the
  # zip of the kit, the exploration variants, and the duplicates of files the
  # kit already ships — stays out. These globs are single-level on purpose, so
  # they never reach into earthlens-brand-kit/ itself.
  _images/branding/*.svg
  _images/branding/*.gif
  _images/branding/*.png
  _images/branding/*.webp
  _images/branding/*.zip
  _images/branding/*.md
  # The kit's own guide would otherwise build as a page with no nav entry.
  _images/branding/earthlens-brand-kit/BRAND-GUIDE.md
  # The kit ships 30 assets but the site references 13 — the header mark, the
  # favicon set, the hero, the orbit animation and the social cards. Nothing
  # links to the rest, so publishing them added 5.75 MB the site cannot reach.
  # They stay tracked: the kit is meant to be taken from the repository.
  _images/branding/earthlens-brand-kit/logo/
  _images/branding/earthlens-brand-kit/icon/earthlens-icon.png
  _images/branding/earthlens-brand-kit/icon/earthlens-badge.*
  _images/branding/earthlens-brand-kit/animation/earthlens-globe-spinning.gif
  _images/branding/earthlens-brand-kit/animation/earthlens-logo-animated.svg
  _images/branding/earthlens-brand-kit/animation/earthlens-logo-orbit.webp
  _images/branding/earthlens-brand-kit/favicon/favicon-64.png
  _images/branding/earthlens-brand-kit/favicon/favicon-180.png
  _images/branding/earthlens-brand-kit/world-texture.png

plugins:
  - search
  - mkdocs-jupyter:
      include: ["*.ipynb"]
  - panzoom:
      hint_location: "top"
      key: "ctrl"
      full_screen: true
  - autorefs
  - mkdocstrings:
      default_handler: python
      handlers:
        python:
          # earthlens is a PEP 420 namespace split across the core and provider
          # distributions; point griffe at every member's src so it can collect
          # `earthlens.<backend>` from whichever distribution ships it.
          paths:
            - libs/core/src
            - libs/providers/atmosphere/src
            - libs/providers/ocean/src
            - libs/providers/imagery/src
            - libs/providers/land/src
            - libs/providers/hazards/src
          options:
            show_source: true
            show_root_heading: true
            heading_level: 2
            docstring_style: google
  - table-reader
  - tags
  - mike:
      alias_type: symlink
      redirect_template: null
      deploy_prefix: ''
      canonical_version: null
      version_selector: true
      css_dir: css
      javascript_dir: js

markdown_extensions:
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.tabbed:
      alternate_style: true
  - admonition
  - footnotes
  - attr_list
  - md_in_html
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - toc:
      permalink: "#"
      toc_depth: 1-4
      anchorlink: true

