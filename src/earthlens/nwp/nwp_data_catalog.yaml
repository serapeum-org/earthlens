# NWP model catalog for earthlens.nwp.
#
# Top-level `datasets:` maps a model key -> one NWPModel row. `bands:`
# maps an earthlens parameter name to the centre's selector: a Herbie
# `search` regex for SDK-backed models (NOAA / ECMWF), or a provider
# variable token for direct-centre models (DWD ICON, ECMWF Open Data).
#
# MVP = 5 models: gfs / gefs / hrrr (NOAA via Herbie), ifs-hres (ECMWF
# Open Data), icon-global (DWD direct-HTTPS). ECCC, full Météo-France,
# ENS / AIFS, RRFS are follow-ons (scope guards).
datasets:

  gfs:                                    # NOAA NODD, via Herbie
    provider: noaa-nodd
    license: PD-US-GOV
    model_family: gfs
    resolution: 0.25deg
    cycles_utc: [0, 6, 12, 18]
    cadence_h: 6
    step_cadence_h: 3
    horizon_h: 384
    format: grib2
    idx: true
    backend: herbie
    mirrors: [aws, google, azure]
    bands:
      temperature_2m: ":TMP:2 m above ground:"
      precipitation_acc: ":APCP:surface:"
      dewpoint_2m: ":DPT:2 m above ground:"
      relative_humidity_2m: ":RH:2 m above ground:"
      wind_u_10m: ":UGRD:10 m above ground:"
      wind_v_10m: ":VGRD:10 m above ground:"
      wind_gust: ":GUST:surface:"
      pressure_msl: ":PRMSL:mean sea level:"
      surface_pressure: ":PRES:surface:"
      total_cloud_cover: ":TCDC:entire atmosphere:"
      cape: ":CAPE:surface:"
      downward_shortwave_radiation: ":DSWRF:surface:"
      # Pressure-level (3-D) fields — the level is encoded in the .idx regex.
      geopotential_height_1000hPa: ":HGT:1000 mb:"
      geopotential_height_925hPa: ":HGT:925 mb:"
      geopotential_height_850hPa: ":HGT:850 mb:"
      geopotential_height_700hPa: ":HGT:700 mb:"
      geopotential_height_600hPa: ":HGT:600 mb:"
