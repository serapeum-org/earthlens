# Sentinel-3 mirror collections on the EUMETSAT Data Store.
# NetCDF products — pyramids-readable today (NetCDF.read_file); the MVP still
# fetches whole products to disk (G4).
collections:
  s3-olci-l2-wfr:
    collection_id: "EO:EUM:DAT:0407"
    group: Sentinel-3
    mission: sentinel-3
    output_kind: raster
    format: netcdf
    cadence: subdaily
    selectors: [OL_2_WFR]
    tailor_product_type: OLCEFR
    extent: { lat: [-90, 90], lon: [-180, 180] }
    temporal: { start: 2016-04-25, end: null }
