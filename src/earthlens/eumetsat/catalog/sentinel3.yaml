# Sentinel-3 marine mirror collections on the EUMETSAT Data Store.
# Delivered as NetCDF (SAFE) products — pyramids-readable today
# (NetCDF.read_file); the MVP still fetches whole products to disk (G4).
collections:
  s3-olci-l1-efr:
    collection_id: "EO:EUM:DAT:0409"
    group: Sentinel-3
    mission: sentinel-3
    output_kind: raster
    format: netcdf
    cadence: subdaily
    selectors: [OL_1_EFR]
    tailor_product_type: OLCEFR
    extent: { lat: [-90, 90], lon: [-180, 180] }
    temporal: { start: 2016-04-25, end: null }

