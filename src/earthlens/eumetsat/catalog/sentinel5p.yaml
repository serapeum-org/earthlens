# Sentinel-5P (TROPOMI) atmospheric-composition mirror collections on the
# EUMETSAT Data Store. Delivered as NetCDF (swath) products — pyramids can
# read them today; the MVP fetches whole products to disk (G4). The numeric
# Data Store ids are curated from the EUMETSAT browse catalogue; reconcile
# against the live endpoint with `tools/eumetsat/audit_eumetsat_catalog.py`.
collections:
  s5p-l2-no2:
    collection_id: "EO:EUM:DAT:0080"
    group: Sentinel-5P
    mission: sentinel-5p
    output_kind: raster
    format: netcdf
    cadence: subdaily
    selectors: [L2__NO2___]
    tailor_product_type: S5PL2NO2
    extent: { lat: [-90, 90], lon: [-180, 180] }
    temporal: { start: 2018-04-30, end: null }

  s5p-l2-ch4:
    collection_id: "EO:EUM:DAT:0081"
