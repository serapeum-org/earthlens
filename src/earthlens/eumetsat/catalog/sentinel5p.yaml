# (api.eumetsat.int/data/browse/collections) on 2026-05-26. Hand-tuned rows
# (HRSEVIRI, the S5P gases, ASCAT soil moisture, the MTG suite, ...) keep their
# vetted metadata; the rest carry browse-derived format/output_kind/cadence
# heuristics (advisory for the whole-product download) refined per product as
# needed. Reconcile with tools/eumetsat/audit_eumetsat_catalog.py.
