# Metop (EPS) collections: ASCAT scatterometer, IASI sounder, and the
# imaging / microwave instruments. EPS products are delivered as native
# files; ASCAT soil moisture and IASI L2 soundings ship as BUFR. All are
# treated as `raster` for the MVP (gridded / griddable files); a future
# revision may split the swath soundings to `vector` (G1).
collections:
  metop-ascat-l1-szr:
    collection_id: "EO:EUM:DAT:METOP:ASCSZR1B"
    group: Metop
    mission: metop
    output_kind: raster
    format: native
    cadence: subdaily
    selectors: [ASCSZR1B]
    tailor_product_type: ASCATL1SZR
    extent: { lat: [-90, 90], lon: [-180, 180] }
    temporal: { start: 2007-01-01, end: null }

