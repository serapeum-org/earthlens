# Sentinel-6 Michael Freilich altimetry mirror collections on the EUMETSAT
# Data Store. Poseidon-4 SAR radar altimeter, delivered as NetCDF; the MVP
# fetches whole products to disk (G4). The numeric Data Store ids are curated
# from the EUMETSAT browse catalogue; reconcile against the live endpoint with
# `tools/eumetsat/audit_eumetsat_catalog.py`.
collections:
  s6-p4-l2-lr:
    collection_id: "EO:EUM:DAT:0142"
    group: Sentinel-6
    mission: sentinel-6
    output_kind: raster
    format: netcdf
    cadence: subdaily
    selectors: [P4_2__LR_]
    tailor_product_type: S6P4L2LR
    extent: { lat: [-90, 90], lon: [-180, 180] }
    temporal: { start: 2020-12-17, end: null }

  s6-p4-l2-hr:
    collection_id: "EO:EUM:DAT:0143"
    group: Sentinel-6
    mission: sentinel-6
    output_kind: raster
    format: netcdf
    cadence: subdaily
    selectors: [P4_2__HR_]
    tailor_product_type: S6P4L2HR
    extent: { lat: [-90, 90], lon: [-180, 180] }
    temporal: { start: 2020-12-17, end: null }
