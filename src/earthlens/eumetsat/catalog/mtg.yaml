# MTG (Meteosat Third Generation) I1 collections: the FCI imager, the
# Lightning Imager (LI), and the FCI-derived Level 2 product suite. FCI L1c is
# native (needs the satpy bridge, PY-2, to read client-side); the L2 maps are
# NetCDF (pyramids-readable). Atmospheric Motion Vectors and the LI event /
# flash / group products are point/vector products (output_kind: vector); the
# gridded maps and accumulated-LI rasters are output_kind: raster. The MVP
# fetches whole products to disk (G4). Ids + start dates verified against
# api.eumetsat.int/data/browse/collections on 2026-05-26.
collections:
  mtg-fci-l1c:
    collection_id: "EO:EUM:DAT:0662"
    group: MTG
    mission: mtg
    output_kind: raster
    format: native
    cadence: 10min
    selectors: [FCI-L1C-NR]
    tailor_product_type: FCIL1C
    extent: { lat: [-79, 79], lon: [-79, 79] }
    temporal: { start: 2024-09-24, end: null }
