# Metop-SG (Metop Second Generation) collections on the EUMETSAT Data Store.
# Polar-orbiting; delivered as NetCDF / BUFR. The MVP fetches whole products to
# disk (G4). Ids + start dates verified against
# api.eumetsat.int/data/browse/collections on 2026-05-26.
collections:
  metopsg-gras2-l1b:
    collection_id: "EO:EUM:DAT:0452"
    group: Metop-SG
    mission: metop-sg
    output_kind: raster
    format: netcdf
    cadence: subdaily
    selectors: [GRAS-L1B]
    tailor_product_type: null
    extent: { lat: [-90, 90], lon: [-180, 180] }
    temporal: { start: 2026-02-26, end: null }
  metopsg-aux:
    collection_id: "EO:EUM:DAT:0520"
    group: Metop-SG
    mission: metop-sg
    output_kind: raster
    format: other
    cadence: irregular
    selectors: [AUX]
    tailor_product_type: null
    extent: { lat: [-90, 90], lon: [-180, 180] }
    temporal: { start: 2026-04-28, end: null }
  metopsg-bufr:
    collection_id: "EO:EUM:DAT:0892"
    group: Metop-SG
    mission: metop-sg
    output_kind: raster
    format: bufr
    cadence: subdaily
    selectors: [BUFR]
    tailor_product_type: null
    extent: { lat: [-90, 90], lon: [-180, 180] }
    temporal: { start: 2026-02-26, end: null }
