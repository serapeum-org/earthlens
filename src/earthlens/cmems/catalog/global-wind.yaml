# CMEMS curated catalog - global-wind slice.
#
# One slice of the per-domain split of the Copernicus Marine catalog.
# The loader (earthlens.cmems.catalog.Catalog) merges every *.yaml in
# this directory into one Catalog at construction time; dataset ids
# must be unique across files. Stanzas are emitted by
# tools/cmems/refresh_cmems_catalog.py from copernicusmarine.describe();
# `cadence` is inferred from the dataset_id suffix, `domain` from the
# product_id prefix, and `temporal.start` is read from the dataset's
# arco time-coordinate bounds. `end` is left null (the arco max is
# "latest available today" and would go stale for rolling products).
# Where the toolbox exposes no standard_name for a variable, the row
# carries `long_name: ''` with a TODO marker.
#
# Schema (per dataset):
#   <dataset_id>:
#     product: <product_id>
#     title: <human-readable title>
#     cadence: <daily|monthly|hourly|6hourly|climatology|irregular>
#     domain: <global|mediterranean|arctic|...>
#     temporal: { start: YYYY-MM-DD, end: YYYY-MM-DD }   # end null = NRT
#     variables:
#       <short_name>: { units: <CF units>, long_name: <CF long name> }

datasets:

  cmems_obs-wind_arc_phy_my_l3-s1a-sar-asc-0.01deg_P1D-i:
    product: WIND_ARC_PHY_HR_L3_MY_012_105
    title: Ocean Surface Wind Level 3 Gridded Dataset over Arctic Ocean area, from Sentinel-1
    cadence: daily
    domain: global
    temporal:
      start: 2018-03-13
      end: null              # null = NRT / rolling
    variables:
      eastward_model_wind:
        units: m s-1
        long_name: Eastward wind
      eastward_wind:
        units: m s-1
        long_name: Eastward wind
      measurement_time:
        units: seconds since 1990-01-01
        long_name: Time
      model_wind_speed:
        units: m s-1
        long_name: Wind speed
      model_wind_to_dir:
        units: degree
        long_name: Wind to direction
      northward_model_wind:
        units: m s-1
        long_name: Northward wind
      northward_wind:
        units: m s-1
        long_name: Northward wind
      number_of_pixel:
        units: '1'
        long_name: Wind speed number of observation
      product_info:
        units: ''
        long_name: Status flag
      quality_level:
        units: ''
        long_name: Aggregate quality flag
      rejection_flag:
        units: ''
        long_name: Aggregate quality flag
      wind_speed:
        units: m s-1
        long_name: Wind speed
