# CMEMS curated catalog - arctic slice.
#
# One slice of the per-domain split of the Copernicus Marine catalog.
# The loader (earthlens.cmems.catalog.Catalog) merges every *.yaml in
# this directory into one Catalog at construction time; dataset ids
# must be unique across files. Stanzas are emitted by
# tools/cmems/refresh_cmems_catalog.py from copernicusmarine.describe();
# `cadence` is inferred from the dataset_id suffix and `domain` from
# the product_id prefix. The `global` basin is sub-split by theme
# (global-physics / global-biogeochem / global-sst / ...) to keep file
# sizes balanced; the `domain:` field on every row below is still the
# plain basin label. Where the toolbox exposes no standard_name for a
# variable, the row carries `long_name: ''` with a TODO marker.
#
# Schema (per dataset):
#   <dataset_id>:
#     product: <product_id>
#     title: <human-readable title>
#     cadence: <daily|monthly|hourly|6hourly|climatology|irregular>
#     domain: <global|mediterranean|arctic|...>
#     temporal: { start: YYYY-MM-DD, end: YYYY-MM-DD }   # end null = NRT
#     variables:
#       <short_name>: { units: <CF units>, long_name: <CF long name> }

datasets:

  arctic_omi_si_extent:
    product: ARCTIC_OMI_SI_extent
    title: Monthly Sea Ice Extent for Northern Hemisphere
    cadence: irregular
    domain: arctic
    temporal:
      start: null            # TODO: pin from CMEMS portal / probe_cmems_netcdf.py
      end: null              # null = NRT (rolling)
    variables:
      siextentn_cglo:
        units: km2
        long_name: Sea ice extent
      siextentn_glor:
        units: km2
        long_name: Sea ice extent
      siextentn_mean:
        units: km2
        long_name: Sea ice extent
      siextentn_oras:
        units: km2
