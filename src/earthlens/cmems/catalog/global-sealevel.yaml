# CMEMS curated catalog - global-sealevel slice.
#
# One slice of the per-domain split of the Copernicus Marine catalog.
# The loader (earthlens.cmems.catalog.Catalog) merges every *.yaml in
# this directory into one Catalog at construction time; dataset ids
# must be unique across files. Stanzas are emitted by
# tools/cmems/refresh_cmems_catalog.py from copernicusmarine.describe();
# `cadence` is inferred from the dataset_id suffix, `domain` from the
# product_id prefix, and `temporal.start` is read from the dataset's
# arco time-coordinate bounds. `end` is left null (the arco max is
# "latest available today" and would go stale for rolling products).
# Where the toolbox exposes no standard_name for a variable, the row
# carries `long_name: ''` with a TODO marker.
#
# Schema (per dataset):
#   <dataset_id>:
#     product: <product_id>
#     title: <human-readable title>
#     cadence: <daily|monthly|hourly|6hourly|climatology|irregular>
#     domain: <global|mediterranean|arctic|...>
#     temporal: { start: YYYY-MM-DD, end: YYYY-MM-DD }   # end null = NRT
#     variables:
#       <short_name>: { units: <CF units>, long_name: <CF long name> }

datasets:

  c3s_obs-sl_glo_phy-ssh_my_twosat-l4-duacs-0.25deg_P1D:
    product: SEALEVEL_GLO_PHY_CLIMATE_L4_MY_008_057
    title: DT merged two satellites Global Ocean Gridded SSALTO/DUACS Sea Surface Height L4 product
    cadence: daily
    domain: global
    temporal:
      start: 1993-01-01
      end: null              # null = NRT / rolling
    variables:
      adt:
        units: m
        long_name: Sea surface height above geoid
      err_sla:
        units: m
        long_name: Sea surface height above sea level standard error
      err_ugosa:
        units: m/s
        long_name: Surface geostrophic eastward sea water velocity assuming sea level for geoid standard
      err_vgosa:
        units: m/s
        long_name: Surface geostrophic northward sea water velocity assuming sea level for geoid standard
      flag_ice:
        units: ''
        long_name: Status flag
      sla:
        units: m
        long_name: Sea surface height above sea level
      tpa_correction:
        units: m
        long_name: Sea surface height above sea level
      ugos:
        units: m/s
        long_name: Surface geostrophic eastward sea water velocity
      ugosa:
        units: m/s
        long_name: Surface geostrophic eastward sea water velocity assuming sea level for geoid
      vgos:
        units: m/s
        long_name: Surface geostrophic northward sea water velocity
      vgosa:
        units: m/s
        long_name: Surface geostrophic northward sea water velocity assuming sea level for geoid

  c3s_obs-sl_glo_phy-ssh_my_twosat-l4-duacs-0.25deg_P1M-m:
