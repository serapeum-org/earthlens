# CMEMS curated catalog - nw-shelf slice.
#
# One slice of the per-domain split of the Copernicus Marine catalog.
# The loader (earthlens.cmems.catalog.Catalog) merges every *.yaml in
# this directory into one Catalog at construction time; dataset ids
# must be unique across files. Stanzas are emitted by
# tools/cmems/refresh_cmems_catalog.py from copernicusmarine.describe();
# `cadence` is inferred from the dataset_id suffix, `domain` from the
# product_id prefix, and `temporal.start` is read from the dataset's
# arco time-coordinate bounds. `end` is left null (the arco max is
# "latest available today" and would go stale for rolling products).
# Where the toolbox exposes no standard_name for a variable, the row
# carries `long_name: ''` with a TODO marker.
#
# Schema (per dataset):
#   <dataset_id>:
#     product: <product_id>
#     title: <human-readable title>
#     cadence: <daily|monthly|hourly|6hourly|climatology|irregular>
#     domain: <global|mediterranean|arctic|...>
#     temporal: { start: YYYY-MM-DD, end: YYYY-MM-DD }   # end null = NRT
#     variables:
#       <short_name>: { units: <CF units>, long_name: <CF long name> }

datasets:

  MetO-NWS-WAV-RAN:
    product: NWSHELF_REANALYSIS_WAV_004_015
    title: 3-hourly-instantaneous wave
    cadence: irregular
    domain: nw-shelf
    temporal:
      start: 1980-01-01
      end: null              # null = NRT / rolling
    variables:
      VHM0:
        units: m
        long_name: Sea surface wave significant height
      VHM0_SW1:
        units: m
        long_name: Sea surface primary swell wave significant height
      VHM0_SW2:
        units: m
        long_name: Sea surface secondary swell wave significant height
      VHM0_WW:
        units: m
        long_name: Sea surface wind wave significant height
      VMDR:
        units: degree
        long_name: Sea surface wave from direction
      VMDR_SW1:
        units: degree
        long_name: Sea surface primary swell wave from direction
      VMDR_SW2:
        units: degree
        long_name: Sea surface secondary swell wave from direction
      VMDR_WW:
        units: degree
        long_name: Sea surface wind wave from direction
      VPED:
        units: degree
        long_name: Sea surface wave from direction at variance spectral density maximum
      VSDX:
        units: m s-1
        long_name: Sea surface wave stokes drift x velocity
      VSDY:
        units: m s-1
        long_name: Sea surface wave stokes drift y velocity
      VTM01_SW1:
        units: s
        long_name: Sea surface primary swell wave mean period
      VTM01_SW2:
        units: s
        long_name: Sea surface secondary swell wave mean period
      VTM01_WW:
        units: s
        long_name: Sea surface wind wave mean period
      VTM02:
        units: s
        long_name: Sea surface wave mean period from variance spectral density second frequency moment
      VTM10:
        units: s
        long_name: Sea surface wave mean period from variance spectral density inverse frequency moment
      VTPK:
        units: s
        long_name: Sea surface wave period at variance spectral density maximum

