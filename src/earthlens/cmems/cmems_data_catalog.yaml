        long_name: Sea surface height above geoid

  cmems_mod_arc_phy_my_topaz4_P1D-m:
    product: ARCTIC_MULTIYEAR_PHY_002_003
    title: Arctic TOPAZ4 physical reanalysis (daily)
    cadence: daily
    domain: arctic
    temporal:
      start: 1991-01-02
      end: null
    variables:
      thetao:
        units: degrees_C
        long_name: Sea water potential temperature
      so:
        units: "1e-3"
        long_name: Sea water salinity
      siconc:
