# NEXRAD WSR-88D site registry for earthlens.radar.
#
# A curated subset of the ~160-site network (id -> name / lat / lon / state),
# used to give fetched volumes a point geometry and to resolve which radars
# fall in a bounding box. Any valid four-letter site id can be fetched even if
# it is absent here (the volume simply gets no geometry). Coordinates are the
# published WSR-88D antenna locations (degrees; west negative).
stations:
