    bands: [B08, B11]
    output_bands: 1
    kind: stats
    description: Sentinel-2 L2A NDMI for the Statistical API (with dataMask).
  sentinel-2-l2a-nbr-stats:
    base_collection: SENTINEL2_L2A
    evalscript: nbr_stats.js
    bands: [B08, B12]
    output_bands: 1
