# Curated evalscript recipes (logical key -> bundled .js + base collection).
# kind: "render" writes a raster; "stats" emits the dataMask band the Statistical
# API requires. Each `evalscript:` names a file bundled under evalscripts/.
recipes:
  sentinel-2-l2a-ndvi:
    base_collection: SENTINEL2_L2A
    evalscript: ndvi.js
    bands: [B04, B08]
    output_bands: 1
    kind: render
    description: Sentinel-2 L2A NDVI (FLOAT32).
  sentinel-2-l2a-true-colour:
    base_collection: SENTINEL2_L2A
    evalscript: true_colour.js
    bands: [B02, B03, B04]
    output_bands: 3
    kind: render
    description: Sentinel-2 L2A true-colour RGB composite.
  sentinel-2-l2a-false-colour:
    base_collection: SENTINEL2_L2A
    evalscript: false_colour.js
    bands: [B03, B04, B08]
    output_bands: 3
    kind: render
    description: Sentinel-2 L2A false-colour (vegetation) composite.
  sentinel-2-l2a-ndwi:
    base_collection: SENTINEL2_L2A
    evalscript: ndwi.js
    bands: [B03, B08]
    output_bands: 1
    kind: render
    description: Sentinel-2 L2A NDWI (McFeeters water index, FLOAT32).
  sentinel-2-l2a-evi:
    base_collection: SENTINEL2_L2A
    evalscript: evi.js
    bands: [B02, B04, B08]
    output_bands: 1
    kind: render
    description: Sentinel-2 L2A EVI (Enhanced Vegetation Index, FLOAT32).
  sentinel-2-l2a-bsi:
    base_collection: SENTINEL2_L2A
    evalscript: bsi.js
    bands: [B02, B04, B08, B11]
    output_bands: 1
    kind: render
    description: Sentinel-2 L2A BSI (Bare Soil Index, FLOAT32).
  sentinel-2-l2a-swir-composite:
    base_collection: SENTINEL2_L2A
    evalscript: swir_composite.js
    bands: [B04, B08, B12]
    output_bands: 3
    kind: render
    description: Sentinel-2 L2A SWIR composite (B12/B08/B04).
  sentinel-2-l2a-ndvi-stats:
    base_collection: SENTINEL2_L2A
    evalscript: ndvi_stats.js
    bands: [B04, B08]
    output_bands: 1
    kind: stats
    description: Sentinel-2 L2A NDVI for the Statistical API (with dataMask).
  sentinel-2-l2a-ndwi-stats:
    base_collection: SENTINEL2_L2A
    evalscript: ndwi_stats.js
    bands: [B03, B08]
    output_bands: 1
    kind: stats
    description: Sentinel-2 L2A NDWI for the Statistical API (with dataMask).
  sentinel-2-l2a-evi-stats:
    base_collection: SENTINEL2_L2A
    evalscript: evi_stats.js
    bands: [B02, B04, B08]
    output_bands: 1
    kind: stats
    description: Sentinel-2 L2A EVI for the Statistical API (with dataMask).
  sentinel-2-l2a-bsi-stats:
    base_collection: SENTINEL2_L2A
    evalscript: bsi_stats.js
    bands: [B02, B04, B08, B11]
    output_bands: 1
    kind: stats
    description: Sentinel-2 L2A BSI for the Statistical API (with dataMask).
