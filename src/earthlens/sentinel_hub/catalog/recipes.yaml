    bands: [B08, B12]
    output_bands: 1
    kind: render
    description: Sentinel-2 L2A NBR (normalized burn ratio, FLOAT32).
  sentinel-2-l2a-agriculture:
    base_collection: SENTINEL2_L2A
    evalscript: agriculture.js
    bands: [B02, B08, B11]
    output_bands: 3
