# JAXA dataset catalog — generated from A1's live SDK captures.
#
# Each row carries a `protocol` discriminator:
#   - `jaxa-earth` -> served by the jaxa.earth API as a STAC/COG asset
#     (`collection` is the STAC collection name).
#   - `gportal` -> served by the G-Portal mission archive via SFTP
#     (`short_name` is the G-Portal numeric dataset id).
#
# Per A1's live probe (planning/jaxa/captures/jaxa_earth_collections.txt),
# the jaxa.earth catalog holds 118 STAC collections. The full 118 are
# enumerated below with their default bands; the G-Portal half is a
# strategic mission-representative starter set (full curation extends
# this in a follow-on by walking gportal.datasets()).
#
# Exclusions: GOSAT (legacy CO2/CH4) lives on the separate GOSAT Data
# Archive Service, not on G-Portal; ALOS-4/PALSAR-3 has no confirmed
# non-commercial G-Portal access as of 2026-06.
datasets:
  c3s-proba-v-lccs-global-yearly:
    protocol: jaxa-earth
    collection: Copernicus.C3S_PROBA-V_LCCS_global_yearly
    default_band: LCCS
  aw3d30:
    aliases: [elevation, dem, alos-aw3d30, alos-prism-aw3d30-v3-2-global]
    protocol: jaxa-earth
    collection: JAXA.EORC_ALOS.PRISM_AW3D30.v3.2_global
    default_band: DSM
