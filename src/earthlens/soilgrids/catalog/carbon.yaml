# SoilGrids curated catalog — organic-carbon slice.
#
# One slice of the per-group split of the SoilGrids catalog (see texture.yaml
# for the loader / scaled-integer convention). `ocs` (organic carbon stock) is
# the one non-standard property: it is published for a single `0-30cm` depth
# interval rather than the six standard depths (verified live 2026-07-01).

datasets:

  soc:
    endpoint: "https://maps.isric.org/mapserv?map=/map/soc.map"
    title: "Soil organic carbon content in the fine earth fraction"
    depths: ["0-5cm", "5-15cm", "15-30cm", "30-60cm", "60-100cm", "100-200cm"]
    quantiles: ["Q0.05", "Q0.5", "Q0.95", "mean", "uncertainty"]
    unit: "g/kg"
    mapped_units: "dg/kg"
    scale_factor: 10.0

  ocd:
    endpoint: "https://maps.isric.org/mapserv?map=/map/ocd.map"
    title: "Organic carbon density"
    depths: ["0-5cm", "5-15cm", "15-30cm", "30-60cm", "60-100cm", "100-200cm"]
    quantiles: ["Q0.05", "Q0.5", "Q0.95", "mean", "uncertainty"]
    unit: "kg/m3"
    mapped_units: "hg/m3"
    scale_factor: 10.0

  ocs:
    endpoint: "https://maps.isric.org/mapserv?map=/map/ocs.map"
    title: "Organic carbon stocks (0-30 cm)"
    depths: ["0-30cm"]
    quantiles: ["Q0.05", "Q0.5", "Q0.95", "mean", "uncertainty"]
    unit: "kg/m2"
    mapped_units: "t/ha"
    scale_factor: 10.0
