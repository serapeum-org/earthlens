# SoilGrids curated catalog — soil-texture slice.
#
# One slice of the per-group split of the SoilGrids catalog. The loader
# (earthlens.soilgrids.catalog.Catalog) merges every *.yaml in this directory
# into one Catalog at construction time; property ids must be unique across
# files. Each property is an independent MapServer WCS service; a request is a
# `(property, depth, quantile)` triple -> one COVERAGEID. Values are stored as
# scaled integers: divide by `scale_factor` to convert `mapped_units` to `unit`.
# Depths + quantiles are the SoilGrids standard set (verified live 2026-07-01).

datasets:

  clay:
    endpoint: "https://maps.isric.org/mapserv?map=/map/clay.map"
    title: "Proportion of clay particles (< 0.002 mm) in the fine earth fraction"
    depths: ["0-5cm", "5-15cm", "15-30cm", "30-60cm", "60-100cm", "100-200cm"]
    quantiles: ["Q0.05", "Q0.5", "Q0.95", "mean", "uncertainty"]
    unit: "%"
    mapped_units: "g/kg"
    scale_factor: 10.0

  sand:
    endpoint: "https://maps.isric.org/mapserv?map=/map/sand.map"
    title: "Proportion of sand particles (> 0.05 mm) in the fine earth fraction"
    depths: ["0-5cm", "5-15cm", "15-30cm", "30-60cm", "60-100cm", "100-200cm"]
    quantiles: ["Q0.05", "Q0.5", "Q0.95", "mean", "uncertainty"]
    unit: "%"
    mapped_units: "g/kg"
    scale_factor: 10.0

  silt:
    endpoint: "https://maps.isric.org/mapserv?map=/map/silt.map"
    title: "Proportion of silt particles (0.002-0.05 mm) in the fine earth fraction"
    depths: ["0-5cm", "5-15cm", "15-30cm", "30-60cm", "60-100cm", "100-200cm"]
    quantiles: ["Q0.05", "Q0.5", "Q0.95", "mean", "uncertainty"]
    unit: "%"
    mapped_units: "g/kg"
    scale_factor: 10.0

  cfvo:
    endpoint: "https://maps.isric.org/mapserv?map=/map/cfvo.map"
    title: "Volumetric fraction of coarse fragments (> 2 mm)"
    depths: ["0-5cm", "5-15cm", "15-30cm", "30-60cm", "60-100cm", "100-200cm"]
    quantiles: ["Q0.05", "Q0.5", "Q0.95", "mean", "uncertainty"]
    unit: "cm3/100cm3 (vol%)"
    mapped_units: "cm3/dm3"
    scale_factor: 10.0
