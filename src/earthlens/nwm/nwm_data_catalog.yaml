# NOAA National Water Model (NWM v3.0) data catalog.
#
# `products:` are the file contents (the keys used in
# `variables={product: [variable, ...]}`) with curated variable metadata;
# `configurations:` are the operational runs (the `configuration=` argument),
# auto-generated from a live probe of `noaa-nwm-pds`
# (tools/nwm/refresh_nwm_catalog.py). A concrete S3 key is assembled from a
# (configuration, product, cycle, step) tuple by the backend.

products:
  chrtout:
    output_kind: tabular
    dims:
    - feature_id
    - time
    s3_token: channel_rt
    retro_zarr: s3://noaa-nwm-retrospective-3-0-pds/CONUS/zarr/chrtout.zarr
    description: Channel routing (CHRTOUT) - streamflow and velocity on the NHDPlus v2 stream reaches,
      indexed by feature_id (COMID).
    variables:
      streamflow:
        units: m3 s-1
        long_name: River channel flow rate
      velocity:
        units: m s-1
        long_name: River channel flow velocity
      nudge:
        units: m3 s-1
        long_name: Streamflow alteration from data assimilation
      qSfcLatRunoff:
        units: m3 s-1
        long_name: Runoff from terrain routing
      qBucket:
        units: m3 s-1
        long_name: Flux from the groundwater bucket
      qBtmVertRunoff:
        units: m3
        long_name: Runoff from the soil column to the bucket
  ldasout:
    output_kind: raster
    dims:
    - y
    - x
    - time
    s3_token: land
    retro_zarr: s3://noaa-nwm-retrospective-3-0-pds/CONUS/zarr/ldasout.zarr
    description: 'Land surface (LDASOUT) - gridded Noah-MP states: soil moisture, snow, and accumulated
      evapotranspiration.'
    variables:
      SOIL_M:
        units: m3 m-3
        long_name: Volumetric soil moisture
      SNEQV:
        units: kg m-2
        long_name: Snow water equivalent
      SNOWH:
        units: m
        long_name: Snow depth
      FSNO:
        units: '1'
        long_name: Snow-cover fraction on the ground
      ACCET:
        units: mm
        long_name: Accumulated total evapotranspiration
      SOILSAT_TOP:
        units: '1'
        long_name: Fraction of soil saturation, top two layers
      SNOWT_AVG:
        units: K
        long_name: Average snow temperature (mass-weighted)
  lakeout:
    output_kind: tabular
    dims:
    - feature_id
    - time
    s3_token: reservoir
    retro_zarr: s3://noaa-nwm-retrospective-3-0-pds/CONUS/zarr/lakeout.zarr
    description: Reservoir routing (LAKEOUT) - lake inflow, outflow, and water-surface elevation per reservoir
      feature_id.
    variables:
      inflow:
        units: m3 s-1
        long_name: Lake inflow
      outflow:
        units: m3 s-1
        long_name: Lake outflow
      water_sfc_elev:
        units: m
        long_name: Water-surface elevation
      reservoir_type:
        units: '1'
        long_name: Reservoir type
      reservoir_assimilated_value:
        units: m3 s-1
        long_name: Assimilated reservoir value
  rtout:
    output_kind: raster
    dims:
    - y
    - x
    - time
    s3_token: terrain_rt
    description: Terrain routing (RTOUT) - gridded ponded-water and water-table state on the high-resolution
      routing grid.
    variables:
      zwattablrt:
        units: m
        long_name: Depth to the water table
      sfcheadsubrt:
        units: mm
        long_name: Surface ponded-water head
  forcing:
    output_kind: raster
    dims:
    - y
    - x
    - time
    s3_token: forcing
    retro_zarr: s3://noaa-nwm-retrospective-3-0-pds/CONUS/zarr/precip.zarr
    description: Meteorological forcing - the gridded inputs driving the land-surface model (precipitation,
      temperature, humidity, wind, pressure, radiation).
    variables:
      RAINRATE:
        units: mm s-1
        long_name: Surface precipitation rate
      T2D:
        units: K
        long_name: 2-m air temperature
      Q2D:
        units: kg kg-1
        long_name: 2-m specific humidity
      U2D:
        units: m s-1
        long_name: 10-m U-component of wind
      V2D:
        units: m s-1
        long_name: 10-m V-component of wind
      PSFC:
        units: Pa
        long_name: Surface pressure
      SWDOWN:
        units: W m-2
        long_name: Surface downward short-wave radiation
      LWDOWN:
        units: W m-2
        long_name: Surface downward long-wave radiation
  coastal:
    output_kind: tabular
    dims:
    - node
    - time
    s3_token: total_water
    description: Coastal total water level (SCHISM) - sea-surface elevation on the coastal unstructured-mesh
      nodes (not a regular grid).
    variables:
      elevation:
        units: m
        long_name: Sea-surface elevation relative to LMSL
