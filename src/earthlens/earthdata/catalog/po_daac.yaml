# PO.DAAC — Physical Oceanography DAAC. CMR provider code: POCLOUD.
# MUR SST, gridded sea-surface height, SMAP sea-surface salinity.
datasets:
  MUR-JPL-L4-GLOB-v4.1:
    short_name: MUR-JPL-L4-GLOB-v4.1
    version: '4.1'
    daac: PO.DAAC
