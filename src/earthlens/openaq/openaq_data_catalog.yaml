# OpenAQ v3 pollutant-parameter dispatch table.
#
# Unlike the raster backends, OpenAQ has no per-dataset catalog to
# curate — it is a fixed query protocol over a small, stable set of
# measured parameters. This file is the entire "catalog": one row per
# parameter, keyed by the user-facing name passed in `variables=[...]`.
# `id` is the OpenAQ numeric `parameters_id` the v3 API filters on; it
# is what actually selects the pollutant in a `locations` query, so a
# wrong id silently fetches the wrong parameter.
#
# All ids + units below were verified against the live `/v3/parameters`
# endpoint on 2026-05-22. `units` is the parameter's canonical reporting
# unit in the OpenAQ registry (informational — the backend reads the
# real per-sensor units at fetch time). Re-verify against `/v3/parameters`
# when adding a row.
parameters:
  # Criteria pollutants + particulates.
  pm25: { id: 2, name: pm25, units: "µg/m³", display_name: "PM2.5", group: particulate }
  pm10: { id: 1, name: pm10, units: "µg/m³", display_name: "PM10", group: particulate }
  no2: { id: 15, name: no2, units: "ppb", display_name: "Nitrogen dioxide", group: criteria }
  o3: { id: 32, name: o3, units: "ppb", display_name: "Ozone", group: criteria }
  so2: { id: 101, name: so2, units: "ppb", display_name: "Sulphur dioxide", group: criteria }
  co: { id: 102, name: co, units: "ppb", display_name: "Carbon monoxide", group: criteria }
  # Additional pollutants + meteorological parameters.
  bc: { id: 11, name: bc, units: "µg/m³", display_name: "Black carbon", group: particulate }
  # `no` is quoted because YAML 1.1 parses the bare token as boolean false.
  "no": { id: 19843, name: "no", units: "µg/m³", display_name: "Nitrogen monoxide", group: other }
  nox: { id: 19840, name: nox, units: "ppm", display_name: "NOx", group: other }
  co2: { id: 21, name: co2, units: "ppm", display_name: "Carbon dioxide", group: other }
  ch4: { id: 28, name: ch4, units: "ppm", display_name: "Methane", group: other }
  temperature: { id: 128, name: temperature, units: "f", display_name: "Temperature", group: meteorological }
  relativehumidity: { id: 98, name: relativehumidity, units: "%", display_name: "Relative humidity", group: meteorological }
  pressure: { id: 132, name: pressure, units: "mb", display_name: "Atmospheric pressure", group: meteorological }
  wind_speed: { id: 34, name: wind_speed, units: "m/s", display_name: "Wind speed", group: meteorological }
  wind_direction: { id: 22, name: wind_direction, units: "deg", display_name: "Wind direction", group: meteorological }
  humidity: { id: 134, name: humidity, units: "%", display_name: "Humidity", group: meteorological }
  # Additional PM size fractions.
  pm1: { id: 19, name: pm1, units: "µg/m³", display_name: "PM1", group: particulate }
  pm4: { id: 19844, name: pm4, units: "µg/m³", display_name: "PM4.0", group: particulate }
  # Particle-count metrics (counts per cm³) from optical particle counters.
  ufp: { id: 33, name: ufp, units: "particles/cm³", display_name: "Ultrafine particle count", group: particulate }
  um003: { id: 125, name: um003, units: "particles/cm³", display_name: "PM0.3 count", group: particulate }
  um010: { id: 126, name: um010, units: "particles/cm³", display_name: "PM1 count", group: particulate }
  um025: { id: 130, name: um025, units: "particles/cm³", display_name: "PM2.5 count", group: particulate }
  um100: { id: 135, name: um100, units: "particles/cm³", display_name: "PM10 count", group: particulate }
  # Wavelength-resolved black carbon (aethalometer channels).
  bc_370: { id: 19866, name: bc_370, units: "ng/m³", display_name: "BC 370nm", group: particulate }
  bc_375: { id: 19861, name: bc_375, units: "ng/m³", display_name: "BC 375nm", group: particulate }
  bc_470: { id: 19862, name: bc_470, units: "ng/m³", display_name: "BC 470nm", group: particulate }
  bc_528: { id: 19863, name: bc_528, units: "ng/m³", display_name: "BC 528nm", group: particulate }
  bc_625: { id: 19864, name: bc_625, units: "ng/m³", display_name: "BC 625nm", group: particulate }
  bc_880: { id: 19865, name: bc_880, units: "ng/m³", display_name: "BC 880nm", group: particulate }
