# GHSL product / epoch / resolution availability matrix (curated, config-as-code).
#
# Verified against the live JRC JEODPP tree 2026-05 (see the refresh tool,
# tools/ghsl/refresh_ghsl_catalog.py). Each product row carries its canonical
# code (the YAML key, also the on-disk file-stem token), an optional `family`
# directory token (defaults to the code; differs only for the AGBH/ANBH,
# FUN/MSZ, NRES sub-products), friendly `aliases`, and a per-release
# availability block. A resolution implies its source CRS (metric -> 54009,
# arc-second -> 4326); the user's output CRS is independent.
#
# This file is seeded in C1 with one product of each shape (continuous
# multi-epoch, categorical, single-epoch sub-product) and completed to the full
# GLOBE surface in C2.

products:

  # --- continuous, multi-epoch, fully tiled+whole-globe ----------------------
  GHS_POP:
    aliases: [population, pop]
    unit: "people/cell"
    categorical: false
    default_resolution: "100m"
    releases:
      R2023A:
        epochs: [1975, 1980, 1985, 1990, 1995, 2000, 2005, 2010, 2015, 2020, 2025, 2030]
        resolutions: ["100m", "1km", "3ss", "30ss"]

  # --- categorical (Degree of Urbanisation settlement model) -----------------
  GHS_SMOD:
    aliases: [settlement_model, smod, degree_of_urbanisation, degurba]
    unit: ""
    categorical: true
    default_resolution: "1km"
    legend:
      30: "Urban Centre"
      23: "Dense Urban Cluster"
      22: "Semi-dense Urban Cluster"
      21: "Suburban / Peri-urban"
      13: "Rural Cluster"
      12: "Low Density Rural"
      11: "Very Low Density Rural"
      10: "Water"
    colors:
      30: "#FF0000"
      23: "#732600"
      22: "#A87000"
      21: "#FFFF00"
      13: "#375623"
      12: "#7FA86E"
      11: "#CDF57A"
      10: "#73DFFF"
    releases:
      R2023A:
        epochs: [1975, 1980, 1985, 1990, 1995, 2000, 2005, 2010, 2015, 2020, 2025, 2030]
        resolutions: ["1km", "30ss"]

  # --- single-epoch sub-product (average net building height) ----------------
  GHS_BUILT_H_ANBH:
    family: GHS_BUILT_H
    aliases: [built_height, building_height, height, anbh]
    unit: "m"
    categorical: false
    default_resolution: "100m"
    releases:
      R2023A:
        epochs: [2018]
        resolutions: ["100m", "3ss"]
