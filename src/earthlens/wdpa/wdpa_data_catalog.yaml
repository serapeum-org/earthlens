# WDPA country catalog — curated ISO3 countries for the earthlens WDPA backend.
#
# Each entry is keyed by its ISO 3166-1 alpha-3 code (the value the Protected
# Planet v4 `country=` filter expects) and carries a human name and a region.
# This is a curated, biodiversity-notable subset across every continent — it is
# NOT exhaustive: the backend accepts ANY valid alpha-3 code (or a WDPA id) as a
# `variables` selector, whether or not it is listed here. The catalog gives
# friendly-name resolution, a did-you-mean hint, and the `validate` target.
#
# Validate the curated entries with: earthlens datasets validate wdpa
countries:
  KEN: {name: Kenya, region: Africa}
  TZA: {name: Tanzania, region: Africa}
  ZAF: {name: South Africa, region: Africa}
  COD: {name: Democratic Republic of the Congo, region: Africa}
