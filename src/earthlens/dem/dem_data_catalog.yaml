# Global DEM data catalog — Copernicus DEM (ESA/Airbus) on the AWS Open Data
# anonymous buckets. Every row maps a dataset key to the exact anonymous S3
# bucket and to the resolution token that appears in the tile file name
# (`_10_` for GLO-30, `_30_` for GLO-90). Coverage is global 1° x 1° COG tiles
# on the integer-degree grid, and ocean tiles simply do not exist (the backend
# logs and skips them).
#
# Attribution — free-with-attribution: © ESA, produced from Copernicus data.
# The per-tile INFO/eula_F.pdf ships alongside every tile in the bucket.

datasets:
  cop-dem-glo-30:
    long_name: Copernicus DEM GLO-30 (~30 m)
    bucket: copernicus-dem-30m
    region: eu-central-1
    resolution_token: '10'
    tile_degrees: 1
    native_resolution_m: 30
    vertical_datum: EGM2008
    horizontal_datum: WGS84
    attribution: "© ESA — produced from Copernicus data"
    description: Copernicus DEM GLO-30 (TanDEM-X derived, ~30 m) as 1° COG tiles
      on the anonymous copernicus-dem-30m bucket in eu-central-1. Ocean and outside-coverage
      tiles are absent.
  cop-dem-glo-90:
    long_name: Copernicus DEM GLO-90 (~90 m)
    bucket: copernicus-dem-90m
    region: eu-central-1
    resolution_token: '30'
    tile_degrees: 1
    native_resolution_m: 90
    vertical_datum: EGM2008
    horizontal_datum: WGS84
    attribution: "© ESA — produced from Copernicus data"
    description: Copernicus DEM GLO-90 (TanDEM-X derived, ~90 m) as 1° COG tiles
      on the anonymous copernicus-dem-90m bucket in eu-central-1. Ocean and outside-coverage
      tiles are absent.
