# CSIC SPEIbase v2.10 — global 0.5° monthly Standardised Precipitation
# Evapotranspiration Index. One NetCDF per timescale (1 / 3 / 6 / 12 / 24 / 48
# months); a single CF-compliant `spei(time, lat, lon)` variable starting in
# 1901-01. The `endpoint` is the per-scale bitstream URL on
# `digital.csic.es`; when SPEIbase ships v2.11 / v2.12 the catalog row is a
# pure YAML edit (no code change). Reading happens through the already-shipped
# `pyramids.netcdf.NetCDF.read_file`; the backend slices on `time` and writes a
# GeoTIFF per requested month.
datasets:
  speibase-01:
    source: "CSIC SPEIbase v2.10 (Vicente-Serrano et al., CRU TS 4.08)"
    transport: netcdf-url
    endpoint: "https://digital.csic.es/bitstream/10261/336288/3/spei01.nc"
    coverage: null
    output_kind: raster
    cadence: monthly
    native_crs: "EPSG:4326"
    license_note: "CC-BY 4.0 — cite Vicente-Serrano et al. and SPEIbase v2.10"
