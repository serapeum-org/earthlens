# CSIC SPEIbase v2.11 — global 0.5° monthly Standardised Precipitation
# Evapotranspiration Index, driven by CRU TS 4.09 (SPEI R package 1.8.1). One
# NetCDF-4/HDF5 file per timescale (1 / 3 / 6 / 12 / 24 / 48 months) carrying a
# single CF-compliant `spei(time, lat, lon)` variable that starts in 1901-01.
# The record is advertised through 2024-12, but the last usable month varies by
# timescale — a k-month SPEI only resolves once k months have accumulated, so
# e.g. `spei12.nc` ends 2023-12 (verified live). The backend reads the axis
# length from the file at slice time and rejects an out-of-range date with a
# clear error, so the rows carry no hard end month. The `endpoint` is the
# per-scale bitstream on
# the DIGITAL.CSIC record `10261/364137` (the v2.11 handle — the older
# `10261/336288` record the catalog first shipped is a superseded release that
# only reaches 2006-12). The bitstream sequence number is NOT the timescale:
# 01/03/06/12/24 map to seq 1/3/6/12/24, but 48 lives at seq 47 (verified live
# 2026-07-01). When SPEIbase ships v2.12 the catalog row is a pure YAML edit
# (new handle + seqs, no code change).
#
# IMPORTANT — DIGITAL.CSIC sits behind an Anubis anti-bot proof-of-work wall
# that only challenges browser-like (`Mozilla…`) User-Agents; it serves the raw
# bitstream to any other UA. The backend sends its own `earthlens-drought/…` UA
# (no `Mozilla` token), so `_http_download` streams the NetCDF straight through
# — do NOT switch the download UA to a browser string or the fetch will get the
# HTML challenge page instead of the file. Reading happens through the
# already-shipped `pyramids.netcdf.NetCDF.read_file`; the backend slices on
# `time` and writes a GeoTIFF per requested month.
datasets:
  speibase-01:
    source: "CSIC SPEIbase v2.11 (Vicente-Serrano et al., CRU TS 4.09)"
    transport: netcdf-url
    endpoint: "https://digital.csic.es/bitstream/10261/364137/1/spei01.nc"
    coverage: null
    output_kind: raster
    cadence: monthly
    native_crs: "EPSG:4326"
    license_note: "CC-BY 4.0 — cite Vicente-Serrano et al. and SPEIbase v2.11"
