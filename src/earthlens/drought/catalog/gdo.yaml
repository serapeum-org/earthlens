# Global Drought Observatory (GDO) — Copernicus EMS, the global counterpart of
# EDO. The Copernicus drought WCS exposes a SINGLE map (`map=DO_WCS`); there is
# no separate `GDO_WCS` map (verified live 2026-07-01 — `map=GDO_WCS` answers
# `ERROR: invalid map parameter` under HTTP 200). The European-vs-global split
# is a data-extent distinction, not a separate endpoint, so every GDO row uses
# the same `map=DO_WCS` endpoint as EDO. The two Low-Flow Index codes
# (`lfinx_300_sms`, `lfinx_300_mds`) are genuinely GDO-specific coverages; the
# rest share their coverage id with the EDO rows (a request for `gdo-smand`
# hits `coverageID=smand` exactly like `edo-smand`, differing only in the bbox
# the caller passes). Collapsing the duplicate rows is a catalog-curation
# follow-on — see planning/drought.
datasets:
  gdo-spaST:
    source: "Copernicus Global Drought Observatory (GDO)"
    transport: edo-wcs
    endpoint: "https://drought.emergency.copernicus.eu/api/wcs?map=DO_WCS"
    coverage: spaST
    output_kind: raster
    cadence: 10day
    native_crs: "EPSG:4326"
    timescale: "01"
    license_note: "Copernicus EMS — free reuse with attribution"
