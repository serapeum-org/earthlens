# Global Drought Observatory (GDO) — Copernicus EMS, the global counterpart of
# EDO. Mirrors the 19 GDO WMS indicator codes (verified live 2026-07-01).
#
# IMPORTANT — the EDO/GDO split is a portal convention, not a data or endpoint
# difference. The Copernicus drought WCS exposes a SINGLE map, `map=DO_WCS`;
# there is NO separate `GDO_WCS` map (`map=GDO_WCS` answers `ERROR: invalid map
# parameter` under HTTP 200). Every coverage on `DO_WCS` carries GLOBAL data —
# verified: `coverageID=smand` over Africa / Asia / a whole-globe bbox all
# return real rasters. So a GDO row and its EDO twin (e.g. `gdo-smand` vs
# `edo-smand`) issue the byte-identical request; the "European vs global"
# framing lives entirely in the bbox the caller passes (`lat_lim` / `lon_lim`),
# not in the row. The two Low-Flow Index codes `lfinx_300_sms` / `lfinx_300_mds`
# appear only in the GDO WMS. The rows are kept split to mirror the two
# Copernicus portals; collapsing them into a single coverage set is a
# catalog-curation follow-on. Upstream availability varies by indicator + date
# (some coverages answer 422 outside their window or a transient 500); the
# backend surfaces the Copernicus message verbatim.
datasets:
  gdo-spaST:
    source: "Copernicus Global Drought Observatory (GDO)"
    transport: edo-wcs
    endpoint: "https://drought.emergency.copernicus.eu/api/wcs?map=DO_WCS"
    coverage: spaST
    output_kind: raster
    cadence: 10day
    native_crs: "EPSG:4326"
    timescale: "01"
    license_note: "Copernicus EMS — free reuse with attribution"
