# Global Drought Observatory (GDO) — Copernicus EMS, the global counterpart of
# EDO. Same WCS endpoint family with a distinct `map=GDO_WCS` switcher and
# global coverage extents. Indicator codes mirror EDO with global-scope
# variants on Low-Flow Index (`lfinx_300_sms`, `lfinx_300_mds`); the rest of
# the indicator codes coincide with EDO and the catalog rows here record the
# GDO endpoint so the backend routes them through the global service.
datasets:
  gdo-spaST:
    source: "Copernicus Global Drought Observatory (GDO)"
    transport: edo-wcs
    endpoint: "https://drought.emergency.copernicus.eu/api/wcs?map=GDO_WCS"
    coverage: spaST
    output_kind: raster
    cadence: 10day
    native_crs: "EPSG:4326"
    license_note: "Copernicus EMS — free reuse with attribution"
