# European Drought Observatory (EDO) — Copernicus EMS. Each row hits the same
# WCS map endpoint with a distinct coverage id. The indicator codes were
# scraped from the live WMS GetCapabilities on 2026-06-26 (see captures/);
# they mirror the WCS coverage ids 1:1 on this MapServer. The exact
# `subset=time(...)` axis spelling lands in `PY-A` (pyramids temporal WCS
# extension); these rows are EDO/GDO-half-of-C2 input and become reachable
# once that ships.
datasets:
  edo-spaST:
    source: "Copernicus European Drought Observatory (EDO)"
    transport: edo-wcs
    endpoint: "https://drought.emergency.copernicus.eu/api/wcs?map=DO_WCS"
    coverage: spaST
    output_kind: raster
    cadence: 10day
    native_crs: "EPSG:4326"
    license_note: "Copernicus EMS — free reuse with attribution"
