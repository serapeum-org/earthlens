# European Drought Observatory (EDO) — Copernicus EMS. Each row hits the same
# WCS GetCoverage endpoint with a distinct coverage id. EDO is a Copernicus
# REST shim that only honours GetCoverage (its GetCapabilities / DescribeCoverage
# discovery operations are unreliable — 502 / 400), so the backend builds the
# documented GetCoverage URL by hand (`TIME=<date>&SELECTED_TIMESCALE=<NN>` plus
# `SUBSET=Long/Lat`) with core `requests`, streams the GeoTIFF, and opens it via
# pyramids `Dataset.read_file` — no WCS handshake, no owslib. The coverage ids +
# the `TIME` / `SELECTED_TIMESCALE` param shape were verified live (see
# captures/drought-sdk-facts.md). The SPI coverages require `SELECTED_TIMESCALE`;
# the rest accept and ignore it, so every row carries one (default "01", a
# config-as-code tunable for the SPI integration window).
datasets:
  edo-spaST:
    source: "Copernicus European Drought Observatory (EDO)"
    transport: edo-wcs
    endpoint: "https://drought.emergency.copernicus.eu/api/wcs?map=DO_WCS"
    coverage: spaST
    output_kind: raster
    cadence: 10day
    native_crs: "EPSG:4326"
    timescale: "01"
    license_note: "Copernicus EMS — free reuse with attribution"
  edo-spaLT:
    source: "Copernicus European Drought Observatory (EDO)"
    transport: edo-wcs
