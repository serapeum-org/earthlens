# GBIF taxon catalog — friendly taxon keys for the earthlens GBIF backend.
#
# Each entry maps a friendly name a user can pass in `variables` to a GBIF
# backbone `taxonKey`. The values are stable GBIF backbone usage keys: the
# eight kingdom roots (1-8, e.g. Animalia=1, Plantae=6, Fungi=5) and two
# well-known class keys (Aves=212, Mammalia=359). For any taxon not listed
# here, pass a raw integer key (`variables=[212]`) or a name lookup
# (`variables=["taxon:Panthera leo"]`) which resolves live via GBIF's
# `species.name_backbone`.
#
# Validate the curated entries with: earthlens datasets validate gbif
#
# `available_datasets:` below is the informational index of GBIF backbone
# taxa earthlens recognises by friendly id — the 8 kingdom roots plus a
# curated set of commonly-queried higher taxa (classes / orders / families).
# `earthlens datasets refresh gbif` diffs this list against the curated
# `taxa:` keys above so a maintainer can see what is index-only vs wired up.
available_datasets:
  - kingdom:Animalia
  - kingdom:Archaea
  - kingdom:Bacteria
  - kingdom:Chromista
  - kingdom:Fungi
  - kingdom:Plantae
  - kingdom:Protozoa
  - kingdom:Viruses
  - kingdom:incertae-sedis
  - class:Amphibia
  - class:Arachnida
  - class:Aves
  - class:Bivalvia
  - class:Cephalopoda
  - class:Chondrichthyes
  - class:Gastropoda
  - class:Insecta
  - class:Liliopsida
  - class:Magnoliopsida
  - class:Mammalia
  - class:Pinopsida
  - class:Polypodiopsida
  - class:Reptilia
  - order:Anura
  - order:Carnivora
  - order:Cetacea
  - order:Chiroptera
  - order:Coleoptera
  - order:Diptera
  - order:Hymenoptera
  - order:Lepidoptera
  - order:Passeriformes
  - order:Primates
  - order:Rodentia
  - order:Squamata
  - order:Testudines

taxa:
  animals:
    taxon_key: 1
    title: "Animalia — animals"
    rank: kingdom
  plants:
    taxon_key: 6
    title: "Plantae — plants"
    rank: kingdom
  fungi:
    taxon_key: 5
    title: "Fungi"
    rank: kingdom
  birds:
    taxon_key: 212
    title: "Aves — birds"
    rank: class
  mammals:
    taxon_key: 359
    title: "Mammalia — mammals"
    rank: class
