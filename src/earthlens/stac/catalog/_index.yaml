# STAC catalog index — endpoints + the per-endpoint available_collections index.
#
# `endpoints:` is the curated map of STAC API endpoints the backend can open,
# each with its URL, signer type, and optional region.
#
# `available_collections:` is the informational index of every collection id
# each endpoint serves (regenerated by tools/stac/refresh_stac_catalog.py by
# walking each endpoint's /collections). Runtime code does not require it; the
# curated `collections:` blocks in the per-endpoint files are the gate.

endpoints:
  planetary-computer:
    url: https://planetarycomputer.microsoft.com/api/stac/v1
    signer: mpc-sas
  cdse:
    url: https://stac.dataspace.copernicus.eu/v1
    signer: cdse-s3
  earth-search:
    url: https://earth-search.aws.element84.com/v1
    signer: anonymous
    region: us-west-2

available_collections:
  planetary-computer:
    - sentinel-2-l2a
    - landsat-c2-l2
    - cop-dem-glo-30
  cdse:
    - sentinel-2-l2a
    - sentinel-1-grd
  earth-search:
    - sentinel-2-c1-l2a
    - cop-dem-glo-30
