# Curated collections served by Earth Search (Element 84 / AWS).

collections:
  earth-search/cop-dem-glo-90:
    assets:
      data:
        dtype: float32
        title: Data
    collection_id: cop-dem-glo-90
    default_assets:
    - data
    endpoint: earth-search
  earth-search/landsat-c2-l2:
    signer: aws-requester-pays
    assets:
      atmos_opacity:
        dtype: int16
        nodata: -9999
        title: Atmospheric Opacity Band
      atran:
        dtype: int16
        nodata: -9999
        title: Atmospheric Transmittance Band
      blue:
        dtype: uint16
        nodata: 0
        title: Blue Band
      cdist:
        dtype: int16
        nodata: -9999
        title: Cloud Distance Band
      cloud_qa:
        dtype: uint8
        title: Cloud Quality Assessment Band
      coastal:
        dtype: uint16
        nodata: 0
        title: Coastal/Aerosol Band
      drad:
        dtype: int16
        nodata: -9999
        title: Downwelled Radiance Band
      emis:
        dtype: int16
        nodata: -9999
        title: Emissivity Band
      emsd:
        dtype: int16
        nodata: -9999
        title: Emissivity Standard Deviation Band
      green:
        dtype: uint16
        nodata: 0
        title: Green Band
      lwir:
        dtype: uint16
        nodata: 0
