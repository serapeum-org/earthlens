  </g><!-- /globe -->
  <!-- bridge focus line rig-tip -> globe -->
  <g class="env"><path d="M256,372 L256,414" stroke="#F2C879" stroke-width="2" stroke-dasharray="4 5" opacity="0.7" fill="none"/></g>
