name: pypi-release

on:
  workflow_dispatch:
  workflow_run:
    workflows: ['github-release']
    types: [completed]

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    if: >-
      ${{ github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion == 'success' }}

    strategy:
      # One distribution at a time, dependencies before dependents: a member is
      # pinned to `earthlens-core ==<version>`, so core must reach the index
      # first or an install racing the release resolves against a version that
      # is not there yet. `fail-fast` then stops on the first failure rather
      # than publishing further members of a release that is already broken —
      # a version can never be re-uploaded to PyPI, so publishing less is
      # recoverable and publishing more is not.
      fail-fast: true
      max-parallel: 1
      matrix:
        package:
          - earthlens-core
          - earthlens-atmosphere
          - earthlens-ocean
          - earthlens-imagery
          - earthlens-land
          - earthlens-hazards
          - earthlens

    name: publish ${{ matrix.package }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: ${{ github.event.workflow_run.head_branch || github.ref }}

      # release/pypi forwards no uv version input, so uv resolves to latest here
      # (the other lanes pin 0.11.29); wheel-test.yml separately validates the
      # wheels under the pinned uv. uv build output is insensitive to the patch.
      - name: Build and publish to PyPI
        uses: serapeum-org/github-actions/actions/release/pypi@38c111084f99d5ff5f4a1e63bedce48fe33a10c0 # pypi-release/v1.0.3
        with:
          pypi-username: __token__
          pypi-password: ${{ secrets.PYPI_PUBLISH }}
          package-manager: 'uv'
          install-groups: 'groups: dev'
          verify-lock: 'false'
          package: ${{ matrix.package }}
