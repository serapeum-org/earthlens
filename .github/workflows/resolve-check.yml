name: Resolve - Extras & Conflicts

# Resolves and installs every declared extra combination from the wheels under
# test, then runs `pip check`. The workspace's whole reason for existing is that
# some provider SDKs cannot coexist, and that fact is only ever visible at
# resolution time: the unit suite fakes the conflicting SDKs (tests/argo,
# tests/osm monkeypatch `sys.modules`), so a broken dependency graph is invisible
# to it. This job is what makes a new conflict — or a stale exclusion — fail loudly.

permissions:
  contents: read

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build-wheels:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up Pixi
        uses: serapeum-org/github-actions/actions/python-setup/pixi@cd02ddbe749b77cbafd08bc48c788974fc989db7 # pixi/v1
        with:
          environments: dev
          activate-environment: dev
          cache: true

      - name: Build every distribution's wheel
        run: |
          set -euo pipefail
          for pkg in libs/core \
                     libs/providers/atmosphere \
                     libs/providers/ocean \
                     libs/providers/imagery \
                     libs/providers/land \
                     libs/providers/hazards \
                     . ; do
            pixi run -e dev python -m build --wheel --outdir dist/ "$pkg"
          done
          ls -1 dist/*.whl

      - uses: actions/upload-artifact@v4
        with:
          name: resolve-wheels
          path: dist/*.whl

  resolve:
    needs: build-wheels
    runs-on: ubuntu-latest
    strategy:
      # Never fail-fast: one unresolvable combination should not hide the
      # status of the others — the whole point is to see which ones broke.
      fail-fast: false
      matrix:
        target:
          # Core alone must install with no provider SDK at all.
          - earthlens-core
          - earthlens-core[s3]
          # Each thematic distribution with every one of its extras. These
          # include the conflict drivers (ocean[all] pulls argo, hazards[all]
          # pulls osm and osm-pbf) — inside one theme they are expected to
          # coexist, and that expectation is what this asserts.
          - earthlens-atmosphere[all]
          - earthlens-ocean[all]
          - earthlens-imagery[all]
          - earthlens-land[all]
          - earthlens-hazards[all]
          # The drivers excluded from the meta-package's `all`, each proven to
          # install on its own — exclusion must mean "cannot combine", never
          # "cannot install".
          - earthlens-ocean[argo]
          - earthlens-hazards[osm]
          - earthlens-hazards[osm-pbf]
          # The meta-package: every theme at once, minus the excluded drivers.
          - earthlens[all]

    name: ${{ matrix.target }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - uses: actions/download-artifact@v4
        with:
          name: resolve-wheels
          path: dist/

      - name: Install ${{ matrix.target }}
        # --find-links resolves the workspace siblings from the wheels just
        # built; this version does not exist on PyPI yet. GDAL is not needed —
        # the pyramids-gis wheel vendors it.
        run: pip install --find-links dist "${{ matrix.target }}"

      - name: pip check
        # Catches a graph that installed but is internally inconsistent — the
        # exact drift (`argopy`/`ohsome` present with violated pins) that went
        # unnoticed in the dev environment because the tests fake those SDKs.
        run: pip check

      - name: Registry still resolves
        run: |
          python - <<'PY'
          from earthlens import EarthLens
          keys = len(EarthLens.DataSources)
          print(f"registry keys: {keys}")
          assert keys == 115, f"expected 115 registered keys, got {keys}"
          PY

  conflicts-are-still-real:
    # `all` excludes argo/osm/osm-pbf. Each exclusion is a claim about the
    # outside world that silently expires when upstream relaxes a pin, so assert
    # the reasons still hold — if a check here fails, the extra can rejoin `all`.
    #
    # The two exclusions are NOT the same kind of conflict, and testing them the
    # same way is wrong:
    #   * argo vs openeo is UNSATISFIABLE — argopy needs xarray >=2025.7, openeo
    #     <0.48 needs xarray <2025.1.2. No version satisfies both, so pip fails.
    #   * osm is SATISFIABLE BUT UNWANTED — ohsome caps pandas <3, and pip is
    #     happy to resolve it by silently downgrading the whole environment to
    #     pandas 2.x. Asserting "pip must fail" here is simply false (verified:
    #     it resolves to pandas 2.3.3). What must be asserted is the *cost*.
    needs: build-wheels
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - uses: actions/download-artifact@v4
        with:
          name: resolve-wheels
          path: dist/

      - name: argo + openeo must remain unsatisfiable
        run: |
          set +e
          pip install --dry-run --find-links dist \
            "earthlens-ocean[argo]" "earthlens-imagery[openeo]" > argo.log 2>&1
          status=$?
          set -e
          tail -20 argo.log
          if [ $status -eq 0 ]; then
            echo "::error::argo + openeo now RESOLVES — their xarray ranges no longer conflict."
            echo "::error::Both can rejoin the meta-package's 'all' extra; drop the exclusion."
            exit 1
          fi
          echo "still unsatisfiable (pip exited $status) — exclusion justified"

      - name: osm must still cost the pandas-3 graph
        run: |
          set +e
          pip install --dry-run --find-links dist \
            "earthlens-hazards[osm]" "earthlens[all]" > osm.log 2>&1
          status=$?
          set -e
          if [ $status -ne 0 ]; then
            echo "osm + all does not resolve at all (pip exited $status) — exclusion justified"
            exit 0
          fi
          # It resolved. The only question is what it cost: ohsome's `pandas<3`
          # cap is satisfied by dragging every other backend back to pandas 2.
          pandas=$(grep -oE "pandas-[0-9]+\.[0-9]+\.[0-9]+" osm.log | head -1 | cut -d- -f2)
          echo "osm + all resolves with pandas ${pandas:-unknown}"
          case "$pandas" in
            3.*)
              echo "::error::osm + all now resolves on pandas 3 — ohsome no longer caps pandas <3."
              echo "::error::The reason osm is excluded from 'all' is gone; it can rejoin."
              exit 1
              ;;
            "")
              echo "::error::could not determine the resolved pandas version — check osm.log"
              exit 1
              ;;
            *)
              echo "still forces pandas $pandas (<3) on the whole graph — exclusion justified"
              ;;
          esac
