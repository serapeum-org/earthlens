name: Catalog drift (scheduled)

# Provider catalogs pin third-party dataset ids and variable names, and those
# drift: upstream renames a dataset, re-cases a column, retires a cadence.
# Nothing detected that until it broke an unrelated PR's e2e job - see #1129,
# where CoastWatch retired `nceiPH53sstd1day` and re-cased `wtmp` to `WTMP`.
#
# `earthlens datasets audit --strict` already flags curated datasets a provider
# no longer serves and exits non-zero; this workflow is the missing gate that
# actually runs it. It names the dead dataset in one line, without downloading
# a byte - unlike an e2e fetch failure, which reads like ordinary flakiness.
#
# Deliberately SCHEDULED, not per-PR: it needs the network and provider
# credentials, so it would be slow and flaky as a required check, and a
# contributor should never have their PR blocked because NOAA renamed a
# dataset. The point is to attribute drift to drift, on a cadence.

permissions:
  contents: read

# A half-finished audit tells you nothing, so never cancel one in flight.
concurrency:
  group: ${{ github.workflow }}-${{ github.run_id }}
  cancel-in-progress: false

on:
  schedule:
    # Monday 05:00 UTC, after Sunday's e2e cron, so a drift report lands next
    # to the e2e failures it explains.
    - cron: '0 5 * * 1'
  workflow_dispatch:
    inputs:
      providers:
        description: "Provider(s) to audit: a name, a comma-separated list, or 'all'."
        required: false
        default: 'all'

jobs:
  drift:
    runs-on: ubuntu-latest
    # Forks have no credentials; a provider needing auth would fail to list.
    if: github.repository == 'serapeum-org/earthlens'
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: serapeum-org/github-actions/actions/python-setup/uv@38c111084f99d5ff5f4a1e63bedce48fe33a10c0 # uv/v1.2.1
        with:
          python-version: "3.12"
          install-groups: "groups: dev, extras: all"
          verify-lock: true
          version: "0.11.29"

      - name: Audit curated datasets against live
        env:
          # Providers whose listing endpoint needs auth. A provider without a
          # public listing endpoint self-reports `unsupported` rather than
          # failing, so passing `all` is safe.
          CDSAPI_URL: ${{ secrets.CDSAPI_URL }}
          CDSAPI_KEY: ${{ secrets.CDSAPI_KEY }}
          GEE_SERVICE_ACCOUNT: ${{ secrets.GEE_SERVICE_ACCOUNT }}
          GEE_SERVICE_KEY: ${{ secrets.GEE_SERVICE_KEY }}
          EARTHDATA_USERNAME: ${{ secrets.EARTHDATA_USERNAME }}
          EARTHDATA_PASSWORD: ${{ secrets.EARTHDATA_PASSWORD }}
          EARTHDATA_TOKEN: ${{ secrets.EARTHDATA_TOKEN }}
          EUMETSAT_CONSUMER_KEY: ${{ secrets.EUMETSAT_CONSUMER_KEY }}
          EUMETSAT_CONSUMER_SECRET: ${{ secrets.EUMETSAT_CONSUMER_SECRET }}
          CDSE_S3_ACCESS_KEY: ${{ secrets.CDSE_S3_ACCESS_KEY }}
          CDSE_S3_SECRET_KEY: ${{ secrets.CDSE_S3_SECRET_KEY }}
          SENTINELHUB_CLIENT_ID: ${{ secrets.SENTINELHUB_CLIENT_ID }}
          SENTINELHUB_CLIENT_SECRET: ${{ secrets.SENTINELHUB_CLIENT_SECRET }}
          IUCN_TOKEN: ${{ secrets.IUCN_TOKEN }}
          WDPA_TOKEN: ${{ secrets.WDPA_TOKEN }}
          COPERNICUSMARINE_SERVICE_USERNAME: ${{ secrets.COPERNICUSMARINE_SERVICE_USERNAME }}
          COPERNICUSMARINE_SERVICE_PASSWORD: ${{ secrets.COPERNICUSMARINE_SERVICE_PASSWORD }}
          OPENAQ_API_KEY: ${{ secrets.OPENAQ_API_KEY }}
          FIRMS_MAP_KEY: ${{ secrets.FIRMS_MAP_KEY }}
          GFW_API_KEY: ${{ secrets.GFW_API_KEY }}
          # Chosen by the dispatch input; the cron path has no inputs, so fall
          # back to auditing everything.
          PROVIDERS: ${{ inputs.providers || 'all' }}
        run: |
          # --strict exits non-zero when a curated dataset is no longer served.
          # --json keeps the machine-readable outcome in the log next to the
          # human table, so a failure can be triaged without a re-run.
          uv run --locked earthlens datasets audit "$PROVIDERS" --strict
