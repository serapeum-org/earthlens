name: Tests - E2E (live CDS + GEE + STAC)

# Live end-to-end suites against external services (Copernicus Climate
# Data Store; Google Earth Engine). These hit real servers / queue
# server-side, so running on every push/PR would burn quota and slow
# CI. So:
#
#   * schedule: weekly on Sunday at 04:00 UTC
#   * workflow_dispatch: manual trigger from the Actions tab
#
# Forks cannot read repo secrets, so a fork-PR run would fail at auth.
# The jobs below only run on the main repo, and each suite skips its
# tests when its credentials are absent.

permissions:
  contents: read

# This workflow has no `pull_request` trigger, so the expression below is
# always false and the block only SERIALISES: two dispatches on the same ref
# queue instead of burning CDS quota twice over, which is what you want
# against rate- and quota-limited services.
#
# The expression is kept rather than hard-coded `false` so the PR-cancel half
# switches on by itself if a `pull_request` trigger is ever added - at which
# point re-read it, because cancelling a half-finished live run mid-flight is
# not obviously right for this suite.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

on:
  schedule:
    - cron: '0 4 * * 0'
  workflow_dispatch:

jobs:
  # Every suite without a dedicated lane below, CDS included - but split one
  # job per distribution instead of one job for all of them.
  #
  # Why: pytest runs a suite in ONE process, and a native crash kills that
  # process rather than failing a test. Until 2026-08-02 this was a single job
  # covering ~38 suites, and it had been dying since at least 2026-07-19 on a
  # segfault in `hazards/tests/admin` (issue #925). `hazards` sorts 16th of 47,
  # so the 23 suites behind it silently never ran while the job reported one
  # generic failure that read like ordinary live-service flakiness.
  #
  # Splitting bounds the blast radius to one distribution, and `fail-fast:
  # false` stops one crash cancelling the others mid-flight.
  e2e-shared:
    runs-on: ubuntu-latest
    # Only run when credentials are available (the main repo). Forks
    # have no secrets and would 401 immediately.
    if: github.repository == 'serapeum-org/earthlens'

    strategy:
      fail-fast: false
      matrix:
        package:
          - libs/core
          - libs/providers/atmosphere
          - libs/providers/hazards
          - libs/providers/imagery
          - libs/providers/land
          - libs/providers/ocean

    name: e2e-shared (${{ matrix.package }})

    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: serapeum-org/github-actions/actions/python-setup/uv@uv/v1.2.0
        with:
          python-version: "3.12"
          install-groups: "groups: dev, extras: all"
          verify-lock: true
          version: "0.11.29"

      - name: Run live e2e tests
        env:
          CDSAPI_URL: ${{ secrets.CDSAPI_URL }}
          CDSAPI_KEY: ${{ secrets.CDSAPI_KEY }}
        run: |
          # The marker exclusions drop the suites that have their own lane
          # below; the deselect drops the one test that segfaults the
          # interpreter on Linux (issue #925) - it passes locally in ~6 s, so
          # it is dropped here rather than skipped in the test file. Removing
          # this line once #925 is fixed also brings back the three admin
          # tests that sit behind it in the same file.
          #
          # The node id is relative to the PACKAGE, not the repo: each package
          # ships its own [tool.pytest.ini_options], so passing a package path
          # moves pytest's rootdir there. A repo-relative id silently matches
          # nothing.
          uv run --locked pytest ${{ matrix.package }} -v \
            -m "e2e and not gee and not stac and not sentinel_hub and not nwp and not caravan" \
            --deselect "tests/admin/test_admin_e2e.py::TestAdminLiveFetch::test_geoboundaries_country_adm1"

  e2e-caravan:
    runs-on: ubuntu-latest
    if: github.repository == 'serapeum-org/earthlens'

    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up Python
        # Pinned to the commit the `uv/v1.2.0` tag points at: a tag can be
        # moved, a commit cannot. The other lanes in this file still track the
        # tag - see the note on the pytest call below.
        uses: serapeum-org/github-actions/actions/python-setup/uv@bc6c376c15ffbfe4d9f46fe7e39b0c2e56302ca8 # uv/v1.2.0
        with:
          python-version: "3.12"
          install-groups: "groups: dev, extras: all"
          verify-lock: true
          version: "0.11.29"

      - name: Run live Caravan e2e tests
        # Anonymous static Zenodo archives, so no secrets and nothing to skip.
        # The suite asserts a transferred-byte budget - that one catchment
        # costs ~3 MB out of an 8.84 GB archive - so it is the regression gate
        # for the range-read design, not a smoke test.
        #
        # `--locked` makes the run fail rather than silently re-resolve if
        # uv.lock has drifted, so the versions under test are the locked ones.
        run: |
          uv run --locked pytest -m "e2e and caravan" -v

  e2e-gee:
    runs-on: ubuntu-latest
    if: github.repository == 'serapeum-org/earthlens'

    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: serapeum-org/github-actions/actions/python-setup/uv@uv/v1.2.0
        with:
          python-version: "3.12"
          install-groups: "groups: dev, extras: all"
          verify-lock: true
          version: "0.11.29"

      - name: Run live Google Earth Engine e2e tests
        # The GEE e2e test skips itself when these are unset, so this
        # job is harmless if the secrets are not configured yet.
        env:
          GEE_SERVICE_ACCOUNT: ${{ secrets.GEE_SERVICE_ACCOUNT }}
          GEE_SERVICE_KEY: ${{ secrets.GEE_SERVICE_KEY }}
        run: |
          uv run pytest -m "e2e and gee" -v

  e2e-earthdata:
    runs-on: ubuntu-latest
    if: github.repository == 'serapeum-org/earthlens'

    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: serapeum-org/github-actions/actions/python-setup/uv@uv/v1.2.0
        with:
          # earthaccess >=0.18 requires Python >=3.12, so the Earthdata
          # extra is exercised under the py312 environment.
          python-version: "3.12"
          install-groups: "groups: dev, extras: all"
          verify-lock: true
          version: "0.11.29"

      - name: Run live NASA Earthdata e2e tests
        # The Earthdata e2e test skips itself when these are unset, so
        # this job is harmless if the secrets are not configured yet.
        env:
          EARTHDATA_USERNAME: ${{ secrets.EARTHDATA_USERNAME }}
          EARTHDATA_PASSWORD: ${{ secrets.EARTHDATA_PASSWORD }}
          # Alternative to username/password: a single EDL bearer token.
          EARTHDATA_TOKEN: ${{ secrets.EARTHDATA_TOKEN }}
        run: |
          uv run pytest -m "e2e and earthdata" -v

  e2e-eumetsat:
    runs-on: ubuntu-latest
    if: github.repository == 'serapeum-org/earthlens'

    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: serapeum-org/github-actions/actions/python-setup/uv@uv/v1.2.0
        with:
          python-version: "3.12"
          install-groups: "groups: dev, extras: all"
          verify-lock: true
          version: "0.11.29"

      - name: Run live EUMETSAT Data Store e2e tests
        # The EUMETSAT e2e test skips itself when these are unset, so this
        # job is harmless if the secrets are not configured yet. Register a
        # consumer key/secret at https://api.eumetsat.int/api-key/.
        env:
          EUMETSAT_CONSUMER_KEY: ${{ secrets.EUMETSAT_CONSUMER_KEY }}
          EUMETSAT_CONSUMER_SECRET: ${{ secrets.EUMETSAT_CONSUMER_SECRET }}
        run: |
          uv run pytest -m "e2e and eumetsat" -v

  e2e-stac:
    runs-on: ubuntu-latest
    if: github.repository == 'serapeum-org/earthlens'

    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: serapeum-org/github-actions/actions/python-setup/uv@uv/v1.2.0
        with:
          python-version: "3.12"
          install-groups: "groups: dev, extras: all"
          verify-lock: true
          version: "0.11.29"

      - name: Run live STAC e2e tests
        # Earth Search is anonymous (no creds); MPC runs via planetary-computer
        # (in the [all] extra); CDSE skips itself without CDSE_S3_* secrets. So
        # this lane exercises the real download path with no credentials.
        env:
          CDSE_S3_ACCESS_KEY: ${{ secrets.CDSE_S3_ACCESS_KEY }}
          CDSE_S3_SECRET_KEY: ${{ secrets.CDSE_S3_SECRET_KEY }}
        run: |
          uv run pytest -m "stac and e2e" -v

  e2e-sentinel-hub:
    runs-on: ubuntu-latest
    if: github.repository == 'serapeum-org/earthlens'

    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: serapeum-org/github-actions/actions/python-setup/uv@uv/v1.2.0
        with:
          python-version: "3.12"
          install-groups: "groups: dev, extras: all"
          verify-lock: true
          version: "0.11.29"

      - name: Run live Sentinel Hub e2e tests
        # The Sentinel Hub e2e tests skip themselves when these are unset, so
        # this job is harmless if the secrets are not configured yet. Batch /
        # Batch-Statistical are not exercised live (they need a user S3 bucket).
        env:
          SENTINELHUB_CLIENT_ID: ${{ secrets.SENTINELHUB_CLIENT_ID }}
          SENTINELHUB_CLIENT_SECRET: ${{ secrets.SENTINELHUB_CLIENT_SECRET }}
        run: |
          uv run pytest -m "sentinel_hub and e2e" -v

  e2e-nwp:
    runs-on: ubuntu-latest
    if: github.repository == 'serapeum-org/earthlens'

    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: serapeum-org/github-actions/actions/python-setup/uv@uv/v1.2.0
        with:
          python-version: "3.12"
          install-groups: "groups: dev, extras: all"
          verify-lock: true
          version: "0.11.29"

      - name: Run live NWP e2e tests
        # This lane installs the `nwp` extra (Herbie / ecmwf-opendata) via the
        # uv sync above, so the Herbie-fetched models (GFS / NODD) import and
        # download live here; the GRIB read path decodes through pyramids' GDAL
        # driver, so it needs no separate eccodes binary. NODD / DWD / ECMWF
        # Open Data are anonymous (no secrets); the suite skips anything that is
        # transiently unavailable.
        run: |
          uv run pytest -m "e2e and nwp" -v

  e2e-asf:
    runs-on: ubuntu-latest
    if: github.repository == 'serapeum-org/earthlens'

    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: serapeum-org/github-actions/actions/python-setup/uv@uv/v1.2.0
        with:
          # asf_search reuses the EDL auth from `earthdata`, which needs
          # Python >=3.12 for earthaccess >=0.18.
          python-version: "3.12"
          install-groups: "groups: dev, extras: all"
          verify-lock: true
          version: "0.11.29"

      - name: Run live ASF (InSAR) e2e tests
        # Anonymous search and stack run with no secrets; the authed
        # download branch skips itself when neither EARTHDATA_TOKEN nor
        # EARTHDATA_USERNAME/PASSWORD is set, so the job is harmless if
        # those secrets are unconfigured.
        env:
          EARTHDATA_USERNAME: ${{ secrets.EARTHDATA_USERNAME }}
          EARTHDATA_PASSWORD: ${{ secrets.EARTHDATA_PASSWORD }}
          EARTHDATA_TOKEN: ${{ secrets.EARTHDATA_TOKEN }}
        run: |
          uv run pytest -m "e2e and asf" -v

  e2e-iucn:
    runs-on: ubuntu-latest
    if: github.repository == 'serapeum-org/earthlens'

    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: serapeum-org/github-actions/actions/python-setup/uv@uv/v1.2.0
        with:
          python-version: "3.12"
          install-groups: "groups: dev, extras: all"
          verify-lock: true
          version: "0.11.29"

      - name: Run live IUCN Red List e2e tests
        # The IUCN e2e test skips itself when IUCN_TOKEN is unset, so this
        # job is harmless if the secret is not configured yet. Sign up for a
        # free token at https://api.iucnredlist.org/users/sign_up.
        env:
          IUCN_TOKEN: ${{ secrets.IUCN_TOKEN }}
        run: |
          uv run pytest -m "e2e and iucn" -v

  e2e-wdpa:
    runs-on: ubuntu-latest
    if: github.repository == 'serapeum-org/earthlens'

    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: serapeum-org/github-actions/actions/python-setup/uv@uv/v1.2.0
        with:
          python-version: "3.12"
          install-groups: "groups: dev, extras: all"
          verify-lock: true
          version: "0.11.29"

      - name: Run live Protected Planet (WDPA) e2e tests
        # The WDPA e2e test skips itself when WDPA_TOKEN is unset, so this
        # job is harmless if the secret is not configured yet. Request a
        # personal token at https://api.protectedplanet.net/request.
        env:
          WDPA_TOKEN: ${{ secrets.WDPA_TOKEN }}
        run: |
          uv run pytest -m "e2e and wdpa" -v
