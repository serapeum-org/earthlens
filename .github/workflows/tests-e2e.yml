name: Tests - E2E (full live sweep on merge)

# The full cross-provider live sweep. Per-PR e2e on a changed provider's files
# lives in the tests-e2e-<theme>.yml callers; this workflow runs every lane of
# every theme on a merge to `main`, plus core's own.
#
# It used to be 13 hand-written jobs restating what tests-e2e-reusable.yml
# already expresses as a lane table, and the copy had drifted into the weaker
# of the two: no `timeout-minutes` (so a hung provider held a runner for the
# 6-hour default), no `-rs` (so a skip's reason was illegible in the one log
# where it matters most), and marker-only selection with no path scope (so each
# dedicated job collected all six members — ~9,400 tests — to execute about
# seven). Delegating removes the second definition rather than re-syncing it:
# the lanes, their extras, their timeouts, the `--junitxml` + assert_tests_ran
# guard and the `allow_empty` / `allow_all_skipped` declarations now have one
# home, and `run_all: true` is the only thing this file says that a PR run
# does not.
#
# Jobs run only on the main repo (forks have no secrets) and self-skip when a
# credential is absent — both enforced inside the reusable workflow.

permissions:
  contents: read

# No pull_request trigger here (per-PR e2e is the tests-e2e-<theme>.yml callers),
# so key the group on the run id: every run (a merge to `main` or a dispatch) gets
# its own group and runs to the end - a later merge never cancels an earlier one.
# Overlapping live runs are the accepted cost of never dropping a merge's run.
concurrency:
  group: ${{ github.workflow }}-${{ github.run_id }}
  cancel-in-progress: false

on:
  push:
    branches: [main]
    paths-ignore:  # docs-only merges skip; code and CI changes run
      - 'docs/**'
      - '**/*.md'
      - 'mkdocs.yml'
  workflow_dispatch:

jobs:
  # One call per theme, each running every lane in that theme's table
  # regardless of what the merge touched. Split per theme for the same reason
  # the old `e2e-shared` matrix was split per distribution: pytest runs a suite
  # in ONE process and a native crash kills the process rather than failing a
  # test, so a segfault in `hazards/tests/admin` used to take the 23 suites
  # collected behind it down with it, silently (#925). Lane-level splitting
  # inside each theme bounds the blast radius further still.
  core:
    uses: ./.github/workflows/tests-e2e-core.yml
    with:
      run_all: true
    secrets: inherit

  atmosphere:
    uses: ./.github/workflows/tests-e2e-reusable.yml
    with:
      theme: atmosphere
      run_all: true
    secrets: inherit

  ocean:
    uses: ./.github/workflows/tests-e2e-reusable.yml
    with:
      theme: ocean
      run_all: true
    secrets: inherit

  imagery:
    uses: ./.github/workflows/tests-e2e-reusable.yml
    with:
      theme: imagery
      # Imagery's lanes talk to the slowest hosts in the repo (EUMETSAT Data
      # Store, ASF, CDSE), which is why its caller raises the cap too.
      timeout_minutes: 60
      run_all: true
    secrets: inherit

  land:
    uses: ./.github/workflows/tests-e2e-reusable.yml
    with:
      theme: land
      run_all: true
    secrets: inherit

  hazards:
    uses: ./.github/workflows/tests-e2e-reusable.yml
    with:
      theme: hazards
      run_all: true
    secrets: inherit

  # A lane whose upstream is chronically unreliable is marked `quarantined`
  # rather than deleted or left to redden its neighbours, which means nothing
  # runs it by default. This job does, after the sweep, and never gates: its
  # job is to say whether a quarantined backend has recovered enough to come
  # back, not to fail a merge that was already green.
  quarantined:
    needs: [core, atmosphere, ocean, imagery, land, hazards]
    if: always() && github.repository == 'serapeum-org/earthlens'
    continue-on-error: true
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: serapeum-org/github-actions/actions/python-setup/uv@38c111084f99d5ff5f4a1e63bedce48fe33a10c0 # uv/v1.2.1
        with:
          python-version: "3.12"
          install-groups: "groups: dev, extras: all"
          verify-lock: true
          version: "0.11.29"

      - name: Run the quarantined live tests
        env:
          CDSAPI_URL: ${{ secrets.CDSAPI_URL }}
          CDSAPI_KEY: ${{ secrets.CDSAPI_KEY }}
          GEE_SERVICE_ACCOUNT: ${{ secrets.GEE_SERVICE_ACCOUNT }}
          GEE_SERVICE_KEY: ${{ secrets.GEE_SERVICE_KEY }}
          EARTHDATA_USERNAME: ${{ secrets.EARTHDATA_USERNAME }}
          EARTHDATA_PASSWORD: ${{ secrets.EARTHDATA_PASSWORD }}
          EARTHDATA_TOKEN: ${{ secrets.EARTHDATA_TOKEN }}
          IUCN_TOKEN: ${{ secrets.IUCN_TOKEN }}
          WDPA_TOKEN: ${{ secrets.WDPA_TOKEN }}
          API_USGS_PAT: ${{ secrets.API_USGS_PAT }}
          OPENAQ_API_KEY: ${{ secrets.OPENAQ_API_KEY }}
          FIRMS_MAP_KEY: ${{ secrets.FIRMS_MAP_KEY }}
          NREL_API_KEY: ${{ secrets.NREL_API_KEY }}
          NREL_EMAIL: ${{ secrets.NREL_EMAIL }}
          GFW_API_KEY: ${{ secrets.GFW_API_KEY }}
        # Naming the marker in `-m` is what un-holds them (see
        # earthlens.testing.pytest_collection_modifyitems). Exit 5 (nothing
        # quarantined right now) is the healthy state, so treat it as a pass.
        run: |
          set +e
          uv run --locked pytest -m "e2e and quarantined" -rs -v
          code=$?
          set -e
          if [ "$code" -eq 5 ]; then
            echo "nothing is quarantined — the healthy state"
            exit 0
          fi
          exit "$code"
