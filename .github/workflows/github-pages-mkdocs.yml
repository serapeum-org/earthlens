name: Deploy MkDocs

permissions:
  contents: write
  pages: write

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - '**'
  release:
      types:
        - published
  workflow_run:
    workflows: ['github-release']
    types: [completed]

# Serialise deploys to the shared `gh-pages` branch: every PR/main/release
# deploy pushes the built docs to the same branch, so overlapping runs race
# and the loser fails with `! [rejected] ... fetch first`. One global group
# (not keyed by ref) makes them queue instead of racing.
concurrency:
  group: mkdocs-gh-pages-deploy
  cancel-in-progress: false

jobs:
  # Gate every deploy on a warnings-as-errors build. The deploy action builds
  # non-strict, so a broken nav entry, a dangling anchor or a malformed
  # docstring would publish silently — this fails the run instead.
  build-strict:
    runs-on: ubuntu-latest
    # Only reads the tree; the write scopes the workflow grants are for the
    # deploy jobs, not for this one.
    permissions:
      contents: read
    steps:
    # No explicit ref: checkout's own default is what we want on every trigger,
    # and it is the merge commit on a pull_request rather than the fork's head.
    # Naming a ref from the event payload would put fork-controlled code into
    # this job.
    - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09  # v5
      with:
        fetch-depth: 0
        persist-credentials: false

    # The same setup the deploy jobs get. mkdocs-deploy calls this action
    # internally with these inputs, so reusing it here keeps the gate and the
    # deploy on one environment; installing the toolchain by hand would let the
    # two drift and defeat the point of gating.
    - uses: serapeum-org/github-actions/actions/python-setup/uv@uv/v1.2.0
      with:
        python-version: "3.12"
        install-groups: "groups: docs"
        version: "0.11.29"
        verify-lock: false

    # The setup action already synced and put .venv on PATH, so build from it
    # rather than letting uv resolve a second time.
    - name: Build docs with --strict
      run: uv run --no-sync mkdocs build --strict --site-dir /tmp/site

  deploy-pr:
      if: github.event_name == 'pull_request'
      needs: build-strict
      runs-on: ubuntu-latest
      steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: serapeum-org/github-actions/actions/mkdocs-deploy@mkdocs/v1.3.0
        with:
          trigger: 'pull_request'
          package-manager: 'uv'
          package-manager-version: "0.11.29"
          install-groups: "groups: docs"
          deploy-token: ${{ secrets.ACTIONS_DEPLOY_TOKEN }}

  deploy-main:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: build-strict
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v5
      with:
        fetch-depth: 0
    - uses: serapeum-org/github-actions/actions/mkdocs-deploy@mkdocs/v1.3.0
      with:
        trigger: 'main'
        package-manager: 'uv'
        package-manager-version: "0.11.29"
        install-groups: "groups: docs"
        deploy-token: ${{ secrets.ACTIONS_DEPLOY_TOKEN }}

  deploy-release:
    if: >-
      github.event_name == 'release' ||
      (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success')
    needs: build-strict
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v5
      with:
        fetch-depth: 0
        ref: ${{ github.event.workflow_run.head_branch || github.ref }}

    - name: Extract version from pyproject.toml
      id: version
      run: |
        VERSION=$(grep -m1 '^version' pyproject.toml | sed 's/.*"\(.*\)"/\1/')
        echo "tag=$VERSION" >> $GITHUB_OUTPUT

    - uses: serapeum-org/github-actions/actions/mkdocs-deploy@mkdocs/v1.3.0
      with:
        trigger: 'release'
        package-manager: 'uv'
        package-manager-version: "0.11.29"
        install-groups: "groups: docs"
        deploy-token: ${{ secrets.ACTIONS_DEPLOY_TOKEN }}
        release-tag: ${{ github.event.release.tag_name || steps.version.outputs.tag }}
        mike-alias: 'latest'
