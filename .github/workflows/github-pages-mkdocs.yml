name: Deploy MkDocs

permissions:
  contents: write
  pages: write

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - '**'
  release:
      types:
        - published
  workflow_run:
    workflows: ['github-release']
    types: [completed]

# Serialise deploys to the shared `gh-pages` branch: every PR/main/release
# deploy pushes the built docs to the same branch, so overlapping runs race
# and the loser fails with `! [rejected] ... fetch first`. One global group
# (not keyed by ref) makes them queue instead of racing.
concurrency:
  group: mkdocs-gh-pages-deploy
  cancel-in-progress: false

jobs:
  # Gate every deploy on a warnings-as-errors build. The deploy action builds
  # non-strict, so a broken nav entry, a dangling anchor or a malformed
  # docstring would publish silently — this fails the run instead.
  build-strict:
    runs-on: ubuntu-latest
    # Only reads the tree; the write scopes the workflow grants are for the
    # deploy jobs, not for this one.
    permissions:
      contents: read
    steps:
    # Check out the same ref deploy-release publishes. On a workflow_run
    # trigger the default ref is not the release branch, so without this the
    # gate would validate one commit while the deploy shipped another.
    - uses: actions/checkout@v5
      with:
        fetch-depth: 0
        ref: ${{ github.event.workflow_run.head_branch || github.ref }}

    - uses: astral-sh/setup-uv@v5
      with:
        version: "0.11.29"

    - name: Build docs with --strict
      run: uv run --group docs --extra all mkdocs build --strict --site-dir /tmp/site

  deploy-pr:
      if: github.event_name == 'pull_request'
      needs: build-strict
      runs-on: ubuntu-latest
      steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: serapeum-org/github-actions/actions/mkdocs-deploy@mkdocs/v1.3.0
        with:
          trigger: 'pull_request'
          package-manager: 'uv'
          package-manager-version: "0.11.29"
          install-groups: "groups: docs"
          deploy-token: ${{ secrets.ACTIONS_DEPLOY_TOKEN }}

  deploy-main:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: build-strict
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v5
      with:
        fetch-depth: 0
    - uses: serapeum-org/github-actions/actions/mkdocs-deploy@mkdocs/v1.3.0
      with:
        trigger: 'main'
        package-manager: 'uv'
        package-manager-version: "0.11.29"
        install-groups: "groups: docs"
        deploy-token: ${{ secrets.ACTIONS_DEPLOY_TOKEN }}

  deploy-release:
    if: >-
      github.event_name == 'release' ||
      (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success')
    needs: build-strict
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v5
      with:
        fetch-depth: 0
        ref: ${{ github.event.workflow_run.head_branch || github.ref }}

    - name: Extract version from pyproject.toml
      id: version
      run: |
        VERSION=$(grep -m1 '^version' pyproject.toml | sed 's/.*"\(.*\)"/\1/')
        echo "tag=$VERSION" >> $GITHUB_OUTPUT

    - uses: serapeum-org/github-actions/actions/mkdocs-deploy@mkdocs/v1.3.0
      with:
        trigger: 'release'
        package-manager: 'uv'
        package-manager-version: "0.11.29"
        install-groups: "groups: docs"
        deploy-token: ${{ secrets.ACTIONS_DEPLOY_TOKEN }}
        release-tag: ${{ github.event.release.tag_name || steps.version.outputs.tag }}
        mike-alias: 'latest'
