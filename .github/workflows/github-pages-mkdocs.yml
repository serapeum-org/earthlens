name: Deploy MkDocs

permissions:
  contents: write
  pages: write

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - '**'
  release:
      types:
        - published
  workflow_run:
    workflows: ['github-release']
    types: [completed]

# Serialise deploys to the shared `gh-pages` branch: every PR/main/release
# deploy pushes the built docs to the same branch, so overlapping runs race
# and the loser fails with `! [rejected] ... fetch first`. One global group
# (not keyed by ref) makes them queue instead of racing.
concurrency:
  group: mkdocs-gh-pages-deploy
  cancel-in-progress: false

jobs:
  # Gate every deploy on a warnings-as-errors build. The deploy action builds
  # non-strict, so a broken nav entry, a dangling anchor or a malformed
  # docstring would publish silently — this fails the run instead.
  build-strict:
    runs-on: ubuntu-latest
    # Only reads the tree; the write scopes the workflow grants are for the
    # deploy jobs, not for this one.
    permissions:
      contents: read
    steps:
    # On workflow_run the default ref is not the ref deploy-release publishes,
    # so pin to that run's head_sha — a commit, not a branch name that may
    # already have moved. Every other trigger keeps checkout's own default,
    # which for a pull_request is the merge commit rather than the fork's head.
    - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09  # v5
      with:
        fetch-depth: 0
        ref: ${{ github.event.workflow_run.head_sha || '' }}
        persist-credentials: false

    - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86  # v5
      with:
        version: "0.11.29"

    # Pin the interpreter so the gate resolves the same environment on every
    # trigger; without it the runner's default Python decides the resolution.
    - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
      with:
        python-version: "3.12"

    # --locked resolves from uv.lock instead of re-resolving, so the gate builds
    # the versions the lockfile pins and fails if it has gone stale.
    - name: Build docs with --strict
      run: uv run --locked --group docs --extra all mkdocs build --strict --site-dir /tmp/site

  deploy-pr:
      if: github.event_name == 'pull_request'
      needs: build-strict
      runs-on: ubuntu-latest
      steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: serapeum-org/github-actions/actions/mkdocs-deploy@mkdocs/v1.3.0
        with:
          trigger: 'pull_request'
          package-manager: 'uv'
          package-manager-version: "0.11.29"
          install-groups: "groups: docs"
          deploy-token: ${{ secrets.ACTIONS_DEPLOY_TOKEN }}

  deploy-main:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: build-strict
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v5
      with:
        fetch-depth: 0
    - uses: serapeum-org/github-actions/actions/mkdocs-deploy@mkdocs/v1.3.0
      with:
        trigger: 'main'
        package-manager: 'uv'
        package-manager-version: "0.11.29"
        install-groups: "groups: docs"
        deploy-token: ${{ secrets.ACTIONS_DEPLOY_TOKEN }}

  deploy-release:
    if: >-
      github.event_name == 'release' ||
      (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success')
    needs: build-strict
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v5
      with:
        fetch-depth: 0
        ref: ${{ github.event.workflow_run.head_branch || github.ref }}

    - name: Extract version from pyproject.toml
      id: version
      run: |
        VERSION=$(grep -m1 '^version' pyproject.toml | sed 's/.*"\(.*\)"/\1/')
        echo "tag=$VERSION" >> $GITHUB_OUTPUT

    - uses: serapeum-org/github-actions/actions/mkdocs-deploy@mkdocs/v1.3.0
      with:
        trigger: 'release'
        package-manager: 'uv'
        package-manager-version: "0.11.29"
        install-groups: "groups: docs"
        deploy-token: ${{ secrets.ACTIONS_DEPLOY_TOKEN }}
        release-tag: ${{ github.event.release.tag_name || steps.version.outputs.tag }}
        mike-alias: 'latest'
