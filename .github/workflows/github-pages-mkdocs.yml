name: Deploy MkDocs

permissions:
  contents: write
  pages: write

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - '**'
  release:
      types:
        - published
  workflow_run:
    workflows: ['github-release']
    types: [completed]

jobs:
  # Gate every deploy on a warnings-as-errors build. The deploy action builds
  # non-strict, so a broken nav entry, a dangling anchor or a malformed
  # docstring would publish silently — this fails the run instead.
  build-strict:
    runs-on: ubuntu-latest
    # Only reads the tree; the write scopes the workflow grants are for the
    # deploy jobs, not for this one.
    permissions:
      contents: read
    steps:
    # No explicit ref: checkout's own default is what we want on every trigger,
    # and it is the merge commit on a pull_request rather than the fork's head.
    # Naming a ref from the event payload would put fork-controlled code into
    # this job.
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        fetch-depth: 0
        persist-credentials: false

    # The same setup the deploy jobs get. mkdocs-deploy calls this action
    # internally with these inputs, so reusing it here keeps the gate and the
    # deploy on one environment; installing the toolchain by hand would let the
    # two drift and defeat the point of gating.
    - uses: serapeum-org/github-actions/actions/python-setup/uv@38c111084f99d5ff5f4a1e63bedce48fe33a10c0 # uv/v1.2.1
      with:
        python-version: "3.12"
        install-groups: "groups: docs"
        version: "0.11.29"
        verify-lock: false

    # The setup action puts .venv on GITHUB_PATH, so call mkdocs straight from
    # it. Going back through `uv run` would re-enter dependency resolution for a
    # build whose environment is already installed.
    - name: Build docs with --strict
      run: mkdocs build --strict --site-dir /tmp/site

    # A pull request builds the site but no longer publishes it (#1372): each PR
    # deploy was a full site commit on the shared `gh-pages` branch, and those
    # accounted for 85% of its 1,645 commits and ~5 GB of the repository. The
    # --strict build above is the gate, and reviewers who want to look at the
    # rendered pages download them from here instead of a published preview.
    - name: Upload the built site for review
      if: github.event_name == 'pull_request'
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      with:
        name: site-pr-${{ github.event.pull_request.number }}
        path: /tmp/site
        retention-days: 7

  # deploy-main / deploy-release run un-serialised on purpose: mkdocs-deploy retries
  # the shared gh-pages push (mike_push.sh), so each completes. Never add workflow-
  # level concurrency here - it would also evict the build-strict gate (#1150).
  deploy-main:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: build-strict
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        fetch-depth: 0
    - uses: serapeum-org/github-actions/actions/mkdocs-deploy@38c111084f99d5ff5f4a1e63bedce48fe33a10c0 # mkdocs/v1.3.1
      with:
        trigger: 'main'
        package-manager: 'uv'
        package-manager-version: "0.11.29"
        install-groups: "groups: docs"
        deploy-token: ${{ secrets.ACTIONS_DEPLOY_TOKEN }}

  deploy-release:
    # Same-repository guard: the workflow_run branch checks out the triggering
    # run's head while holding ACTIONS_DEPLOY_TOKEN, so a head from anywhere but
    # this repository must not reach the checkout.
    if: >-
      github.event_name == 'release' ||
      (github.event_name == 'workflow_run' &&
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_repository.full_name == github.repository)
    needs: build-strict
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        fetch-depth: 0
        ref: ${{ github.event.workflow_run.head_branch || github.ref }}

    - name: Extract version from pyproject.toml
      id: version
      run: |
        VERSION=$(grep -m1 '^version' pyproject.toml | sed 's/.*"\(.*\)"/\1/')
        echo "tag=$VERSION" >> $GITHUB_OUTPUT

    - uses: serapeum-org/github-actions/actions/mkdocs-deploy@38c111084f99d5ff5f4a1e63bedce48fe33a10c0 # mkdocs/v1.3.1
      with:
        trigger: 'release'
        package-manager: 'uv'
        package-manager-version: "0.11.29"
        install-groups: "groups: docs"
        deploy-token: ${{ secrets.ACTIONS_DEPLOY_TOKEN }}
        release-tag: ${{ github.event.release.tag_name || steps.version.outputs.tag }}
        mike-alias: 'latest'

    # Enforce the retention policy (#1372): keep `main` plus the release just
    # deployed, which carries the `latest` alias, and delete every other version
    # directory. This is not housekeeping - a published GitHub Pages site may be
    # no larger than 1 GB, each version directory is roughly 450 MB, and
    # retaining every release took the site to 9.7 GB, at which point Pages
    # stopped building at all and the 0.31.0 documentation was never published.
    # Without this step the site goes back over the limit within two releases.
    #
    # Auth comes from the checkout above, the same way the deploy's own pushes
    # work. mike is on PATH because mkdocs-deploy's internal python-setup/uv puts
    # the virtualenv on GITHUB_PATH for subsequent steps in this job.
    - name: Prune superseded documentation versions
      env:
        KEEP_VERSION: ${{ github.event.release.tag_name || steps.version.outputs.tag }}
      run: |
        if [ -z "$KEEP_VERSION" ]; then
          echo "::error::no release version resolved; refusing to prune"
          exit 1
        fi
        # Re-sync, recompute and retry as a unit: a concurrent main deploy moves
        # gh-pages, which makes mike's fast-forward push lose the race, and the
        # stale list computed against the old tip must not be reused.
        for attempt in 1 2 3; do
          git fetch origin gh-pages
          git branch -f gh-pages FETCH_HEAD
          stale=$(mike list | awk '{print $1}' | grep -vxF -e main -e "$KEEP_VERSION" | tr '\n' ' ')
          if [ -z "$stale" ]; then
            echo "nothing to prune; keeping main and $KEEP_VERSION"
            exit 0
          fi
          echo "keeping main and $KEEP_VERSION; deleting: $stale"
          if mike delete --push $stale; then
            exit 0
          fi
          echo "::warning::prune lost a gh-pages push race (attempt ${attempt}/3); retrying"
          sleep $(( attempt * 3 ))
        done
        echo "::error::could not prune superseded documentation versions after 3 attempts"
        exit 1
