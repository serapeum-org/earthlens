name: Wheel - Build & Test

permissions:
  contents: read

on:
  push:
    branches: [main]
  workflow_dispatch:
  workflow_call:

jobs:
  build-wheel:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up Pixi
        uses: serapeum-org/github-actions/actions/python-setup/pixi@cd02ddbe749b77cbafd08bc48c788974fc989db7 # pixi/v1
        with:
          environments: dev
          activate-environment: dev
          cache: true

      - name: Build every distribution's wheel
        # The workspace publishes seven distributions and the root one is a
        # meta-package with no modules, so building only it would produce a
        # wheel that imports nothing. Each member is built into the same dist/
        # so the install step can resolve the whole set locally.
        run: |
          set -euo pipefail
          for pkg in libs/core \
                     libs/providers/atmosphere \
                     libs/providers/ocean \
                     libs/providers/imagery \
                     libs/providers/land \
                     libs/providers/hazards \
                     . ; do
            echo "::group::build $pkg"
            pixi run -e dev python -m build --wheel --outdir dist/ "$pkg"
            echo "::endgroup::"
          done
          test "$(ls dist/*.whl | wc -l)" -eq 7 || {
            echo "::error::expected 7 wheels, got $(ls dist/*.whl | wc -l)"; exit 1; }
          ls -1 dist/*.whl

      - name: Upload wheel artifacts
        uses: actions/upload-artifact@v4
        with:
          name: wheel
          path: dist/*.whl

  test-wheel:
    needs: build-wheel
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python-version: ["3.11", "3.12", "3.13", "3.14"]

    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Download wheel artifact
        uses: actions/download-artifact@v4
        with:
          name: wheel
          path: dist/

      - name: Install Conda (Miniforge)
        uses: conda-incubator/setup-miniconda@fc2d68f6413eb2d87b895e92f8584b5b94a10167 # v3
        with:
          miniforge-version: latest
          python-version: ${{ matrix.python-version }}
          channels: conda-forge
          channel-priority: strict
          activate-environment: wheel-test

      - name: Install native GDAL dependencies
        shell: bash -el {0}
        run: |
          conda install -y -n wheel-test \
            "gdal>=3.10.0,<4" \
            "libgdal-netcdf>=3.10.0,<4" \
            "libgdal-hdf4>=3.10.0,<4"

      - name: Install wheels
        shell: bash -el {0}
        # Install the meta-package, which pulls in core and the five provider
        # distributions. `--find-links dist` resolves those siblings from the
        # wheels just built rather than from PyPI, where this version does not
        # exist yet. `[all]` then pulls every backend's optional SDK (boto3 /
        # cdsapi / earthengine-api) so the suite — which exercises every
        # backend — can import them.
        run: |
          set -euo pipefail
          META=$(ls dist/earthlens-[0-9]*.whl)
          pip install --find-links dist "${META}[all]"

      - name: Verify package import
        shell: bash -el {0}
        run: python -c "import earthlens; print(earthlens.__version__)"

      - name: Install test dependencies
        shell: bash -el {0}
        run: pip install pytest pytest-cov

      - name: Run tests against installed wheel
        shell: bash -el {0}
        # Skip e2e tests — they hit live CDS / FTP / S3 services and
        # require credentials that aren't provisioned in this workflow.
        # The dedicated tests-e2e.yml workflow runs them with secrets.
        run: pytest -vvv -sv -m "not e2e" tests/
