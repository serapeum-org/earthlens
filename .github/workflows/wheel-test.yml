name: Wheel - Build & Test

permissions:
  contents: read

on:
  push:
    branches: [main]
  workflow_dispatch:
  workflow_call:

jobs:
  build-wheel:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: serapeum-org/github-actions/actions/python-setup/uv@uv/v1.2.0
        with:
          python-version: "3.12"
          verify-lock: true
          version: "0.11.29"

      - name: Build every distribution's wheel
        # The workspace publishes seven distributions and the root one is a
        # meta-package with no modules, so building only it would produce a
        # wheel that imports nothing. `uv build --all-packages` builds every
        # workspace member into the same dist/ so the install step can resolve
        # the whole set locally.
        run: |
          set -euo pipefail
          uv build --all-packages --wheel --out-dir dist/
          test "$(ls dist/*.whl | wc -l)" -eq 7 || {
            echo "::error::expected 7 wheels, got $(ls dist/*.whl | wc -l)"; exit 1; }
          ls -1 dist/*.whl

      - name: Export the locked third-party dependency set
        # The test job installs the third-party SDKs from this file instead of
        # resolving `earthlens[all]` against PyPI at job time. Two reasons:
        # every version is the one `uv.lock` already resolved (so an upstream
        # release cannot redden an unrelated PR), and every artefact is
        # hash-verified. `--no-emit-workspace` leaves the seven earthlens
        # distributions out — those come from the wheels built above. The dev
        # group is included so pytest arrives pinned from the same file rather
        # than through a second, unpinned install.
        run: |
          set -euo pipefail
          uv export --extra all --group dev --no-emit-workspace --frozen \
            --output-file dist/requirements-wheel.txt
          test -s dist/requirements-wheel.txt
          echo "pinned $(grep -cE '^[A-Za-z0-9]' dist/requirements-wheel.txt) packages"

      - name: Upload wheel artifacts
        uses: actions/upload-artifact@v4
        with:
          name: wheel
          path: |
            dist/*.whl
            dist/requirements-wheel.txt

  test-wheel:
    needs: build-wheel
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python-version: ["3.11", "3.12", "3.13", "3.14"]

    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Download wheel artifact
        uses: actions/download-artifact@v4
        with:
          name: wheel
          path: dist/

      - name: Install Conda (Miniforge)
        uses: conda-incubator/setup-miniconda@fc2d68f6413eb2d87b895e92f8584b5b94a10167 # v3
        with:
          miniforge-version: latest
          python-version: ${{ matrix.python-version }}
          channels: conda-forge
          channel-priority: strict
          activate-environment: wheel-test

      - name: Install native GDAL dependencies
        shell: bash -el {0}
        run: |
          conda install -y -n wheel-test \
            "gdal>=3.10.0,<4" \
            "libgdal-netcdf>=3.10.0,<4" \
            "libgdal-hdf4>=3.10.0,<4"

      - name: Install wheels
        shell: bash -el {0}
        # Install every earthlens wheel by explicit file path. `--find-links
        # dist` alone is NOT enough: it adds dist/ as a source but leaves PyPI
        # enabled, so once a version has been released pip is free to download
        # that published wheel instead of the one just built — and it does.
        # This job then silently tested the previous release: main gained
        # `CADENCE_ALIASES`, `PolygonAoiWarning`, `close_quietly` and
        # `reduce_time_axis` without a version bump, and the suite failed on
        # ImportErrors for all four against the stale 0.11.0 from PyPI.
        #
        # Naming each wheel as a local file pins it beyond substitution.
        #
        # The two installs are deliberately separate. The third-party SDKs come
        # from the exported lock, so every version is hash-verified and pinned
        # to what `uv.lock` resolved rather than to whatever the index serves
        # today. The earthlens wheels then go in with `--no-index --no-deps`:
        # nothing but dist/ is reachable, so no published earthlens can be
        # substituted for a freshly built one, and their requirements are
        # already satisfied by the first install.
        run: |
          set -euo pipefail
          META=$(ls dist/earthlens-[0-9]*.whl)
          MEMBERS=$(ls dist/earthlens_*.whl)
          pip install --require-hashes -r dist/requirements-wheel.txt
          pip install --no-index --no-deps --find-links dist ${MEMBERS} "${META}"
          # Assert the installed distributions really are the ones just built,
          # not same-version wheels an index happened to serve. `direct_url.json`
          # (PEP 610) is only written for a path/URL install, and the recorded
          # URL is compared against dist/ so a local file from somewhere else
          # would not pass either.
          #
          # The six code-carrying members only: all seven distributions share
          # the `earthlens` PEP 420 namespace, so `distribution("earthlens")`
          # is ambiguous and records no direct_url even when installed by path.
          # The meta-package ships no modules, so it is the members that must
          # be local for this job to be testing the built code.
          python - <<'PY'
          import json, pathlib, sys
          from importlib.metadata import distribution

          dist_dir = pathlib.Path("dist").resolve()
          problems = []
          for name in ("earthlens-core", "earthlens-atmosphere",
                       "earthlens-hazards", "earthlens-imagery", "earthlens-land",
                       "earthlens-ocean"):
              raw = distribution(name).read_text("direct_url.json")
              if not raw:
                  problems.append(f"{name}: resolved from an index, not dist/")
                  continue
              url = json.loads(raw).get("url", "")
              if dist_dir.as_uri() not in url:
                  problems.append(f"{name}: installed from {url}, not {dist_dir}")
          for problem in problems:
              print(f"::error::{problem}")
          if problems:
              sys.exit(1)
          print(f"all 6 earthlens members installed from {dist_dir}")
          PY

      - name: Verify package import
        shell: bash -el {0}
        # earthlens is a PEP 420 namespace with no attributes; the version and
        # facade live in earthlens.core.
        run: python -c "import earthlens.core; print(earthlens.core.__version__)"

      - name: Run tests against installed wheel
        shell: bash -el {0}
        # No path argument: tests are co-located per distribution under
        # `libs/<member>/tests/`, so let the root `pyproject.toml` `testpaths`
        # (all six member roots, with `consider_namespace_packages` + the full
        # marker set) drive collection. Skip e2e tests — they hit live CDS /
        # FTP / S3 services and require credentials that aren't provisioned
        # here. The dedicated tests-e2e.yml workflow runs them with secrets.
        run: pytest -vvv -sv -m "not e2e"
