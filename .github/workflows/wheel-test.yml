name: Wheel - Build & Test

permissions:
  contents: read

on:
  push:
    branches: [main]
  workflow_dispatch:
  workflow_call:

jobs:
  build-wheel:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: serapeum-org/github-actions/actions/python-setup/uv@38c111084f99d5ff5f4a1e63bedce48fe33a10c0 # uv/v1.2.1
        with:
          python-version: "3.12"
          verify-lock: true
          version: "0.11.29"

      - name: Build every distribution's wheel
        # The workspace publishes seven distributions and the root one is a
        # meta-package with no modules, so building only it would produce a
        # wheel that imports nothing. `uv build --all-packages` builds every
        # workspace member into the same dist/ so the install step can resolve
        # the whole set locally.
        run: |
          set -euo pipefail
          uv build --all-packages --wheel --out-dir dist/
          test "$(ls dist/*.whl | wc -l)" -eq 7 || {
            echo "::error::expected 7 wheels, got $(ls dist/*.whl | wc -l)"; exit 1; }
          ls -1 dist/*.whl

      - name: Pin the third-party dependency set
        # The test job installs the SDKs from this file rather than resolving
        # them at job time, so every version is hash-verified (S8544) and an
        # upstream release cannot redden an unrelated PR.
        #
        # `uv pip compile`, not `uv export`: the workspace lock is deliberately
        # forked (argopy needs xarray>=2025.7, openeo needs <2025.1.2, declared
        # in `[tool.uv] conflicts`) and `export` emits the union of both forks
        # unmarked, which pip rejects as self-contradictory. `compile` performs
        # one ordinary resolution, so there is exactly one version per package.
        # The guard below fails the build if that ever stops being true.
        #
        # The seven earthlens distributions are excluded — they are installed
        # from the wheels built above, by path.
        run: |
          set -euo pipefail
          version=$(ls dist/earthlens-[0-9]*.whl | sed -E 's|.*/earthlens-([^-]+)-py3.*|\1|')
          printf 'earthlens[all]==%s\npytest\npytest-cov\nhypothesis\npsutil\n' "${version}" \
            > dist/requirements.in
          uv pip compile --generate-hashes --universal --python-version 3.11 \
            --find-links dist \
            --no-emit-package earthlens \
            --no-emit-package earthlens-core \
            --no-emit-package earthlens-atmosphere \
            --no-emit-package earthlens-hazards \
            --no-emit-package earthlens-imagery \
            --no-emit-package earthlens-land \
            --no-emit-package earthlens-ocean \
            dist/requirements.in -o dist/requirements-wheel.txt
          test "$(grep -c '^earthlens' dist/requirements-wheel.txt)" -eq 0 || {
            echo "::error::an earthlens distribution leaked into the pins"; exit 1; }
          # A universal resolution legitimately pins one package twice when the
          # versions are split by a marker (`numpy==2.4.6 ; python < '3.12'`).
          # A fork shows up as two pins with *no* marker, which contradict each
          # other — that is what pip rejected when this was tried with
          # `uv export`, so it is what the guard looks for.
          duplicates=$(grep -E '^[A-Za-z0-9][A-Za-z0-9._-]*==' \
            dist/requirements-wheel.txt | grep -v ';' | sed -E 's/==.*//' \
            | sort | uniq -d)
          if [ -n "${duplicates}" ]; then
            echo "::error::the resolution forked — contradictory pins for: ${duplicates}"
            exit 1
          fi
          echo "pinned $(grep -cE '^[A-Za-z0-9]' dist/requirements-wheel.txt) packages"

      - name: Upload wheel artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: wheel
          path: |
            dist/*.whl
            dist/requirements-wheel.txt

  test-wheel:
    needs: build-wheel
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python-version: ["3.11", "3.12", "3.13", "3.14"]

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Download wheel artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: wheel
          path: dist/

      - name: Install Conda (Miniforge)
        uses: conda-incubator/setup-miniconda@8ee1f361103df19b6f8c8655fd3967a8ecb162d5 # v4.0.1
        with:
          miniforge-version: latest
          python-version: ${{ matrix.python-version }}
          channels: conda-forge
          channel-priority: strict
          activate-environment: wheel-test

      - name: Install native GDAL dependencies
        shell: bash -el {0}
        run: |
          conda install -y -n wheel-test \
            "gdal>=3.10.0,<4" \
            "libgdal-netcdf>=3.10.0,<4" \
            "libgdal-hdf4>=3.10.0,<4"

      - name: Install wheels
        shell: bash -el {0}
        # Install every earthlens wheel by explicit file path. A bare
        # `--find-links dist` is NOT enough: it adds dist/ as a source but
        # leaves PyPI enabled, so once a version has been released pip is free
        # to download that published wheel instead of the one just built — and
        # it did. This job then silently tested the previous release: main
        # gained `CADENCE_ALIASES`, `PolygonAoiWarning`, `close_quietly` and
        # `reduce_time_axis` without a version bump, and the suite failed on
        # ImportErrors for all four against the stale 0.11.0 from PyPI.
        #
        # Naming each wheel as a local file pins it beyond substitution.
        #
        # Two installs. The SDKs come from the compiled pin file, so every
        # version is hash-verified. The earthlens wheels then go in from a
        # requirements file carrying each built file's own sha256, under
        # `--no-index`: dist/ is the only reachable source and every artefact
        # is verified, so pip refuses a substitution rather than the job
        # merely detecting one afterwards.
        #
        # `--only-binary :all:` keeps pip from falling back to an sdist, whose
        # build backend would run arbitrary setup code. Three packages are
        # named as exceptions and must be built: docopt and ratelimit publish
        # no wheel at all, and cartopy publishes none for 3.14 (checked across
        # every release), so the matrix's newest leg has to compile it — which
        # is what this job already did before the installs were pinned. The
        # conda step above provides the GEOS/PROJ that build needs. A fourth
        # package joining them fails this step with pip naming it.
        run: |
          set -euo pipefail
          pip install --only-binary :all: --no-binary docopt,ratelimit,cartopy \
            --require-hashes -r dist/requirements-wheel.txt
          for wheel in dist/earthlens*.whl; do
            printf '%s --hash=sha256:%s\n' \
              "./${wheel}" "$(sha256sum "${wheel}" | cut -d' ' -f1)"
          done > dist/earthlens-wheels.txt
          cat dist/earthlens-wheels.txt
          pip install --no-index --no-deps --only-binary :all: --require-hashes \
            -r dist/earthlens-wheels.txt
          # Assert the installed distributions really are the ones just built,
          # not same-version wheels an index happened to serve. `direct_url.json`
          # (PEP 610) is only written for a path/URL install, and the recorded
          # URL is compared against dist/ so a local file from somewhere else
          # would not pass either.
          #
          # The six code-carrying members only: all seven distributions share
          # the `earthlens` PEP 420 namespace, so `distribution("earthlens")`
          # is ambiguous and records no direct_url even when installed by path.
          # The meta-package ships no modules, so it is the members that must
          # be local for this job to be testing the built code.
          python - <<'PY'
          import json, pathlib, sys
          from importlib.metadata import distribution

          dist_dir = pathlib.Path("dist").resolve()
          problems = []
          for name in ("earthlens-core", "earthlens-atmosphere",
                       "earthlens-hazards", "earthlens-imagery", "earthlens-land",
                       "earthlens-ocean"):
              raw = distribution(name).read_text("direct_url.json")
              if not raw:
                  problems.append(f"{name}: resolved from an index, not dist/")
                  continue
              url = json.loads(raw).get("url", "")
              if dist_dir.as_uri() not in url:
                  problems.append(f"{name}: installed from {url}, not {dist_dir}")
          for problem in problems:
              print(f"::error::{problem}")
          if problems:
              sys.exit(1)
          print(f"all 6 earthlens members installed from {dist_dir}")
          PY

      - name: Verify package import
        shell: bash -el {0}
        # earthlens is a PEP 420 namespace with no attributes; the version and
        # facade live in earthlens.core.
        run: python -c "import earthlens.core; print(earthlens.core.__version__)"

      - name: Run tests against installed wheel
        shell: bash -el {0}
        # No path argument: tests are co-located per distribution under
        # `libs/<member>/tests/`, so let the root `pyproject.toml` `testpaths`
        # (all six member roots, with `consider_namespace_packages` + the full
        # marker set) drive collection. Skip e2e tests — they hit live CDS /
        # FTP / S3 services and require credentials that aren't provisioned
        # here. The dedicated tests-e2e.yml workflow runs them with secrets.
        run: pytest -vvv -sv -m "not e2e"
