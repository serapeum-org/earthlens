name: Tests - E2E hazards (on change)

# Run the hazards providers' LIVE end-to-end suites only when hazards files
# change in a pull request. The scheduled tests-e2e.yml still runs every suite
# weekly; this is the per-PR gate for the hazards distribution.
#
#   * detect  - diff the PR against its base and map changed paths onto the
#               hazards e2e lanes, emitting a matrix of only the affected ones.
#               A dedicated (heavy-SDK) provider gets its own lane with a narrow
#               extra; everything else in the theme is covered by one catch-all
#               lane. Shared code (core, uv.lock, a manifest, the theme's
#               private package/conftest, this workflow) or a manual dispatch
#               selects every lane.
#   * e2e     - one matrix cell per selected lane, fail-fast:false so a native
#               crash in one lane cannot cancel the others.
#
# Forks have no secrets, so the live e2e job is guarded to the main repo; each
# suite self-skips or is marker-gated when its own credentials are absent.

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  pull_request:
    paths:
      - 'libs/providers/hazards/**'
      - 'libs/core/**'
      - 'uv.lock'
      - 'pyproject.toml'
      - '.github/workflows/tests-e2e-hazards.yml'
  workflow_dispatch:

jobs:
  detect:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.select.outputs.matrix }}
    steps:
      # Full history so the PR base commit is reachable for the diff. (The e2e
      # job below uses a shallow clone - it needs no history.)
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Select affected hazards lanes
        id: select
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail

          # Dedicated (heavy-SDK) lanes: name | path-regex | marker | install-groups.
          providers=(
            "emdat|libs/providers/hazards/(src/earthlens|tests)/emdat/|e2e and emdat and not gdis|groups: dev, extras: emdat,earthdata"
          )
          catchall_marker="e2e and not emdat"
          catchall_deselect="tests/admin/test_admin_e2e.py::TestAdminLiveFetch::test_geoboundaries_country_adm1"

          theme_re='^libs/providers/hazards/'
          dedicated_re='libs/providers/hazards/(src/earthlens|tests)/(emdat)/'
          # Shared code that forces every lane to run.
          global_shared_re='^(libs/core/|uv\.lock|pyproject\.toml|\.github/workflows/tests-e2e-hazards\.yml)'
          theme_shared_re='^libs/providers/hazards/(src/earthlens/_hazards/|conftest\.py|tests/conftest\.py|pyproject\.toml)'

          run_all=0
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            echo "manual dispatch -> running every hazards lane"
            run_all=1
            changed=""
          else
            git fetch --no-tags --depth=1 origin "$BASE_SHA" || true
            changed="$(git diff --name-only "$BASE_SHA"...HEAD)"
            echo "changed files:"; echo "$changed"
            if echo "$changed" | grep -Eq "$global_shared_re" \
               || echo "$changed" | grep -Eq "$theme_shared_re"; then
              echo "shared code changed -> running every hazards lane"
              run_all=1
            fi
          fi

          includes=()
          for row in "${providers[@]}"; do
            IFS='|' read -r name path_re marker groups <<< "$row"
            if [ "$run_all" -eq 1 ] || echo "$changed" | grep -Eq "$path_re"; then
              includes+=("$(jq -cn \
                --arg name "$name" --arg marker "$marker" \
                --arg groups "$groups" --arg deselect "" \
                '{name:$name, marker:$marker, groups:$groups, deselect:$deselect}')")
            fi
          done

          # Catch-all: the rest of the theme's e2e tests. Run it on a full-run
          # trigger, or when a theme file outside the dedicated backends changed.
          include_catchall=0
          if [ "$run_all" -eq 1 ]; then
            include_catchall=1
          else
            theme_changed="$(echo "$changed" | grep -E "$theme_re" || true)"
            if [ -n "$theme_changed" ]; then
              nondedic="$(echo "$theme_changed" | grep -Ev "$dedicated_re" || true)"
              [ -n "$nondedic" ] && include_catchall=1
            fi
          fi
          if [ "$include_catchall" -eq 1 ]; then
            includes+=("$(jq -cn \
              --arg name "rest-of-hazards" --arg marker "$catchall_marker" \
              --arg groups "groups: dev, extras: all" --arg deselect "$catchall_deselect" \
              '{name:$name, marker:$marker, groups:$groups, deselect:$deselect}')")
          fi

          if [ "${#includes[@]}" -eq 0 ]; then
            matrix='[]'
          else
            matrix="$(printf '%s\n' "${includes[@]}" | jq -cs '.')"
          fi
          echo "selected matrix: $matrix"
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"

  e2e:
    needs: detect
    if: >-
      needs.detect.outputs.matrix != '[]' &&
      github.repository == 'serapeum-org/earthlens'
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.detect.outputs.matrix) }}

    name: e2e (${{ matrix.name }})

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: serapeum-org/github-actions/actions/python-setup/uv@38c111084f99d5ff5f4a1e63bedce48fe33a10c0 # uv/v1.2.1
        with:
          python-version: "3.12"
          install-groups: ${{ matrix.groups }}
          verify-lock: true
          version: "0.11.29"

      - name: Run live e2e tests for ${{ matrix.name }}
        # All service credentials are passed as env; a lane whose secret is
        # unset self-skips (or is marker-gated). Tests are scoped to this
        # theme's package so a marker cannot pull in another theme's suite.
        # Exit code 5 (no tests collected for the changed area) is treated as a
        # pass; --locked fails rather than silently re-resolving on lock drift.
        env:
          CDSAPI_URL: ${{ secrets.CDSAPI_URL }}
          CDSAPI_KEY: ${{ secrets.CDSAPI_KEY }}
          GEE_SERVICE_ACCOUNT: ${{ secrets.GEE_SERVICE_ACCOUNT }}
          GEE_SERVICE_KEY: ${{ secrets.GEE_SERVICE_KEY }}
          EARTHDATA_USERNAME: ${{ secrets.EARTHDATA_USERNAME }}
          EARTHDATA_PASSWORD: ${{ secrets.EARTHDATA_PASSWORD }}
          EARTHDATA_TOKEN: ${{ secrets.EARTHDATA_TOKEN }}
          EUMETSAT_CONSUMER_KEY: ${{ secrets.EUMETSAT_CONSUMER_KEY }}
          EUMETSAT_CONSUMER_SECRET: ${{ secrets.EUMETSAT_CONSUMER_SECRET }}
          CDSE_S3_ACCESS_KEY: ${{ secrets.CDSE_S3_ACCESS_KEY }}
          CDSE_S3_SECRET_KEY: ${{ secrets.CDSE_S3_SECRET_KEY }}
          SENTINELHUB_CLIENT_ID: ${{ secrets.SENTINELHUB_CLIENT_ID }}
          SENTINELHUB_CLIENT_SECRET: ${{ secrets.SENTINELHUB_CLIENT_SECRET }}
          IUCN_TOKEN: ${{ secrets.IUCN_TOKEN }}
          WDPA_TOKEN: ${{ secrets.WDPA_TOKEN }}
        run: |
          pkg="libs/providers/hazards"
          set +e
          if [ -n "${{ matrix.deselect }}" ]; then
            uv run --locked pytest "$pkg" -m "${{ matrix.marker }}" \
              --deselect "${{ matrix.deselect }}" -v
          else
            uv run --locked pytest "$pkg" -m "${{ matrix.marker }}" -v
          fi
          code=$?
          set -e
          if [ "$code" -eq 5 ]; then
            echo "no e2e tests collected for the changed area; treating as pass"
            exit 0
          fi
          exit "$code"
