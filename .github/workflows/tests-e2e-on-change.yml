name: Tests - E2E (per-provider on change)

# Run a provider's LIVE end-to-end suite only when that provider's files
# change in a pull request. The scheduled `tests-e2e.yml` still runs every
# suite weekly; this workflow is the fast per-PR gate so a change to one
# backend exercises that backend live without paying for all ~12 lanes.
#
# How it works:
#   * `detect` diffs the PR against its base branch and maps the changed
#     paths onto provider lanes, emitting a matrix of only the affected
#     providers. A change to shared code (core, uv.lock, pyproject, a
#     theme's private `_<theme>` package, or this workflow) selects every
#     provider. A manual dispatch also runs every provider.
#   * `e2e` runs one matrix cell per selected provider. `fail-fast: false`
#     keeps each cell isolated: a native crash in one lane (pytest runs a
#     suite in one process, so a segfault kills the process, not a test)
#     cannot cancel the others.
#
# Forks cannot read repo secrets, so the live `e2e` job is guarded to the
# main repo; each suite additionally self-skips or is marker-gated when its
# own credentials are absent.

permissions:
  contents: read

# Serialise runs on the same ref, and cancel a superseded PR run: a newer
# push to the same PR makes the in-flight live run obsolete, and these hit
# rate-limited services, so not stacking them is what you want.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  pull_request:
  workflow_dispatch:

jobs:
  detect:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.select.outputs.matrix }}
    steps:
      # Full history so the PR base commit is reachable for the diff below.
      # (The `e2e` job intentionally uses a shallow clone — it needs no
      # history, and the version is static.)
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Select affected provider lanes
        id: select
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail

          # One row per e2e lane: name | path-regex | marker | install-groups.
          # The path-regex matches the backend's source AND tests; the marker
          # and install-groups mirror the scheduled tests-e2e.yml lane so the
          # two workflows exercise the same thing.
          providers=(
            "gee|libs/providers/imagery/(src/earthlens|tests)/gee/|e2e and gee|groups: dev, extras: gee"
            "stac|libs/providers/imagery/(src/earthlens|tests)/stac/|stac and e2e|groups: dev, extras: stac"
            "sentinel_hub|libs/providers/imagery/(src/earthlens|tests)/sentinel_hub/|sentinel_hub and e2e|groups: dev, extras: sentinel-hub"
            "earthdata|libs/providers/imagery/(src/earthlens|tests)/earthdata/|e2e and earthdata|groups: dev, extras: earthdata"
            "eumetsat|libs/providers/imagery/(src/earthlens|tests)/eumetsat/|e2e and eumetsat|groups: dev, extras: eumetsat"
            "asf|libs/providers/imagery/(src/earthlens|tests)/asf/|e2e and asf|groups: dev, extras: asf,earthdata"
            "nwp|libs/providers/atmosphere/(src/earthlens|tests)/nwp/|e2e and nwp|groups: dev, extras: nwp"
            "caravan|libs/providers/ocean/(src/earthlens|tests)/caravan/|e2e and caravan|groups: dev"
            "iucn|libs/providers/land/(src/earthlens|tests)/iucn/|e2e and iucn|groups: dev"
            "wdpa|libs/providers/land/(src/earthlens|tests)/wdpa/|e2e and wdpa|groups: dev"
            "emdat|libs/providers/hazards/(src/earthlens|tests)/emdat/|e2e and emdat and not gdis|groups: dev, extras: emdat,earthdata"
          )

          # Shared code that could affect every lane: core, the lockfile,
          # the root/member manifests, a theme's private `_<theme>` package,
          # and this workflow itself.
          shared_re='^(libs/core/|uv\.lock|(libs/providers/[^/]+/)?pyproject\.toml|\.github/workflows/tests-e2e-on-change\.yml|libs/providers/[^/]+/src/earthlens/_[^/]+/)'

          run_all=0
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            echo "manual dispatch -> running every provider lane"
            run_all=1
            changed=""
          else
            git fetch --no-tags --depth=1 origin "$BASE_SHA" || true
            changed="$(git diff --name-only "$BASE_SHA"...HEAD)"
            echo "changed files:"; echo "$changed"
            if echo "$changed" | grep -Eq "$shared_re"; then
              echo "shared code changed -> running every provider lane"
              run_all=1
            fi
          fi

          includes=()
          for row in "${providers[@]}"; do
            IFS='|' read -r name path_re marker groups <<< "$row"
            if [ "$run_all" -eq 1 ] || echo "$changed" | grep -Eq "$path_re"; then
              includes+=("$(jq -cn \
                --arg name "$name" --arg marker "$marker" --arg groups "$groups" \
                '{name:$name, marker:$marker, groups:$groups}')")
            fi
          done

          if [ "${#includes[@]}" -eq 0 ]; then
            matrix='[]'
          else
            matrix="$(printf '%s\n' "${includes[@]}" | jq -cs '.')"
          fi
          echo "selected matrix: $matrix"
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"

  e2e:
    needs: detect
    # Skip entirely when nothing matched (an empty matrix is an error) and on
    # forks (no secrets to authenticate the live services).
    if: >-
      needs.detect.outputs.matrix != '[]' &&
      github.repository == 'serapeum-org/earthlens'
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.detect.outputs.matrix) }}

    name: e2e (${{ matrix.name }})

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: serapeum-org/github-actions/actions/python-setup/uv@38c111084f99d5ff5f4a1e63bedce48fe33a10c0 # uv/v1.2.1
        with:
          python-version: "3.12"
          install-groups: ${{ matrix.groups }}
          verify-lock: true
          version: "0.11.29"

      - name: Run live e2e tests for ${{ matrix.name }}
        # All service credentials are passed as env; a lane whose secret is
        # unset self-skips (or is marker-gated), so the job is harmless when a
        # secret is not configured. `--locked` fails rather than silently
        # re-resolving if uv.lock has drifted.
        env:
          CDSAPI_URL: ${{ secrets.CDSAPI_URL }}
          CDSAPI_KEY: ${{ secrets.CDSAPI_KEY }}
          GEE_SERVICE_ACCOUNT: ${{ secrets.GEE_SERVICE_ACCOUNT }}
          GEE_SERVICE_KEY: ${{ secrets.GEE_SERVICE_KEY }}
          EARTHDATA_USERNAME: ${{ secrets.EARTHDATA_USERNAME }}
          EARTHDATA_PASSWORD: ${{ secrets.EARTHDATA_PASSWORD }}
          EARTHDATA_TOKEN: ${{ secrets.EARTHDATA_TOKEN }}
          EUMETSAT_CONSUMER_KEY: ${{ secrets.EUMETSAT_CONSUMER_KEY }}
          EUMETSAT_CONSUMER_SECRET: ${{ secrets.EUMETSAT_CONSUMER_SECRET }}
          CDSE_S3_ACCESS_KEY: ${{ secrets.CDSE_S3_ACCESS_KEY }}
          CDSE_S3_SECRET_KEY: ${{ secrets.CDSE_S3_SECRET_KEY }}
          SENTINELHUB_CLIENT_ID: ${{ secrets.SENTINELHUB_CLIENT_ID }}
          SENTINELHUB_CLIENT_SECRET: ${{ secrets.SENTINELHUB_CLIENT_SECRET }}
          IUCN_TOKEN: ${{ secrets.IUCN_TOKEN }}
          WDPA_TOKEN: ${{ secrets.WDPA_TOKEN }}
        run: |
          uv run --locked pytest -m "${{ matrix.marker }}" -v
