name: Tests - E2E core (on change)

# Thin caller for libs/core's own LIVE e2e tests (the EarthLens facade + the
# NWM live download). The five per-theme workflows each run only
# `pytest libs/providers/<theme>`, so none of them exercises core — this file
# closes that gap, and tests-e2e.yml calls it with `run_all: true` as part of
# the full sweep on merge.
#
# It used to run its own `uv run --locked pytest libs/core -m e2e` with no
# `--junitxml` and no assert_tests_ran, making it the one e2e lane in the repo
# without the configuration-gap guard: core's four e2e tests could all skip for
# missing credentials and the lane still reported green — exactly the failure
# #1133 added the script to close. Delegating to the reusable workflow gives it
# the guard, the timeout and `-rs` for free, and leaves one definition of what
# an e2e lane is.
#
# Advisory, NOT a required status check: it is path-filtered, so a PR that does
# not touch core never starts it - a branch-protection "required" rule would
# wait forever. Use a separate always-running aggregator to gate on e2e.

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  pull_request:
    paths:
      - 'libs/core/**'
      - 'uv.lock'
      - 'pyproject.toml'
      - '.github/workflows/tests-e2e-core.yml'
      - '.github/workflows/tests-e2e-reusable.yml'
      # A markdown-only change (e.g. a provider README) matches libs/** above
      # but cannot affect an e2e result, so exclude it — a code+docs change
      # still matches a non-md path and runs. (paths-ignore can't combine with
      # paths, hence the ! negation.)
      - '!**/*.md'
  workflow_dispatch:
  workflow_call:
    inputs:
      run_all:
        description: "Run core's lane regardless of what changed (the merge sweep)."
        required: false
        type: boolean
        default: false

jobs:
  e2e:
    uses: ./.github/workflows/tests-e2e-reusable.yml
    with:
      theme: core
      run_all: ${{ inputs.run_all || false }}
    secrets: inherit
