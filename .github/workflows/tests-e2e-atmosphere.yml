name: Tests - E2E atmosphere (on change)

# Thin caller: trigger on atmosphere's paths and delegate to the reusable
# per-theme e2e-on-change workflow. All logic lives in tests-e2e-reusable.yml.

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  pull_request:
    paths:
      - 'libs/providers/atmosphere/**'
      - 'libs/core/**'
      - 'uv.lock'
      - 'pyproject.toml'
      - '.github/workflows/tests-e2e-atmosphere.yml'
      - '.github/workflows/tests-e2e-reusable.yml'
  workflow_dispatch:

jobs:
  e2e:
    uses: ./.github/workflows/tests-e2e-reusable.yml
    with:
      theme: atmosphere
    secrets: inherit
