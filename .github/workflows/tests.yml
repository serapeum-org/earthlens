name: Tests - Suite

permissions:
  contents: read
  id-token: write

on:
  push:
    branches: [main]
  pull_request:

jobs:
  main-package:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python-version: ["3.11", "3.12", "3.13", "3.14"]

    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: serapeum-org/github-actions/actions/python-setup/uv@uv/v1
        with:
          python-version: ${{ matrix.python-version }}
          # `extras: all` installs every backend SDK except the mutually
          # exclusive ones (argo / osm / osm-pbf are excluded from the meta
          # `all` extra and faked in their unit tests). `verify-lock` is the
          # `uv.lock` up-to-date check (the old `pixi install --locked`).
          install-groups: "groups: dev, extras: all"
          verify-lock: true

      - name: Run unit + integration suite
        run: uv run pytest -m "not e2e" --cov=libs --cov-report=xml

      - name: Upload coverage reports to Codecov with GitHub Action
        uses: codecov/codecov-action@v5
