name: Tests - Suite

permissions:
  contents: read
  id-token: write

on:
  push:
    branches: [main]
  pull_request:

jobs:
  main-package:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        environment: [py311, py312, py313, py314]

    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: serapeum-org/github-actions/actions/python-setup/pixi@pixi/v1
        with:
          environments: ${{ matrix.environment }}
          activate-environment: ${{ matrix.environment }}
          cache: true

      - name: Run ECMWF tests
        run: pixi run -e ${{ matrix.environment }} test-backend ecmwf

      - name: Run GEE tests
        run: pixi run -e ${{ matrix.environment }} test-backend gee

      - name: Run CMEMS tests
        run: pixi run -e ${{ matrix.environment }} test-backend cmems

      - name: Run FDSN tests
        run: pixi run -e ${{ matrix.environment }} test-backend fdsn

      - name: Run Earthdata tests
        run: pixi run -e ${{ matrix.environment }} test-backend earthdata

      - name: Run STAC tests
        run: pixi run -e ${{ matrix.environment }} test-backend stac

      - name: Run GDACS tests
        run: pixi run -e ${{ matrix.environment }} test-backend gdacs

      - name: Run OpenAQ tests
        run: pixi run -e ${{ matrix.environment }} test-backend openaq

      - name: Run Tropycal tests
        run: pixi run -e ${{ matrix.environment }} test-backend tropycal

      - name: Run NWP tests
        run: pixi run -e ${{ matrix.environment }} test-backend nwp

      - name: Run NEXRAD radar tests
        run: pixi run -e ${{ matrix.environment }} test-backend radar

      - name: Run USGS Water tests
        run: pixi run -e ${{ matrix.environment }} test-backend usgs_water

      - name: Run JAXA tests
        run: pixi run -e ${{ matrix.environment }} test-backend jaxa

      - name: Upload coverage reports to Codecov with GitHub Action
        uses: codecov/codecov-action@v5
