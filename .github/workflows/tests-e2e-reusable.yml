name: Tests - E2E (reusable per-theme on change)

# Reusable core for the per-theme live-e2e-on-change workflows. A thin caller
# (tests-e2e-<theme>.yml) triggers on its theme's paths and calls this with
# `theme:`; the logic below lives here once.
#
#   * detect - diff the PR against its base and map changed paths onto the
#              theme's e2e lanes, emitting a matrix of only the affected ones.
#              A dedicated (heavy-SDK) provider gets its own narrow-extra lane;
#              the rest of the theme is one catch-all lane. Shared code (core,
#              uv.lock, a manifest, the theme's private package/conftest, any
#              tests-e2e-* workflow) or a manual dispatch selects every lane.
#   * e2e    - one matrix cell per selected lane, fail-fast:false so a native
#              crash in one lane cannot cancel the others.
#
# Forks have no secrets, so the live e2e job is guarded to the main repo; each
# suite self-skips or is marker-gated when its own credentials are absent.

on:
  workflow_call:
    inputs:
      theme:
        description: "Thematic distribution: atmosphere|ocean|imagery|land|hazards."
        required: true
        type: string
      timeout_minutes:
        description: "Wall-clock cap (minutes) for each e2e matrix lane."
        required: false
        type: number
        default: 45

permissions:
  contents: read

jobs:
  detect:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      matrix: ${{ steps.select.outputs.matrix }}
    steps:
      # Full history so the PR base commit is reachable for the diff. (The e2e
      # job below uses a shallow clone - it needs no history.)
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Select affected lanes
        id: select
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          THEME: ${{ inputs.theme }}
        run: |
          set -euo pipefail

          # Per-theme lane table. Each dedicated row is a JSON object
          # (name/path/marker/groups) parsed by jq below; the catch-all runs
          # the rest of the theme. Assumption: a dedicated backend's code and
          # tests live under `(src/earthlens|tests)/<backend>/` - a flat
          # `tests/test_<backend>.py` would miss the dedicated lane's path_re.
          case "$THEME" in
          atmosphere)
            providers=(
            '{"name":"nwp","path":"libs/providers/atmosphere/(src/earthlens|tests)/nwp/","marker":"e2e and nwp","groups":"groups: dev, extras: nwp","pkg":"libs/providers/atmosphere/tests/nwp"}'
            # ECMWF/CDS gets its own lane: its live datastore requests queue
            # server-side for tens of minutes, so bundling them into the catch-all
            # made the whole atmosphere sweep overrun the lane timeout. Its tests
            # live under `tests/test_ecmwf/` (not `tests/ecmwf/`), so the path and
            # dedicated_backends spell that directory out explicitly. Uses
            # `extras: all` (the env the catch-all already ran these tests in)
            # because ECMWF spans both the `ecmwf` (cdsapi) and `ecmwf-modern`
            # (ecmwf-datastores-client) extras.
            '{"name":"ecmwf","path":"libs/providers/atmosphere/(src/earthlens/ecmwf|tests/test_ecmwf)/","marker":"e2e and ecmwf","groups":"groups: dev, extras: all","pkg":"libs/providers/atmosphere/tests/test_ecmwf"}'
            )
            catchall_marker="e2e and not nwp and not ecmwf"
            catchall_deselect=""
            dedicated_backends="nwp|ecmwf|test_ecmwf"
            ;;
          ocean)
            providers=(
            '{"name":"caravan","path":"libs/providers/ocean/(src/earthlens|tests)/caravan/","marker":"e2e and caravan","groups":"groups: dev","pkg":"libs/providers/ocean/tests/caravan"}'
            )
            catchall_marker="e2e and not caravan"
            catchall_deselect=""
            dedicated_backends="caravan"
            ;;
          imagery)
            providers=(
            '{"name":"gee","path":"libs/providers/imagery/(src/earthlens|tests)/gee/","marker":"e2e and gee","groups":"groups: dev, extras: gee,eedai","pkg":"libs/providers/imagery/tests/gee"}'
            '{"name":"stac","path":"libs/providers/imagery/(src/earthlens|tests)/stac/","marker":"stac and e2e","groups":"groups: dev, extras: stac","pkg":"libs/providers/imagery/tests/stac"}'
            '{"name":"sentinel_hub","path":"libs/providers/imagery/(src/earthlens|tests)/sentinel_hub/","marker":"sentinel_hub and e2e","groups":"groups: dev, extras: sentinel-hub","pkg":"libs/providers/imagery/tests/sentinel_hub"}'
            '{"name":"earthdata","path":"libs/providers/imagery/(src/earthlens|tests)/earthdata/","marker":"e2e and earthdata","groups":"groups: dev, extras: earthdata","pkg":"libs/providers/imagery/tests/earthdata"}'
            '{"name":"eumetsat","path":"libs/providers/imagery/(src/earthlens|tests)/eumetsat/","marker":"e2e and eumetsat","groups":"groups: dev, extras: eumetsat","pkg":"libs/providers/imagery/tests/eumetsat"}'
            '{"name":"asf","path":"libs/providers/imagery/(src/earthlens|tests)/asf/","marker":"e2e and asf","groups":"groups: dev, extras: asf","pkg":"libs/providers/imagery/tests/asf"}'
            )
            catchall_marker="e2e and not gee and not stac and not sentinel_hub and not earthdata and not eumetsat and not asf"
            catchall_deselect=""
            dedicated_backends="gee|stac|sentinel_hub|earthdata|eumetsat|asf"
            ;;
          land)
            providers=(
            '{"name":"iucn","path":"libs/providers/land/(src/earthlens|tests)/iucn/","marker":"e2e and iucn","groups":"groups: dev","pkg":"libs/providers/land/tests/iucn"}'
            '{"name":"wdpa","path":"libs/providers/land/(src/earthlens|tests)/wdpa/","marker":"e2e and wdpa","groups":"groups: dev","pkg":"libs/providers/land/tests/wdpa","allow_all_skipped":true}'
            )
            catchall_marker="e2e and not iucn and not wdpa"
            catchall_deselect=""
            dedicated_backends="iucn|wdpa"
            ;;
          hazards)
            providers=(
            '{"name":"emdat","path":"libs/providers/hazards/(src/earthlens|tests)/emdat/","marker":"e2e and emdat and not gdis","groups":"groups: dev, extras: emdat","pkg":"libs/providers/hazards/tests/emdat"}'
            '{"name":"osm","path":"libs/providers/hazards/(src/earthlens|tests)/osm/","marker":"e2e and osm","groups":"groups: dev, extras: osm","pkg":"libs/providers/hazards/tests/osm"}'
            )
            catchall_marker="e2e and not emdat and not osm and not osm_pbf"
            catchall_deselect=""
            dedicated_backends="emdat|osm"
            ;;
            *)
              echo "unknown theme: $THEME" >&2
              exit 1
              ;;
          esac

          # Only code paths gate the catch-all: a non-code change under the
          # theme (e.g. README.md) must not launch its whole live-e2e suite.
          theme_code_re="^libs/providers/$THEME/(src/earthlens|tests)/"
          dedicated_re="libs/providers/$THEME/(src/earthlens|tests)/($dedicated_backends)/"
          # Any change to core, the lockfile, a manifest, or an e2e workflow
          # file forces every lane in the theme to run.
          global_shared_re='^(libs/core/|uv\.lock|pyproject\.toml|\.github/workflows/tests-e2e-)'
          theme_shared_re="^libs/providers/$THEME/(src/earthlens/_$THEME/|tests/conftest\.py|pyproject\.toml)"

          run_all=0
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            echo "manual dispatch -> running every $THEME lane"
            run_all=1
            changed=""
          # The fetch-depth:0 checkout already has the base commit, so diff
          # directly (three-dot = changes since the merge base). If the diff
          # itself fails (e.g. an unreachable base after a force-push), fall
          # back to running every lane rather than aborting the gate.
          elif changed="$(git diff --name-only "$BASE_SHA"...HEAD 2>/dev/null)"; then
            echo "changed files:"; echo "$changed"
            if echo "$changed" | grep -Eq "$global_shared_re" \
               || echo "$changed" | grep -Eq "$theme_shared_re"; then
              echo "shared code changed -> running every $THEME lane"
              run_all=1
            fi
          else
            echo "base diff failed -> running every $THEME lane"
            run_all=1
            changed=""
          fi

          includes=()
          for row in "${providers[@]}"; do
            path_re="$(jq -r '.path' <<< "$row")"
            if [ "$run_all" -eq 1 ] || echo "$changed" | grep -Eq "$path_re"; then
              includes+=("$(jq -c '{name, marker, groups, pkg, deselect: "", allow_empty: false, allow_all_skipped: (.allow_all_skipped // false)}' <<< "$row")")
            fi
          done

          # Catch-all: the rest of the theme's e2e tests. Run it on a full-run
          # trigger, or when a theme file outside the dedicated backends changed.
          include_catchall=0
          if [ "$run_all" -eq 1 ]; then
            include_catchall=1
          else
            theme_changed="$(echo "$changed" | grep -E "$theme_code_re" || true)"
            if [ -n "$theme_changed" ]; then
              nondedic="$(echo "$theme_changed" | grep -Ev "$dedicated_re" || true)"
              [ -n "$nondedic" ] && include_catchall=1
            fi
          fi
          if [ "$include_catchall" -eq 1 ]; then
            includes+=("$(jq -cn \
              --arg name "rest-of-$THEME" --arg marker "$catchall_marker" \
              --arg groups "groups: dev, extras: all" --arg deselect "$catchall_deselect" \
              --arg pkg "libs/providers/$THEME" --argjson allow_empty true \
              '{name:$name, marker:$marker, groups:$groups, pkg:$pkg, deselect:$deselect, allow_empty:$allow_empty, allow_all_skipped:false}')")
          fi

          if [ "${#includes[@]}" -eq 0 ]; then
            matrix='[]'
          else
            matrix="$(printf '%s\n' "${includes[@]}" | jq -cs '.')"
          fi
          echo "selected matrix: $matrix"
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"

  e2e:
    needs: detect
    if: >-
      needs.detect.outputs.matrix != '[]' &&
      github.repository == 'serapeum-org/earthlens'
    runs-on: ubuntu-latest
    # A live provider host can hang (see the scheduled workflow's Dataverse
    # probe); cap the job rather than hold a runner for the 6-hour default.
    # The cap is a caller-tunable input (default 45) so a theme with slower
    # live hosts can raise it without touching the other themes.
    timeout-minutes: ${{ inputs.timeout_minutes }}

    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.detect.outputs.matrix) }}

    name: e2e (${{ matrix.name }})

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: serapeum-org/github-actions/actions/python-setup/uv@38c111084f99d5ff5f4a1e63bedce48fe33a10c0 # uv/v1.2.1
        with:
          python-version: "3.12"
          install-groups: ${{ matrix.groups }}
          verify-lock: true
          version: "0.11.29"

      - name: Run live e2e tests for ${{ matrix.name }}
        # All service credentials are passed as env; a lane whose secret is
        # unset self-skips (or is marker-gated). Tests are scoped to this
        # theme's package so a marker cannot pull in another theme's suite.
        # Exit code 5 (no tests collected for the changed area) is treated as a
        # pass; --locked fails rather than silently re-resolving on lock drift.
        # Values reach bash via env, never interpolated into the run: script.
        env:
          CDSAPI_URL: ${{ secrets.CDSAPI_URL }}
          CDSAPI_KEY: ${{ secrets.CDSAPI_KEY }}
          GEE_SERVICE_ACCOUNT: ${{ secrets.GEE_SERVICE_ACCOUNT }}
          GEE_SERVICE_KEY: ${{ secrets.GEE_SERVICE_KEY }}
          EARTHDATA_USERNAME: ${{ secrets.EARTHDATA_USERNAME }}
          EARTHDATA_PASSWORD: ${{ secrets.EARTHDATA_PASSWORD }}
          EARTHDATA_TOKEN: ${{ secrets.EARTHDATA_TOKEN }}
          EUMETSAT_CONSUMER_KEY: ${{ secrets.EUMETSAT_CONSUMER_KEY }}
          EUMETSAT_CONSUMER_SECRET: ${{ secrets.EUMETSAT_CONSUMER_SECRET }}
          CDSE_S3_ACCESS_KEY: ${{ secrets.CDSE_S3_ACCESS_KEY }}
          CDSE_S3_SECRET_KEY: ${{ secrets.CDSE_S3_SECRET_KEY }}
          SENTINELHUB_CLIENT_ID: ${{ secrets.SENTINELHUB_CLIENT_ID }}
          SENTINELHUB_CLIENT_SECRET: ${{ secrets.SENTINELHUB_CLIENT_SECRET }}
          IUCN_TOKEN: ${{ secrets.IUCN_TOKEN }}
          WDPA_TOKEN: ${{ secrets.WDPA_TOKEN }}
          COPERNICUSMARINE_SERVICE_USERNAME: ${{ secrets.COPERNICUSMARINE_SERVICE_USERNAME }}
          COPERNICUSMARINE_SERVICE_PASSWORD: ${{ secrets.COPERNICUSMARINE_SERVICE_PASSWORD }}
          API_USGS_PAT: ${{ secrets.API_USGS_PAT }}
          GPORTAL_USERNAME: ${{ secrets.GPORTAL_USERNAME }}
          GPORTAL_PASSWORD: ${{ secrets.GPORTAL_PASSWORD }}
          JAXA_PTREE_USERNAME: ${{ secrets.JAXA_PTREE_USERNAME }}
          JAXA_PTREE_PASSWORD: ${{ secrets.JAXA_PTREE_PASSWORD }}
          OPENAQ_API_KEY: ${{ secrets.OPENAQ_API_KEY }}
          FIRMS_MAP_KEY: ${{ secrets.FIRMS_MAP_KEY }}
          NREL_API_KEY: ${{ secrets.NREL_API_KEY }}
          NREL_EMAIL: ${{ secrets.NREL_EMAIL }}
          OPENEO_CLIENT_ID: ${{ secrets.OPENEO_CLIENT_ID }}
          OPENEO_CLIENT_SECRET: ${{ secrets.OPENEO_CLIENT_SECRET }}
          GFW_API_KEY: ${{ secrets.GFW_API_KEY }}
          PKG: ${{ matrix.pkg }}
          MARKER: ${{ matrix.marker }}
          DESELECT: ${{ matrix.deselect }}
          ALLOW_EMPTY: ${{ matrix.allow_empty }}
          ALLOW_ALL_SKIPPED: ${{ matrix.allow_all_skipped }}
          LANE: ${{ matrix.name }}
        run: |
          # A dedicated lane targets only its backend's test dir; collecting the
          # whole package would import sibling backends' test modules (some
          # hard-import an SDK this lane's narrow extra does not install). The
          # catch-all installs extras: all and targets the whole package.
          # -rs prints each skip's reason, so an upstream-availability skip (see
          # earthlens.testing.pytest_runtest_call) is legible in the log.
          pkg="$PKG"
          report="$RUNNER_TEMP/e2e-$LANE.xml"
          set +e
          if [ -n "$DESELECT" ]; then
            uv run --locked pytest "$pkg" -m "$MARKER" --deselect "$DESELECT" -rs -v               --junitxml="$report"
          else
            uv run --locked pytest "$pkg" -m "$MARKER" -rs -v --junitxml="$report"
          fi
          code=$?
          set -e
          # Exit code 5 = no tests collected. Legitimate only for the catch-all
          # lane (allow_empty), whose selected area may hold no e2e tests. A
          # dedicated lane is scheduled because its own backend changed, so
          # collecting nothing there means the marker drifted - fail it.
          if [ "$code" -eq 5 ] && [ "$ALLOW_EMPTY" = "true" ]; then
            echo "no e2e tests collected for the changed area; treating as pass"
            exit 0
          fi
          # A lane where every test skipped exercised nothing, yet pytest exits
          # 0 and the check goes green - the blindness that let four lanes run
          # zero tests for weeks. Fail it unless the lane is declared empty.
          if [ "$code" -eq 0 ] && [ "$ALLOW_ALL_SKIPPED" != "true" ]; then
            python .github/scripts/assert_tests_ran.py "$report" "$LANE" || exit 1
          fi
          exit "$code"
