[project]
name = "earthlens"
version = "0.6.0"
description = "remote sensing package"
readme = {file = "README.md", content-type = "text/markdown"}
authors = [
    { name = "Mostafa Farrag", email = "moah.farag@gmail.com" }
]
license = {text = "GNU General Public License v3"}
keywords = ["remote sensing", "ecmwf"]

classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: Console",
    "License :: OSI Approved :: GNU General Public License v3 (GPLv3)",
    "Natural Language :: English",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering :: GIS",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Developers",
]

requires-python = ">= 3.11, <4"

dependencies = [
    "pyramids-gis >=0.23.0",
    "geopandas >=1.0.0",
    "joblib >=1.5.0",
    "loguru >=0.7.3",
    "numpy >=2.0.0",
    "pandas >=2.0.0",
    "pydantic >=2.0",
    "pyproj >=3.7.0",
    "PyYAML >=6.0.2",
    "requests >=2.28.1",
    "shapely >=2.0.0",
    "tqdm >=4.66.0",
]

[project.optional-dependencies]
s3 = ["boto3 >=1.43.0", "botocore >=1.34.0"]
ecmwf = ["cdsapi >=0.7.7"]
gee = [
    "earthengine-api >=1.7.26",
    "google-api-python-client >=2.0",
    "google-cloud-storage >=2.0",
    "Rtree >=1.0.0",
    "urllib3 >=1.26",
]
cmems = ["copernicusmarine >=2.0.0,<3"]
fdsn = ["obspy >=1.5.0"]
earthdata = ["earthaccess >=0.18.0; python_version >= '3.12'"]
eumetsat = ["eumdac >=3.1"]
stac = ["pyramids-gis[stac]"]
# Pin openeo to the 0.47.x line: openeo 0.48+ hard-caps pandas<3, which would
# force a pandas downgrade across the whole shared environment. 0.47.0 is the
# newest openeo that runs on pandas 3 (validated live against CDSE), so the repo
# keeps pandas 3 for every backend. (openeo still caps xarray<2025.01.2.) Lift
# this upper bound once openeo ships a pandas-3-compatible release.
openeo = ["openeo >=0.47,<0.48"]
# cartopy: not imported by earthlens, but `import tropycal.tracks` chains through
# tropycal.utils.cartopy_utils (module-level `import cartopy`); tropycal omits it
# from its own deps, so earthlens must supply it or the import fails.
tropycal = ["tropycal >=1.4", "cartopy >=0.22"]
overture = ["overturemaps >=1.0.0"]
all = [
    "boto3 >=1.43.0",
    "botocore >=1.34.0",
    "cartopy >=0.22",
    "cdsapi >=0.7.7",
    "copernicusmarine >=2.0.0,<3",
    "earthengine-api >=1.7.26",
    "earthaccess >=0.18.0; python_version >= '3.12'",
    "eumdac >=3.1",
    "google-api-python-client >=2.0",
    "google-cloud-storage >=2.0",
    "obspy >=1.5.0",
    "openeo >=0.47,<0.48",
    "overturemaps >=1.0.0",
    "pyramids-gis[stac]",
    "Rtree >=1.0.0",
    "tropycal >=1.4",
    "urllib3 >=1.26",
]

[dependency-groups]
dev = [
    "nbval >=0.11.0",
    # matplotlib: example notebooks plot with it; not a runtime dep.
    "matplotlib >=3.5",
    "pre-commit >=3.7.1",
    "pre-commit-hooks >=4.6.0",
    "pytest >=8.2.2",
    "pytest-cov >=5.0.0",
    "coverage",
    "build>=1.0.0",
    "twine>=5.0.0",
    "pip",
    "jupyterlab",
    "notebook",
    "jupyter",
    "commitizen>=4.8.4",
]
docs = [
    "mkdocs >=1.5.3",
    "mkdocs-material >=9.5.3",
    "mkdocstrings >=0.24.0",
    "mkdocstrings-python >=1.7.5",
    "mike >=2.1.3",
    "mkdocs-jupyter >=0.25.1",
    "mkdocs-autorefs  >=1.2",
    "mkdocs-macros-plugin  >=1.3.7",
    "mkdocs-table-reader-plugin  >=3.1.0",
    "mkdocs-mermaid2-plugin  >=1.2.1",
    "mkdocs-panzoom-plugin",
    "jupyter-contrib-nbextensions  >=0.7.0",
    "notebook<7.0",
    # matplotlib: mkdocs-jupyter runs the notebooks at build time.
    "matplotlib >=3.5",
]

notebook = [
    "pip",
    "jupyterlab",
    "notebook",
    "jupyter",
    "ipykernel"
]

[project.urls]
homepage = "https://github.com/serapeum-org/earthlens"
repository = "https://github.com/serapeum-org/earthlens"
documentation = "https://serapeum-org.github.io/earthlens/"
Changelog = "https://github.com/serapeum-org/earthlens/blob/main/docs/change-log.md"

[build-system]
requires = ["setuptools>=80.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools]

[tool.setuptools.packages.find]
where = ["src"]
include = ["earthlens", "earthlens.*"]

[tool.setuptools.package-data]
"earthlens.chc" = ["*.yaml", "catalog/*.yaml"]
"earthlens.cmems" = ["*.yaml", "catalog/*.yaml"]
"earthlens.ecmwf" = ["*.yaml"]
"earthlens.earthdata" = ["*.yaml", "catalog/*.yaml", "catalog/*.json"]
"earthlens.eumetsat" = ["*.yaml", "catalog/*.yaml"]
"earthlens.fdsn" = ["*.yaml"]
"earthlens.gee" = ["*.yaml", "catalog/*.yaml"]
"earthlens.stac" = ["*.yaml", "catalog/*.yaml"]
"earthlens.openeo" = ["*.yaml", "catalog/*.yaml"]
"earthlens.gdacs" = ["*.yaml"]
"earthlens.openaq" = ["*.yaml"]
"earthlens.tropycal" = ["*.yaml"]
"earthlens.firms" = ["*.yaml"]
"earthlens.overture" = ["*.yaml"]

[tool.flake8]
ignore = ["E203", "E266", "E501", "W503", "E722", "C901", "E741", "E731"]
max-line-length = 88
max-complexity = 18
select = "B,C,E,F,W,T4"

[tool.black]
profile = "flake8"
line-length = 88
skip-string-normalization = true

[tool.isort]
profile = "black"
line_length = 88
multi_line_output = 3

[tool.bandit]
exclude_dirs = ["tests", "examples", "docs"]
skips = ["B101"]

[tool.coverage.run]
branch = true
source = ["src/earthlens"]

[tool.coverage.report]
show_missing = true

[tool.commitizen]
name = "cz_conventional_commits"
version_provider = "pep621"
tag_format = "$version"
changelog_file = "docs/change-log.md"
update_changelog_on_bump = true
major_version_zero = true       # while < 1.0
style = [
    ["qmark", "fg:#ff9d00 bold"],
    ["question", "bold"],
    ["answer", "fg:#ff9d00 bold"],
    ["pointer", "fg:#ff9d00 bold"],
    ["highlighted", "fg:#ff9d00 bold"],
    ["selected", "fg:#cc5454"],
    ["separator", "fg:#cc5454"],
    ["instruction", ""],
    ["text", ""],
    ["disabled", "fg:#858585 italic"]
]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "--import-mode=importlib"
markers = [
    "slow: mark test as slow.",
    "fast: mark test as fast.",
    "unit: in-process unit test, no network or filesystem outside tmp_path.",
    "integration: exercises multiple modules together with mocked I/O.",
    "e2e: end-to-end test against a live external service (e.g. CDS); select with `-m e2e`.",
    "chc: tests for the Climate Hazards Center (CHC) FTP backend (no extra SDK; covers CHIRPS / CHIRP / CHIRTS / WBGT / SPI / SPEI / CHC_CMIP6 etc.).",
    "s3: tests for the S3 backend (requires the `s3` extra: boto3).",
    "ecmwf: tests for the ECMWF/CDS backend (requires the `ecmwf` extra: cdsapi).",
    "gee: tests for the Google Earth Engine backend (requires the `gee` extra: earthengine-api).",
    "cmems: tests for the Copernicus Marine backend (requires the `cmems` extra: copernicusmarine).",
    "fdsn: tests for the FDSN seismic-event backend (requires the `fdsn` extra: obspy).",
    "earthdata: tests for the NASA Earthdata backend (requires the `earthdata` extra: earthaccess; Python >=3.12).",
    "eumetsat: tests for the EUMETSAT Data Store backend (requires the `eumetsat` extra: eumdac).",
    "stac: tests for the STAC backend (requires the `stac` extra: pyramids-gis[stac] → pystac-client + stac-asset).",
    "openeo: tests for the openEO server-side-processing backend (requires the `openeo` extra: openeo).",
    "gdacs: tests for the GDACS multi-hazard alert backend (public feed, no extra SDK).",
    "openaq: tests for the OpenAQ v3 air-quality backend (no extra SDK; uses the core `requests` dependency).",
    "tropycal: tests for the Tropycal cyclone-track backend (requires the `tropycal` extra: tropycal, cartopy).",
    "firms: tests for the NASA FIRMS active-fire backend (free MAP_KEY, no extra SDK; uses the core `requests` + `pandas` dependencies).",
    "overture: tests for the Overture Maps vector backend (requires the `overture` extra: overturemaps).",
]

[tool.pixi.workspace]
channels = ["conda-forge"]
platforms = ["win-64", "linux-64", "osx-arm64"]

# pyramids-gis Linux wheels (GDAL bundled) are manylinux_2_39; without this floor
# pixi falls back to the GDAL-less sdist. ubuntu-latest (24.04) provides glibc 2.39.
[tool.pixi.system-requirements]
libc = "2.39"

[tool.pixi.pypi-dependencies]
# Dev/test env pulls every backend's SDK (`[all]`) so the full suite runs.
earthlens = { path = ".", editable = true, extras = ["all"] }

[tool.pixi.tasks]
test-all = { cmd = "pytest -vvv --cov=src/earthlens -sv --cov-report=xml --cov-report=term-missing", description = "Run all testsuite" }
test-no-e2e = { cmd = "pytest -vvv -m 'not e2e' --cov=src/earthlens -sv --cov-report=xml --cov-report=term-missing", description = "Run unit + integration suite (skips live e2e)" }
test-e2e = { cmd = "pytest -m e2e -v", description = "Run live CDS end-to-end suite (requires CDSAPI_URL / CDSAPI_KEY)" }
test-chc = { cmd = "pytest -vvv -m 'chc and not e2e' --cov=src/earthlens --cov-report=xml --cov-report=term-missing", description = "Run CHC-backend tests (CHIRPS / CHIRP / CHIRTS / WBGT / SPI / SPEI; skips live e2e)" }
test-s3 = { cmd = "pytest -vvv -m 's3 and not e2e' --cov=src/earthlens --cov-report=xml --cov-report=term-missing", description = "Run S3-backend tests (requires the `s3` extra: boto3)" }
test-ecmwf = { cmd = "pytest -vvv -m 'ecmwf and not e2e' --cov=src/earthlens --cov-report=xml --cov-report=term-missing", description = "Run ECMWF/CDS-backend tests (requires the `ecmwf` extra: cdsapi)" }
test-gee = { cmd = "pytest -vvv -m 'gee and not e2e' --cov=src/earthlens --cov-report=xml --cov-report=term-missing", description = "Run GEE-backend tests (requires the `gee` extra: earthengine-api)" }
test-cmems = { cmd = "pytest -vvv -m 'cmems and not e2e' --cov=src/earthlens --cov-report=xml --cov-report=term-missing", description = "Run CMEMS-backend tests (requires the `cmems` extra: copernicusmarine)" }
test-fdsn = { cmd = "pytest -vvv -m 'fdsn and not e2e' --cov=src/earthlens --cov-report=xml --cov-report=term-missing", description = "Run FDSN seismic-event backend tests (requires the `fdsn` extra: obspy)" }
test-earthdata = { cmd = "pytest -vvv -m 'earthdata and not e2e' --cov=src/earthlens --cov-report=xml --cov-report=term-missing", description = "Run NASA Earthdata backend tests (requires the `earthdata` extra: earthaccess; Python >=3.12)" }
test-eumetsat = { cmd = "pytest -vvv -m 'eumetsat and not e2e' --cov=src/earthlens --cov-report=xml --cov-report=term-missing", description = "Run EUMETSAT Data Store backend tests (requires the `eumetsat` extra: eumdac)" }
test-stac = { cmd = "pytest -vvv -m 'stac and not e2e' --cov=src/earthlens --cov-report=xml --cov-report=term-missing", description = "Run STAC-backend tests (requires the `stac` extra: pyramids-gis[stac])" }
test-openeo = { cmd = "pytest -vvv -m 'openeo and not e2e' --cov=src/earthlens --cov-report=xml --cov-report=term-missing", description = "Run openEO-backend tests (requires the `openeo` extra: openeo)" }
test-gdacs = { cmd = "pytest -vvv -m 'gdacs and not e2e' --cov=src/earthlens --cov-report=xml --cov-report=term-missing", description = "Run GDACS-backend tests (public feed, no extra SDK)" }
test-openaq = { cmd = "pytest -vvv -m 'openaq and not e2e' --cov=src/earthlens --cov-report=xml --cov-report=term-missing", description = "Run OpenAQ-backend tests (no extra SDK; uses the core requests dependency)" }
test-tropycal = { cmd = "pytest -vvv -m 'tropycal and not e2e' --cov=src/earthlens --cov-report=xml --cov-report=term-missing", description = "Run Tropycal cyclone-track backend tests (requires the `tropycal` extra: tropycal, cartopy)" }
test-firms = { cmd = "pytest -vvv -m 'firms and not e2e' --cov=src/earthlens --cov-report=xml --cov-report=term-missing", description = "Run NASA FIRMS active-fire backend tests (free MAP_KEY, no extra SDK)" }
test-overture = { cmd = "pytest -vvv -m 'overture and not e2e' --cov=src/earthlens --cov-report=xml --cov-report=term-missing", description = "Run Overture Maps vector backend tests (requires the `overture` extra: overturemaps)" }
test-doctests = { cmd = "pytest --doctest-modules src/earthlens/gee src/earthlens/chc src/earthlens/ecmwf src/earthlens/cmems src/earthlens/fdsn src/earthlens/earthdata src/earthlens/eumetsat src/earthlens/stac src/earthlens/openeo src/earthlens/gdacs src/earthlens/openaq src/earthlens/tropycal src/earthlens/firms src/earthlens/overture src/earthlens/base", description = "Run docstring examples across the backend packages (catches drift in catalog / API docstrings)" }
notebooks = { cmd = "pytest --nbval --nbval-lax --verbose docs/examples", description = "check notebooks" }
jupyter = { cmd = "jupyter lab --no-browser --IdentityProvider.token='' --ServerApp.password='' --port=8889", description = "check notebooks" }
build-dist = { cmd = "python -m build", description = "Build sdist and wheel for PyPI" }
publish-pypi = { cmd = "twine upload --non-interactive --repository pypi dist/*", depends-on = ["build-dist"], description = "Build and upload package to PyPI" }
cz-changelog = { cmd = "cz changelog", description = "Generate changelog using Commitizen" }
cz-bump = { cmd = "cz bump", description = "Bump version using Commitizen" }

[tool.pixi.environments]
default = { solve-group = "default" }
dev = { features = ["dev"], solve-group = "default" }
docs = { features = ["docs"], solve-group = "docs" }
py311 = { features = ["py311", "dev"], solve-group = "py311" }
py312 = { features = ["py312", "dev"], solve-group = "py312" }
py313 = { features = ["py313", "dev"], solve-group = "py313" }
py314 = { features = ["py314", "dev"], solve-group = "py314" }
notebook = { features = ["dev", "notebook"], solve-group = "default" }

[tool.pixi.feature.py311.dependencies]
python = "3.11.*"
[tool.pixi.feature.py312.dependencies]
python = "3.12.*"
[tool.pixi.feature.py313.dependencies]
python = "3.13.*"
[tool.pixi.feature.py314.dependencies]
python = "3.14.*"
