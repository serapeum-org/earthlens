[project]
name = "earthlens"
version = "0.19.0"
description = "remote sensing package"
readme = {file = "README.md", content-type = "text/markdown"}
authors = [
    { name = "Mostafa Farrag", email = "moah.farag@gmail.com" }
]
license = "GPL-3.0-only"
keywords = ["remote sensing", "ecmwf"]

classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: Console",
    "Natural Language :: English",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering :: GIS",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Developers",
]

requires-python = ">=3.11,<4"

# The meta-package: every workspace member, no code of its own. A thematic
# distribution carries no SDK by default (they are extras), so depending on all
# five is conflict-free — the irreconcilable pins only meet if a user asks for
# two conflicting extras at once, exactly as before the split.
dependencies = [
    "earthlens-core ==0.19.0",
    "earthlens-atmosphere ==0.19.0",
    "earthlens-ocean ==0.19.0",
    "earthlens-imagery ==0.19.0",
    "earthlens-land ==0.19.0",
    "earthlens-hazards ==0.19.0",
]


[project.optional-dependencies]
argo = ["earthlens-ocean[argo]"]
asf = ["earthlens-imagery[asf]"]
cmems = ["earthlens-ocean[cmems]"]
cmip6 = ["earthlens-atmosphere[cmip6]"]
dem = ["earthlens-land[dem]"]
earthdata = ["earthlens-imagery[earthdata]"]
ecmwf = ["earthlens-atmosphere[ecmwf]"]
ecmwf-modern = ["earthlens-atmosphere[ecmwf-modern]"]
eea_aq = ["earthlens-atmosphere[eea_aq]"]
eedai = ["earthlens-imagery[eedai]"]
emdat = ["earthlens-hazards[emdat]"]
erddap = ["earthlens-ocean[erddap]"]
eumetsat = ["earthlens-imagery[eumetsat]"]
fdsn = ["earthlens-hazards[fdsn]"]
gbif = ["earthlens-land[gbif]"]
gee = ["earthlens-imagery[gee]"]
ghsl = ["earthlens-land[ghsl]"]
goes = ["earthlens-atmosphere[goes]"]
hdx = ["earthlens-hazards[hdx]"]
isimip = ["earthlens-atmosphere[isimip]"]
jaxa = ["earthlens-imagery[jaxa]"]
mswep = ["earthlens-atmosphere[mswep]"]
nwm = ["earthlens-ocean[nwm]"]
nwp = ["earthlens-atmosphere[nwp]"]
obis = ["earthlens-ocean[obis]"]
openeo = ["earthlens-imagery[openeo]"]
osm = ["earthlens-hazards[osm]"]
osm-pbf = ["earthlens-hazards[osm-pbf]"]
overture = ["earthlens-hazards[overture]"]
radar = ["earthlens-atmosphere[radar]"]
s3 = ["earthlens-atmosphere[s3]"]
sentinel-hub = ["earthlens-imagery[sentinel-hub]"]
stac = ["earthlens-imagery[stac]"]
tropycal = ["earthlens-atmosphere[tropycal]"]
usgs-water = ["earthlens-ocean[usgs-water]"]
worldpop = ["earthlens-land[worldpop]"]

# The self-referential "everything" extra: each entry re-activates one backend's
# own extra on earthlens itself. `argo` (xarray clash with openeo -- see #789)
# and `osm-pbf` (pyrosm's transitive cykhash dep is sdist-only) stay out; `osm`
# is included because openeo already pins pandas<3, so ohsome's pandas<3 no
# longer collides. `eedai` stays out deliberately: installing it flips the GEE
# backend's default `engine="auto"` onto the pyramids-eo reader, which samples
# and grids differently from Earth Engine, so it is opt-in rather than
# something `all` turns on under an existing user.
all = [
    "earthlens[asf]",
    "earthlens[cmems]",
    "earthlens[cmip6]",
    "earthlens[dem]",
    "earthlens[earthdata]",
    "earthlens[ecmwf]",
    "earthlens[ecmwf-modern]",
    "earthlens[eea_aq]",
    "earthlens[emdat]",
    "earthlens[erddap]",
    "earthlens[eumetsat]",
    "earthlens[fdsn]",
    "earthlens[gbif]",
    "earthlens[gee]",
    "earthlens[ghsl]",
    "earthlens[goes]",
    "earthlens[hdx]",
    "earthlens[isimip]",
    "earthlens[jaxa]",
    "earthlens[mswep]",
    "earthlens[nwm]",
    "earthlens[nwp]",
    "earthlens[obis]",
    "earthlens[openeo]",
    "earthlens[osm]",
    "earthlens[overture]",
    "earthlens[radar]",
    "earthlens[s3]",
    "earthlens[sentinel-hub]",
    "earthlens[stac]",
    "earthlens[tropycal]",
    "earthlens[usgs-water]",
    "earthlens[worldpop]",
]

[dependency-groups]
dev = [
    "nbval >=0.11.0",
    # psutil: the aggregator's handle-release test counts the process's open
    # files before and after a run. Deleting the input proves nothing on POSIX,
    # which permits unlinking an open file, so the descriptor is counted
    # directly instead; not a runtime dep.
    "psutil >=5.9",
    # matplotlib: example notebooks plot with it; not a runtime dep.
    "matplotlib >=3.5",
    # pyramids-gis[viz] (cleopatra): the showcase notebooks render rasters and
    # animate Dataset stacks via Dataset.plot / DatasetCollection.plot; not a
    # runtime dep of earthlens itself.
    "pyramids-gis[viz] >=0.54.0",
    # cleopatra: the showcase notebooks import it directly (ArrayGlyph,
    # animation.embed_gif, ArrayGlyph.save_animation); add_reference_map /
    # save_animation(crf=...) landed in 0.22.0, the animate() default
    # label-clipping fix in 0.23.0, the DATA_STYLES presets / dark-canvas
    # helper (style=, apply_blank_canvas) in 0.24.0+, and 0.26.0 replaces
    # animate()'s text_loc kwarg with a FrameLabel(location=, color=)
    # object (the old kwarg still works as a deprecated alias, but the
    # showcase notebooks already migrated their existing text_loc= calls,
    # and the new dark-canvas notebook uses FrameLabel's color= directly
    # rather than the also-deprecated label_color=) -- 0.30.0 completes the
    # move to grouped/typed render-parameter objects (glyphs/styling/basemap
    # subpackages), and 0.31.0 groups ArrayGlyph's loose rgb /
    # surface_reflectance / cutoff / percentile constructor keywords into an
    # RgbBands object (pyramids 0.52.0's plot path builds on this).
    # [tiles] (pyproj, xyzservices): the satellite showcase textures its globe from
    # an XYZ basemap via cleopatra.basemap.tiles, which lives behind that extra.
    # It arrives transitively through pyramids-gis[viz], but an imported package
    # is declared here rather than relied on to come in sideways.
    "cleopatra[tiles] >=0.35.0",
    "pre-commit >=3.7.1",
    "pre-commit-hooks >=4.6.0",
    # mypy: the `mypy` pre-commit hook and the lint.yml `static` job type-check src.
    "mypy >=1.11",
    "pytest >=8.2.2",
    "pytest-cov >=5.0.0",
    # hypothesis: property-based tests for the pure base helpers (resolve_aoi,
    # date_windows / split_time) and the frozen extent models. A derandomized
    # profile (libs/core/tests/base/conftest.py) keeps CI failures reproducible
    # from the log alone.
    "hypothesis >=6.100",
    "coverage",
    "build>=1.0.0",
    "twine>=5.0.0",
    "pip",
    "jupyterlab>=4.6.2",
    "notebook",
    "jupyter",
    "commitizen>=4.8.4",
    # pyramids-eo: the GEE backend's optional EEDAI reader. It is deliberately
    # out of the `all` extra (installing it activates engine="auto"), so it is
    # pulled in here instead -- otherwise the tests that pin its
    # `from_earthengine` signature would skip everywhere and a 0.x contract
    # change would only surface on a live run.
    "pyramids-eo >=0.5.0,<0.6",
]
# The eclipse showcase notebooks need a heavy geostationary-imagery stack that the
# rest of the project does not. It is kept out of `dev` deliberately: pulling satpy
# into the group every CI job syncs moves the resolved xarray/GDAL line, which broke
# the pip-audit gate and a pyramids GeoTIFF write on 3.13. These notebooks also need
# the plotting and credential tooling in `dev`, so run them with
# `uv sync --group dev --group notebooks`.
notebooks = [
    # satpy + pyresample: build the day/night true-colour composites from raw MTG FCI
    # and GOES ABI granules and resample them into the two perspective views.
    "satpy >=0.55",
    "pyresample >=1.28",
    # pyspectral: satpy's `true_color` Rayleigh correction is an optional satpy
    # dependency, so it has to be asked for by name. It downloads its own look-up
    # tables (several hundred MB) on first use.
    "pyspectral >=0.13",
    # scipy: feathers the disc edge and softens the limb (ndimage.binary_erosion /
    # gaussian_filter).
    "scipy >=1.11",
    # imageio-ffmpeg: the geometry notebook calls get_ffmpeg_exe() to encode its
    # clip; it was only ever present transitively.
    "imageio-ffmpeg >=0.5",
]
docs = [
    "mkdocs >=1.5.3",
    "mkdocs-material >=9.5.3",
    "mkdocstrings >=0.24.0",
    "mkdocstrings-python >=1.7.5",
    "mike >=2.1.3",
    "mkdocs-jupyter >=0.25.1",
    "mkdocs-autorefs >=1.2",
    "mkdocs-macros-plugin >=1.3.7",
    "mkdocs-table-reader-plugin >=3.1.0",
    "mkdocs-mermaid2-plugin >=1.2.1",
    "mkdocs-panzoom-plugin",
    # matplotlib: mkdocs-jupyter runs the notebooks at build time.
    "matplotlib >=3.5",
    # pyramids-gis[viz] (cleopatra): showcase notebooks plot/animate Datasets.
    "pyramids-gis[viz] >=0.54.0",
    # [tiles] (pyproj, xyzservices): the satellite showcase textures its globe from
    # an XYZ basemap via cleopatra.basemap.tiles, which lives behind that extra.
    # It arrives transitively through pyramids-gis[viz], but an imported package
    # is declared here rather than relied on to come in sideways.
    "cleopatra[tiles] >=0.35.0",
    # python-dotenv: showcase notebooks load credentials from a repo-root .env.
    "python-dotenv >=1.0",
    # scipy: the satellite showcase blurs the logo's drop shadow with
    # ndimage.gaussian_filter. Also in `notebooks`, for the eclipse notebooks --
    # but that group carries satpy, pyresample and pyspectral, and this notebook
    # needs none of them, so it must not be the only place these are declared.
    "scipy >=1.11",
    # imageio-ffmpeg: get_ffmpeg_exe() supplies the encoder every clip is
    # written with, so the docs build needs it to execute the notebook.
    "imageio-ffmpeg >=0.5",
]

notebook = [
    "pip",
    "jupyterlab>=4.6.2",
    "notebook",
    "jupyter",
    "ipykernel",
    "python-dotenv >=1.0",
]

[project.urls]
homepage = "https://github.com/serapeum-org/earthlens"
repository = "https://github.com/serapeum-org/earthlens"
documentation = "https://serapeum-org.github.io/earthlens/"
Changelog = "https://github.com/serapeum-org/earthlens/blob/main/docs/change-log.md"

[build-system]
requires = ["setuptools>=80.0.0"]
build-backend = "setuptools.build_meta"

# The meta-package ships no modules: every backend now lives in a thematic
# provider distribution under libs/providers/.
[tool.setuptools]
packages = []

[tool.ruff]
line-length = 88
target-version = "py311"  # requires-python floors at 3.11

[tool.ruff.format]
# black had skip-string-normalization = true → preserve existing quotes.
quote-style = "preserve"

[tool.ruff.lint]
# The *effective* flake8 rule set here was E/F/W: the old config's B/C/T4 selectors
# were inert (flake8-bugbear / flake8-print / mccabe were never installed). Add I
# (isort) and UP (pyupgrade) to fold in those two standalone hooks.
select = ["E", "F", "W", "I", "UP"]
# Mirror the old [tool.flake8].ignore. W503 is dropped — ruff does not implement it
# (a formatter-owned pycodestyle code black conflicts with), so there is nothing to
# ignore.
ignore = ["E203", "E266", "E501", "E722", "C901", "E741", "E731"]

[tool.ruff.lint.per-file-ignores]
# flake8 excluded tests/ and examples/ from linting; keep only import-sorting (I) there
# and drop E/F/W + UP to keep the migration's lint churn on shipped src/. Tests live under
# each member as libs/*/tests, so the glob is anchored with a leading **.
"**/tests/**" = ["E", "F", "W", "UP"]
"examples/**" = ["E", "F", "W", "UP"]
# Tutorial notebooks import next to first use and run setup (e.g. `%matplotlib inline`)
# before imports — both legitimately trip E402, which stays enforced for real modules.
"*.ipynb" = ["E402"]

[tool.ruff.lint.isort]
# `earthlens` is a PEP 420 namespace split across libs/*/src, so ruff's src-layout
# auto-detection classifies it as first-party inconsistently across environments
# (local vs CI), producing spurious import-group churn. Pin it explicitly.
known-first-party = ["earthlens"]

[tool.bandit]
# Non-shipped tooling and fixtures (build/CI scripts, tests, docs, planning notes):
# excluded from the security scan.
exclude_dirs = ["ci", "tests", "examples", "scripts", "planning", "docs"]
skips = ["B101"]

[tool.mypy]
# Checker target is 3.12 even though `requires-python` floors at 3.11: numpy's newer
# stubs ship PEP 695 `type` statements that mypy only parses when the target is >= 3.12
# (at 3.11 it aborts with a syntax error before checking any source). This only widens
# the *typing* target; actual 3.11 runtime compatibility is covered by the py311 leg of
# the test matrix, not by mypy. The source is a PEP 420 namespace split across the six
# workspace `src` roots, so each is a mypy base and the checked files are their
# earthlens/ subtrees.
python_version = "3.12"
namespace_packages = true
explicit_package_bases = true
mypy_path = [
    "libs/core/src",
    "libs/providers/atmosphere/src",
    "libs/providers/ocean/src",
    "libs/providers/imagery/src",
    "libs/providers/land/src",
    "libs/providers/hazards/src",
]
files = [
    "libs/core/src/earthlens",
    "libs/providers/atmosphere/src/earthlens",
    "libs/providers/ocean/src/earthlens",
    "libs/providers/imagery/src/earthlens",
    "libs/providers/land/src/earthlens",
    "libs/providers/hazards/src/earthlens",
]
warn_return_any = true
warn_unused_configs = false
disallow_untyped_defs = false
check_untyped_defs = true
ignore_missing_imports = true
exclude = [
    "tests/",
    "examples/",
    "docs/",
    "scripts/",
    "planning/",
    # `uv build` / setuptools leave a full stale copy of each distribution under
    # `libs/*/build/lib/earthlens/`. They are gitignored, so `git status` stays
    # clean and they can sit there for weeks. CI is unaffected (it runs
    # `uv run mypy` with no path, so the `files` list above applies), but a
    # developer typing `mypy libs` picks the copies up: one such run checked 568
    # files instead of 284 and reported an error from a stale module. Excluding
    # them makes the command produce the same answer either way. ruff already
    # excludes `build` by default.
    "build/",
    "dist/",
]

[tool.coverage.run]
branch = true
source = ["libs"]

[tool.coverage.report]
show_missing = true

[tool.commitizen]
name = "cz_conventional_commits"
version_provider = "pep621"
tag_format = "$version"
# changelog_file is kept above version_files: the release action reads it with a
# `grep -A 20` window from the [tool.commitizen] header, and the long version_files
# list would otherwise push it out of that window.
changelog_file = "docs/change-log.md"
# The workspace releases in lockstep: one version, one tag, one changelog for
# all seven distributions. They are split to isolate dependencies, not to
# release independently -- and since every member pins its siblings with `==`,
# independent versions would be self-contradictory. `version_provider` bumps
# this file's own `[project] version`; `version_files` carries the same bump to
# every member's version and to every `==` pin, so a release can never ship a
# provider built against a different core.
version_files = [
    "libs/core/pyproject.toml:^version = ",
    "libs/providers/atmosphere/pyproject.toml:^version = ",
    "libs/providers/ocean/pyproject.toml:^version = ",
    "libs/providers/imagery/pyproject.toml:^version = ",
    "libs/providers/land/pyproject.toml:^version = ",
    "libs/providers/hazards/pyproject.toml:^version = ",
    "pyproject.toml:earthlens-core ==",
    "pyproject.toml:earthlens-atmosphere ==",
    "pyproject.toml:earthlens-ocean ==",
    "pyproject.toml:earthlens-imagery ==",
    "pyproject.toml:earthlens-land ==",
    "pyproject.toml:earthlens-hazards ==",
    "libs/providers/atmosphere/pyproject.toml:earthlens-core ==",
    "libs/providers/ocean/pyproject.toml:earthlens-core ==",
    "libs/providers/imagery/pyproject.toml:earthlens-core ==",
    "libs/providers/land/pyproject.toml:earthlens-core ==",
    "libs/providers/hazards/pyproject.toml:earthlens-core ==",
]
update_changelog_on_bump = true
major_version_zero = true       # while < 1.0
style = [
    ["qmark", "fg:#ff9d00 bold"],
    ["question", "bold"],
    ["answer", "fg:#ff9d00 bold"],
    ["pointer", "fg:#ff9d00 bold"],
    ["highlighted", "fg:#ff9d00 bold"],
    ["selected", "fg:#cc5454"],
    ["separator", "fg:#cc5454"],
    ["instruction", ""],
    ["text", ""],
    ["disabled", "fg:#858585 italic"]
]

[tool.pytest.ini_options]
# Tests are co-located with each distribution under `libs/<member>/tests/` (#785).
testpaths = [
    "libs/core/tests",
    "libs/providers/atmosphere/tests",
    "libs/providers/hazards/tests",
    "libs/providers/imagery/tests",
    "libs/providers/land/tests",
    "libs/providers/ocean/tests",
]
consider_namespace_packages = true
addopts = "--import-mode=importlib"
markers = [
    "slow: mark test as slow.",
    "fast: mark test as fast.",
    "unit: in-process unit test, no network or filesystem outside tmp_path.",
    "integration: exercises multiple modules together with mocked I/O.",
    "e2e: end-to-end test against a live external service (e.g. CDS); select with `-m e2e`.",
    "catrare: tests for the CatRaRE DWD heavy-rainfall event-catalogue backend (opendata.dwd.de FileGDB v2026.01, CC-BY-4.0 / GeoNutzV, no extra SDK — core HttpClient + pyramids; RADKLIM-derived events reprojected from the RADOLAN grid).",
    "chc: tests for the Climate Hazards Center (CHC) FTP backend (no extra SDK; covers CHIRPS / CHIRP / CHIRTS / WBGT / SPI / SPEI / CHC_CMIP6 etc.).",
    "caravan: tests for the Caravan large-sample hydrology backend (no extra SDK; static Zenodo archives read over HTTP Range, includes the open GRDC-Caravan subset).",
    "s3: tests for the S3 backend (requires the `s3` extra: boto3).",
    "ecmwf: tests for the ECMWF/CDS backend (requires the `ecmwf` extra: cdsapi).",
    "gee: tests for the Google Earth Engine backend (requires the `gee` extra: earthengine-api).",
    "cmems: tests for the Copernicus Marine backend (requires the `cmems` extra: copernicusmarine).",
    "fdsn: tests for the FDSN seismic-event backend (requires the `fdsn` extra: obspy).",
    "earthdata: tests for the NASA Earthdata backend (requires the `earthdata` extra: earthaccess; Python >=3.12).",
    "asf: tests for the ASF InSAR backend (requires the `asf` extra: asf_search; reuses EDL auth from `earthdata`).",
    "hdx: tests for the Humanitarian Data Exchange backend (requires the `hdx` extra: hdx-python-api).",
    "eumetsat: tests for the EUMETSAT Data Store backend (requires the `eumetsat` extra: eumdac).",
    "stac: tests for the STAC backend (requires the `stac` extra: pyramids-gis[stac] → pystac-client + stac-asset).",
    "openeo: tests for the openEO server-side-processing backend (requires the `openeo` extra: openeo).",
    "sentinel_hub: tests for the Sentinel Hub server-side-render backend (requires the `sentinel-hub` extra: sentinelhub).",
    "gdacs: tests for the GDACS multi-hazard alert backend (public feed, no extra SDK).",
    "flopros: tests for the FLOPROS flood-protection-standard backend (NHESS-2016 supplement shapefile, CC-BY-3.0, no extra SDK — core HttpClient + base/archive + pyramids; subnational protection standards as return periods).",
    "hanze: tests for the HANZE historical European flood-impacts backend (public Zenodo record 20478847, CC-BY-4.0, no extra SDK — core HttpClient + pandas + pyramids).",
    "emdat: tests for the EM-DAT disaster backend (the UCLouvain Dataverse archive is anonymous and needs no extra; the GDIS sources need the `emdat` extra: earthaccess, plus an Earthdata Login).",
    "gdis: tests for the GDIS half of the EM-DAT backend (needs an Earthdata Login plus acceptance of the SEDAC data-use agreement); deselect with `-m \"not gdis\"` on a machine without credentials.",
    "openaq: tests for the OpenAQ v3 air-quality backend (no extra SDK; uses the core `requests` dependency).",
    "airnow: tests for the AirNow air-quality backend (US/Canada EPA `/aq/data/` bbox REST; no extra SDK — core `requests` + `pandas`; needs a free AIRNOW_API_KEY for live e2e).",
    "eea: tests for the EEA (`eea_aq`) air-quality backend (requires the `eea_aq` extra: airbase; European monitor observations via Parquet; public, no auth).",
    "sensor_community: tests for the Sensor.Community air-quality backend (crowdsourced low-cost sensors; no extra SDK — core `requests` + `pandas`; public archive + live JSON API, ODbL).",
    "tropycal: tests for the Tropycal cyclone-track backend (requires the `tropycal` extra: tropycal, cartopy).",
    "firms: tests for the NASA FIRMS active-fire backend (free MAP_KEY, no extra SDK; uses the core `requests` + `pandas` dependencies).",
    "flodis: tests for the FLODIS observed-flood footprints<->impacts backend (public Zenodo record 8123096, CC-BY-4.0, no extra SDK — core HttpClient + pandas; global companion to hanze, sibling of emdat).",
    "mswep: tests for the GloH2O MSWEP / MSWX backend (requires the `mswep` extra).",
    "nwm: tests for the NOAA National Water Model backend (requires the `nwm` extra: boto3; unsigned noaa-nwm-pds bucket).",
    "cmip6: tests for the CMIP6 backend (raw archive on the open Pangeo gs://cmip6 bucket; anonymous, no extra SDK; reads via pyramids).",
    "isimip: tests for the ISIMIP bias-adjusted climate-forcing backend (requires the `isimip` extra: isimip-client; facet search + server-side cutout job on the ISIMIP repository, public/no auth).",
    "overture: tests for the Overture Maps vector backend (requires the `overture` extra: overturemaps).",
    "nwp: tests for the NWP forecast backend (requires the `nwp` extra: herbie-data, ecmwf-opendata; GRIB read via pyramids' GDAL driver).",
    "radar: tests for the NEXRAD Level-II radar backend (requires the `radar` extra: boto3; unsigned unidata-nexrad-level2-chunks bucket).",
    "dem: tests for the Copernicus DEM backend (GLO-30 / GLO-90; requires the `dem` extra: boto3; anonymous copernicus-dem-30m / -90m buckets; raw COG tiles — no decode, mosaic/crop is pyramids downstream).",
    "goes: tests for the NOAA GOES-R ABI backend (requires the `goes` extra: boto3; unsigned noaa-goes19/18/16 buckets).",
    "usgs_water: tests for the USGS NWIS / Water Data backend (requires the `usgs-water` extra: dataretrieval; anonymous access works).",
    "ghsl: tests for the GHSL backend (JRC Global Human Settlement Layer; open HTTPS, no extra SDK for the direct path; localised via pyramids).",
    "worldpop: tests for the WorldPop population data hub backend (open CC-BY-4.0; default REST path needs only core requests + pyramids, optional `worldpop` extra adds worldpoppy).",
    "cli: tests for the `earthlens` console script / federated catalog-query CLI (typer and rich are core dependencies; no extra needed).",
    "biodiversity: tests for the shared biodiversity-cluster helpers (`wkt_from_bbox`, `occurrences_to_fc`, `LicenseWarning`; no extra SDK).",
    "gbif: tests for the GBIF species-occurrence backend (requires the `gbif` extra: pygbif; search is anonymous).",
    "obis: tests for the OBIS marine-occurrence backend (requires the `obis` extra: pyobis; search is anonymous).",
    "wdpa: tests for the Protected Planet (WDPA) backend (no extra SDK; direct v4 REST via core `requests`; needs a token).",
    "iucn: tests for the IUCN Red List v4 backend (no extra SDK; direct v4 REST via core `requests`; needs a Bearer token).",
    "jaxa: tests for the JAXA backend (three protocols — authless STAC/COG via jaxa.earth, credentialed SFTP via gportal, credentialed FTP via P-Tree/Himawari; the jaxa-earth and gportal branches need the `jaxa` extra, the ptree branch uses stdlib `ftplib` only).",
    "ptree: e2e-only selector for the live P-Tree Himawari HSD FTP fetch (needs $JAXA_PTREE_USERNAME + $JAXA_PTREE_PASSWORD; 30-day rolling archive; the no-network ptree unit tests carry `@pytest.mark.jaxa + @pytest.mark.unit` instead so `-m ptree` does not pick them up).",
    "argo: tests for the Argo float-profile backend (requires the `argo` extra: argopy; open data, no auth).",
    "erddap: tests for the generic ERDDAP backend (requires the `erddap` extra: erddapy; griddap raster via direct .nc download + pyramids, tabledap tabular via to_pandas; public servers only).",
    "bathymetry: tests for the bathymetry DEM backend (GEBCO 2020 + ETOPO1 ice/bedrock via NOAA ERDDAP griddap; EMODnet Bathymetry European DTM via OGC WCS; no extra SDK — core requests + pyramids).",
    "fabdem: tests for the FABDEM V1-2 bare-earth DEM backend (Forest And Buildings removed Copernicus DEM, ~30m; open HTTPS from the University of Bristol, no extra SDK — core requests + pyramids; CC-BY-NC-SA 4.0 non-commercial).",
    "jrc_flood: tests for the JRC European Flood Hazard Map backend (river-flood water depth per return period, Europe + Mediterranean; open HTTPS from the JRC, no extra SDK — core requests + pyramids `/vsicurl` windowed reads; CC-BY 4.0).",
    "solar_wind_atlas: tests for the Solar & Wind Atlas backend (Global Solar Atlas + Global Wind Atlas climatology layers; no extra SDK — core requests + pyramids; GWA windowed /vsicurl COG read, GSA download-then-localise).",
    "pvgis: tests for the JRC PVGIS solar-radiation / PV time-series backend (keyless REST via core `requests` + `pandas`; no extra SDK).",
    "climate_indices: tests for the climate / teleconnection index backend (NOAA PSL + KNMI Climate Explorer monthly ASCII series; no extra SDK — core requests + pandas).",
    "nrel: tests for the NREL NSRDB / WIND Toolkit solar-wind time-series backend (keyed REST CSV via core `requests` + `pandas`; no extra SDK; required api_key + email auth).",
    "risk_indicators: tests for the risk-indicators backend (GFDRR ThinkHazard! + INFORM Risk + Global Forest Watch; no extra SDK — core requests + pandas + pyramids; GFW datasets need GFW_API_KEY, ThinkHazard/INFORM are public).",
    "nsi: tests for the NSI US flood exposure/loss backend (USACE National Structure Inventory + FEMA NFHL flood zones + FEMA NFIP claims v3; no extra SDK — core requests + pandas + pyramids; per-instance OUTPUT_KIND; all three keyless US public domain).",
    "glaciers: tests for the glaciers backend (RGI 7.0 per-region outlines via IHP-WINS + GLIMS WFS time-series outlines + WGMS Fluctuations of Glaciers tabular; no extra SDK — core requests + pandas + pyramids; mixed per-instance OUTPUT_KIND; all sources open, no auth).",
    "osm: tests for the OpenStreetMap backend (requires the `osm` extra: overpy + ohsome; two public keyless protocols — Overpass current-state via overpy, OSM history via ohsome; the non-e2e suite fakes both SDKs).",
    "osm_pbf: tests for the OpenStreetMap `pbf` protocol (bulk Geofabrik `.osm.pbf` reads; requires the `osm-pbf` extra: pyrosm + osmium/pyosmium; the non-e2e suite fakes the reader + HttpClient, the gated e2e downloads a small extract).",
    "admin: tests for the administrative-boundaries backend (geoBoundaries + CGAZ + Natural Earth + US Census TIGER/Line; no extra SDK — core requests + pyramids; all four public, GADM omitted for license).",
    "soilgrids: tests for the SoilGrids backend (ISRIC SoilGrids 2.0 soil properties via OGC WCS at maps.isric.org; no extra SDK — core requests + pyramids' Dataset.from_wcs; all public, CC-BY 4.0, no auth).",
    "drought: tests for the drought backend (US Drought Monitor / Copernicus EDO+GDO / CSIC SPEIbase; no extra SDK — core `requests` + pyramids; EDO/GDO fetched via the Copernicus GetCoverage REST endpoint, SPEIbase via direct NetCDF).",
]

# uv workspace. Each member (libs/core, libs/providers/*) is an independently
# lockable uv project; this root is the workspace root and the "install
# everything" meta-package. `[tool.uv.sources]` resolves the sibling
# distributions from the local workspace instead of PyPI, so the whole repo
# develops editable from one place while each member can also be locked and
# built on its own (its own uv.lock).
[tool.uv]
# Some backend SDKs cannot coexist in one resolution, so the universal lock is
# told to fork rather than fail:
#   * argopy (earthlens-ocean[argo]) needs xarray>=2025.7 while openeo
#     (earthlens-imagery[openeo]) needs xarray<2025.1.2 — no version satisfies
#     both. Declaring the extras conflicting makes uv resolve them in separate
#     forks of uv.lock instead of trying to install both at once.
conflicts = [
    # argopy (earthlens-ocean[argo]) needs xarray>=2025.7; openeo
    # (earthlens-imagery[openeo]) needs xarray<2025.1.2 -- no version satisfies
    # both. Declaring the two leaf extras conflicting makes uv fork the
    # universal lock instead of failing, and (with no member-level `all` extra
    # to collide) `uv sync --extra <x>` stays unambiguous.
    [
        { package = "earthlens-ocean", extra = "argo" },
        { package = "earthlens-imagery", extra = "openeo" },
    ],
]

[tool.uv.workspace]
members = [
    "libs/core",
    "libs/providers/*",
]

[tool.uv.sources]
earthlens-core = { workspace = true }
earthlens-atmosphere = { workspace = true }
earthlens-ocean = { workspace = true }
earthlens-imagery = { workspace = true }
earthlens-land = { workspace = true }
earthlens-hazards = { workspace = true }
