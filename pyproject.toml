[project]
name = "earthlens"
version = "0.9.0"
description = "remote sensing package"
readme = {file = "README.md", content-type = "text/markdown"}
authors = [
    { name = "Mostafa Farrag", email = "moah.farag@gmail.com" }
]
license = "GPL-3.0-only"
keywords = ["remote sensing", "ecmwf"]

classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: Console",
    "Natural Language :: English",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering :: GIS",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Developers",
]

requires-python = ">=3.11,<4"

dependencies = [
    "pyramids-gis >=0.38.0",
    "geopandas >=1.0.0",
    "joblib >=1.5.0",
    "loguru >=0.7.3",
    "numpy >=2.0.0",
    "pandas >=2.0.0",
    "platformdirs >=3.0.0",
    "pydantic >=2.0",
    "pyproj >=3.7.0",
    "PyYAML >=6.0.2",
    "requests >=2.28.1",
    "shapely >=2.0.0",
    "tqdm >=4.66.0",
    "typer >=0.12",
    "rich >=13",
]

[project.scripts]
earthlens = "earthlens.cli:app"

[project.optional-dependencies]
s3 = ["boto3 >=1.43.0", "botocore >=1.34.0"]
ecmwf = ["cdsapi >=0.7.7"]
ecmwf-modern = ["ecmwf-datastores-client >=0.5.1"]
gee = [
    "earthengine-api >=1.7.26",
    "google-api-python-client >=2.0",
    "google-cloud-storage >=2.0",
    "Rtree >=1.0.0",
    "urllib3 >=1.26",
]
cmems = ["copernicusmarine >=2.0.0,<3"]
fdsn = ["obspy >=1.5.0"]
# NOAA National Water Model (unsigned noaa-nwm-pds bucket). The NWM backend
# reads Zarr / feature_id NetCDF subsets through pyramids' LabeledDataset (now a
# GDAL multidimensional reader — no xarray/dask, serapeum-org/pyramids#520) and
# NetCDF.subset; earthlens never imports xarray/zarr itself (pyramids owns the
# read). Only `[parquet]` is needed, and only for LabeledDataset.to_parquet.
nwm = [
    "earthlens[s3]",
    "pyramids-gis[parquet] >=0.38.0",
]
earthdata = ["earthaccess >=0.18.0; python_version >= '3.12'"]
# ASF InSAR backend reuses the EDL token already minted by `[earthdata]`, so
# the asf extra pulls earthdata transitively rather than re-declaring its deps.
asf = ["asf_search >=12.2.2", "earthlens[earthdata]"]
hdx = ["hdx-python-api >=6,<7"]
eumetsat = ["eumdac >=3.1"]
# herbie/cfgrib decode GRIB through the ecCodes C library. On Linux/macOS the
# pip `eccodes` binding pulls the binary via `eccodeslib`; that package has no
# Windows build, so on Windows `ecmwflibs` (ECMWF's binary bundle) supplies the
# `eccodes.dll`, wired up by `earthlens.nwp._eccodes.ensure_eccodes()`. (Conda
# envs get the binary from the `eccodes` conda package below; the shim no-ops.)
nwp = [
    "herbie-data >=2026.3",
    "ecmwf-opendata >=0.3",
    "ecmwflibs; sys_platform == 'win32'",
]
radar = ["earthlens[s3]"]
stac = ["pyramids-gis[stac] >=0.38.0"]
openeo = ["openeo >=0.47,<0.48"]
sentinel-hub = ["sentinelhub >=3.11.5"]
# cartopy: not imported by earthlens, but `import tropycal.tracks` chains through
# tropycal.utils.cartopy_utils (module-level `import cartopy`); tropycal omits it
# from its own deps, so earthlens must supply it or the import fails.
tropycal = ["tropycal >=1.4", "cartopy >=0.22"]
overture = ["overturemaps >=1.0.0", "duckdb >=1.0.0"]
usgs-water = ["dataretrieval >=1.1.4"]
ghsl = []
worldpop = ["worldpoppy >=0.4", "py7zr >=0.20"]
gbif = ["pygbif >=0.6.6"]
obis = ["pyobis >=1.6.1"]
# JAXA backend — two protocols, both SDKs are optional:
#   * jaxa.earth: the official authless STAC + COG API. Pin tight on the
#     prototype 0.x line (the SDK has no public source repo; behaviour
#     pinning is by snapshot tests against the installed wheel).
#   * gportal: community SFTP client for the G-Portal mission archive
#     (single-maintainer, last release 2023-05; do NOT pull its [gcomc]
#     extra — it pins numpy<2 which conflicts with this repo's numpy 2.x).
jaxa = [
    "jaxa.earth >=0.1.6,<0.2",
    "gportal >=0.4,<0.5",
]
# Argo float profiles via the argopy SDK (EUPL-1.2). argopy depends on xarray
# internally; earthlens only ever touches its pandas accessor (.to_dataframe()),
# so earthlens itself never imports xarray.
#
# Deliberately NOT in `all`: argopy 1.4 pins `xarray>=2025.7,<=2025.9.0`, while
# openeo 0.47 (in `all`) pins `xarray<2025.1.2` — the two are mutually
# unsatisfiable, so a single environment cannot hold both. The non-e2e argo
# tests fake the SDK (monkeypatched `sys.modules`), so they run in the `all`
# dev/test env without argopy; the gated live e2e needs `pip install
# earthlens[argo]` in an argopy-capable (openeo-free) environment.
argo = ["argopy >=1.4"]
# Generic ERDDAP client (IOOS erddapy, BSD-3). Used only on the tabledap
# to_pandas() path; the griddap path builds the OPeNDAP .nc URL directly and
# downloads it with core `requests`, then reads it back via pyramids — earthlens
# never imports xarray. Floor pinned from the A1 gate (erddapy 3.2.1 verified).
erddap = ["erddapy >=3.0"]
# OpenStreetMap features over two public, keyless protocols: overpy (Overpass,
# current-state) + ohsome (OSM history/analytics). Both imported lazily — the
# package imports without [osm]. Floors pinned from the A1 gate (overpy 0.7 /
# ohsome 0.4.0 verified).
#
# Deliberately NOT in `all`: ohsome 0.4.0 pins `pandas<3.0.0` (and
# `geopandas<2.0.0`), while the locked `all` env runs `pandas 3.0.3` — adding
# ohsome would force a pandas downgrade across the whole dev/test/CI solve. The
# non-e2e osm tests fake both SDKs (monkeypatched `sys.modules`), so they run in
# the `all` dev/test env without overpy/ohsome installed; the gated live e2e
# needs `pip install earthlens[osm]` in a (pandas<3) osm-capable environment.
# (Same policy as the `argo` extra above.)
osm = ["overpy >=0.7", "ohsome >=0.4.0"]
# Self-referential: the union of every backend extra, without re-listing deps.
# (argo and osm are intentionally excluded — see the notes above their extras.)
all = [
    "earthlens[s3,ecmwf,ecmwf-modern,gee,cmems,fdsn,earthdata,asf,hdx,eumetsat,nwp,nwm,radar,stac,openeo,sentinel-hub,tropycal,overture,usgs-water,ghsl,worldpop,gbif,obis,jaxa,erddap]",
]

[dependency-groups]
dev = [
    "nbval >=0.11.0",
    # matplotlib: example notebooks plot with it; not a runtime dep.
    "matplotlib >=3.5",
    # pyramids-gis[viz] (cleopatra): the showcase notebooks render rasters and
    # animate Dataset stacks via Dataset.plot / DatasetCollection.plot; not a
    # runtime dep of earthlens itself.
    "pyramids-gis[viz] >=0.38.0",
    # cleopatra: the showcase notebooks import it directly (ArrayGlyph,
    # animation.embed_gif, ArrayGlyph.save_animation); >=0.18.0 for that
    # RGB-frame animation embed/save API.
    "cleopatra >=0.18.0",
    "pre-commit >=3.7.1",
    "pre-commit-hooks >=4.6.0",
    "pytest >=8.2.2",
    "pytest-cov >=5.0.0",
    "coverage",
    "build>=1.0.0",
    "twine>=5.0.0",
    "pip",
    "jupyterlab",
    "notebook",
    "jupyter",
    "commitizen>=4.8.4",
]
docs = [
    "mkdocs >=1.5.3",
    "mkdocs-material >=9.5.3",
    "mkdocstrings >=0.24.0",
    "mkdocstrings-python >=1.7.5",
    "mike >=2.1.3",
    "mkdocs-jupyter >=0.25.1",
    "mkdocs-autorefs >=1.2",
    "mkdocs-macros-plugin >=1.3.7",
    "mkdocs-table-reader-plugin >=3.1.0",
    "mkdocs-mermaid2-plugin >=1.2.1",
    "mkdocs-panzoom-plugin",
    # matplotlib: mkdocs-jupyter runs the notebooks at build time.
    "matplotlib >=3.5",
    # pyramids-gis[viz] (cleopatra): showcase notebooks plot/animate Datasets.
    "pyramids-gis[viz] >=0.38.0",
    # cleopatra: notebooks import it directly; >=0.18.0 for the RGB-frame
    # animation embed_gif / save_animation API used by the showcase GIFs.
    "cleopatra >=0.18.0",
    # python-dotenv: showcase notebooks load credentials from a repo-root .env.
    "python-dotenv >=1.0",
]

notebook = [
    "pip",
    "jupyterlab",
    "notebook",
    "jupyter",
    "ipykernel",
    "python-dotenv >=1.0",
]

[project.urls]
homepage = "https://github.com/serapeum-org/earthlens"
repository = "https://github.com/serapeum-org/earthlens"
documentation = "https://serapeum-org.github.io/earthlens/"
Changelog = "https://github.com/serapeum-org/earthlens/blob/main/docs/change-log.md"

[build-system]
requires = ["setuptools>=80.0.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
include = ["earthlens", "earthlens.*"]

# Every backend ships its catalog YAML(s); the "*" key applies to all
# subpackages, with per-package additions for non-YAML catalog artefacts.
[tool.setuptools.package-data]
"*" = ["*.yaml", "catalog/*.yaml"]
"earthlens.earthdata" = ["catalog/*.json"]
"earthlens.hdx" = ["catalog/*.json", "catalog/*.json.gz"]
"earthlens.sentinel_hub" = ["evalscripts/*.js"]
# GHSL ships the 18x36 Mollweide tile-grid index (the JRC land tile schema,
# converted to GeoJSON) alongside its catalog.
"earthlens.ghsl" = ["*.geojson"]

[tool.setuptools.exclude-package-data]
# Ship only the curated catalog; the informational available_parameters.yaml
# (~1.5 MB, ~19.7k codes) is a repo/tooling + docs artefact that nothing loads
# at runtime (the Catalog reads only the curated file; raw codes pass through
# variables= without it), so it is deliberately excluded from the wheel.
"earthlens.usgs_water" = ["available_parameters.yaml"]

[tool.flake8]
ignore = ["E203", "E266", "E501", "W503", "E722", "C901", "E741", "E731"]
max-line-length = 88
max-complexity = 18
select = "B,C,E,F,W,T4"

[tool.black]
line-length = 88
skip-string-normalization = true

[tool.isort]
profile = "black"
line_length = 88
multi_line_output = 3

[tool.bandit]
exclude_dirs = ["tests", "examples", "docs"]
skips = ["B101"]

[tool.coverage.run]
branch = true
source = ["src/earthlens"]

[tool.coverage.report]
show_missing = true

[tool.commitizen]
name = "cz_conventional_commits"
version_provider = "pep621"
tag_format = "$version"
changelog_file = "docs/change-log.md"
update_changelog_on_bump = true
major_version_zero = true       # while < 1.0
style = [
    ["qmark", "fg:#ff9d00 bold"],
    ["question", "bold"],
    ["answer", "fg:#ff9d00 bold"],
    ["pointer", "fg:#ff9d00 bold"],
    ["highlighted", "fg:#ff9d00 bold"],
    ["selected", "fg:#cc5454"],
    ["separator", "fg:#cc5454"],
    ["instruction", ""],
    ["text", ""],
    ["disabled", "fg:#858585 italic"]
]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "--import-mode=importlib"
markers = [
    "slow: mark test as slow.",
    "fast: mark test as fast.",
    "unit: in-process unit test, no network or filesystem outside tmp_path.",
    "integration: exercises multiple modules together with mocked I/O.",
    "e2e: end-to-end test against a live external service (e.g. CDS); select with `-m e2e`.",
    "chc: tests for the Climate Hazards Center (CHC) FTP backend (no extra SDK; covers CHIRPS / CHIRP / CHIRTS / WBGT / SPI / SPEI / CHC_CMIP6 etc.).",
    "s3: tests for the S3 backend (requires the `s3` extra: boto3).",
    "ecmwf: tests for the ECMWF/CDS backend (requires the `ecmwf` extra: cdsapi).",
    "gee: tests for the Google Earth Engine backend (requires the `gee` extra: earthengine-api).",
    "cmems: tests for the Copernicus Marine backend (requires the `cmems` extra: copernicusmarine).",
    "fdsn: tests for the FDSN seismic-event backend (requires the `fdsn` extra: obspy).",
    "earthdata: tests for the NASA Earthdata backend (requires the `earthdata` extra: earthaccess; Python >=3.12).",
    "asf: tests for the ASF InSAR backend (requires the `asf` extra: asf_search; reuses EDL auth from `earthdata`).",
    "hdx: tests for the Humanitarian Data Exchange backend (requires the `hdx` extra: hdx-python-api).",
    "eumetsat: tests for the EUMETSAT Data Store backend (requires the `eumetsat` extra: eumdac).",
    "stac: tests for the STAC backend (requires the `stac` extra: pyramids-gis[stac] → pystac-client + stac-asset).",
    "openeo: tests for the openEO server-side-processing backend (requires the `openeo` extra: openeo).",
    "sentinel_hub: tests for the Sentinel Hub server-side-render backend (requires the `sentinel-hub` extra: sentinelhub).",
    "gdacs: tests for the GDACS multi-hazard alert backend (public feed, no extra SDK).",
    "openaq: tests for the OpenAQ v3 air-quality backend (no extra SDK; uses the core `requests` dependency).",
    "tropycal: tests for the Tropycal cyclone-track backend (requires the `tropycal` extra: tropycal, cartopy).",
    "firms: tests for the NASA FIRMS active-fire backend (free MAP_KEY, no extra SDK; uses the core `requests` + `pandas` dependencies).",
    "nwm: tests for the NOAA National Water Model backend (requires the `nwm` extra: boto3; unsigned noaa-nwm-pds bucket).",
    "overture: tests for the Overture Maps vector backend (requires the `overture` extra: overturemaps).",
    "nwp: tests for the NWP forecast backend (requires the `nwp` extra: herbie-data, ecmwf-opendata; GRIB read via pyramids' GDAL driver).",
    "radar: tests for the NEXRAD Level-II radar backend (requires the `radar` extra: boto3; unsigned unidata-nexrad-level2-chunks bucket).",
    "usgs_water: tests for the USGS NWIS / Water Data backend (requires the `usgs-water` extra: dataretrieval; anonymous access works).",
    "ghsl: tests for the GHSL backend (JRC Global Human Settlement Layer; open HTTPS, no extra SDK for the direct path; localised via pyramids).",
    "worldpop: tests for the WorldPop population data hub backend (open CC-BY-4.0; default REST path needs only core requests + pyramids, optional `worldpop` extra adds worldpoppy).",
    "cli: tests for the `earthlens` console script / federated catalog-query CLI (typer and rich are core dependencies; no extra needed).",
    "biodiversity: tests for the shared biodiversity-cluster helpers (`wkt_from_bbox`, `occurrences_to_fc`, `LicenseWarning`; no extra SDK).",
    "gbif: tests for the GBIF species-occurrence backend (requires the `gbif` extra: pygbif; search is anonymous).",
    "obis: tests for the OBIS marine-occurrence backend (requires the `obis` extra: pyobis; search is anonymous).",
    "wdpa: tests for the Protected Planet (WDPA) backend (no extra SDK; direct v4 REST via core `requests`; needs a token).",
    "iucn: tests for the IUCN Red List v4 backend (no extra SDK; direct v4 REST via core `requests`; needs a Bearer token).",
    "jaxa: tests for the JAXA backend (requires the `jaxa` extra: jaxa.earth + gportal; two protocols — authless STAC/COG via jaxa.earth, credentialed SFTP via gportal).",
    "argo: tests for the Argo float-profile backend (requires the `argo` extra: argopy; open data, no auth).",
    "erddap: tests for the generic ERDDAP backend (requires the `erddap` extra: erddapy; griddap raster via direct .nc download + pyramids, tabledap tabular via to_pandas; public servers only).",
    "bathymetry: tests for the bathymetry DEM backend (GEBCO 2020 + ETOPO1 ice/bedrock via NOAA ERDDAP griddap; no extra SDK — core requests + pyramids).",
    "solar_wind_atlas: tests for the Solar & Wind Atlas backend (Global Solar Atlas + Global Wind Atlas climatology layers; no extra SDK — core requests + pyramids; GWA windowed /vsicurl COG read, GSA download-then-localise).",
    "pvgis: tests for the JRC PVGIS solar-radiation / PV time-series backend (keyless REST via core `requests` + `pandas`; no extra SDK).",
    "climate_indices: tests for the climate / teleconnection index backend (NOAA PSL + KNMI Climate Explorer monthly ASCII series; no extra SDK — core requests + pandas).",
    "nrel: tests for the NREL NSRDB / WIND Toolkit solar-wind time-series backend (keyed REST CSV via core `requests` + `pandas`; no extra SDK; required api_key + email auth).",
    "risk_indicators: tests for the risk-indicators backend (GFDRR ThinkHazard! + INFORM Risk + Global Forest Watch; no extra SDK — core requests + pandas + pyramids; GFW datasets need GFW_API_KEY, ThinkHazard/INFORM are public).",
    "glaciers: tests for the glaciers backend (RGI 7.0 per-region outlines via IHP-WINS + GLIMS WFS time-series outlines + WGMS Fluctuations of Glaciers tabular; no extra SDK — core requests + pandas + pyramids; mixed per-instance OUTPUT_KIND; all sources open, no auth).",
    "osm: tests for the OpenStreetMap backend (requires the `osm` extra: overpy + ohsome; two public keyless protocols — Overpass current-state via overpy, OSM history via ohsome; the non-e2e suite fakes both SDKs).",
    "admin: tests for the administrative-boundaries backend (geoBoundaries + CGAZ + Natural Earth + US Census TIGER/Line; no extra SDK — core requests + pyramids; all four public, GADM omitted for license).",
    "soilgrids: tests for the SoilGrids backend (ISRIC SoilGrids 2.0 soil properties via OGC WCS at maps.isric.org; no extra SDK — core requests + pyramids' Dataset.from_wcs; all public, CC-BY 4.0, no auth).",
    "drought: tests for the drought backend (US Drought Monitor / Copernicus EDO+GDO / CSIC SPEIbase; no extra SDK — core `requests` + pyramids; EDO/GDO fetched via the Copernicus GetCoverage REST endpoint, SPEIbase via direct NetCDF).",
]

[tool.pixi.workspace]
channels = ["conda-forge"]
platforms = ["win-64", "linux-64", "osx-arm64"]

# pyramids-gis Linux wheels (GDAL bundled) are manylinux_2_39; without this floor
# pixi falls back to the GDAL-less sdist. ubuntu-latest (24.04) provides glibc 2.39.
[tool.pixi.system-requirements]
libc = "2.39"
# ecmwflibs (the Windows GRIB binary for the nwp extra) only ships an
# osx-arm64 wheel tagged macosx_15; pixi defaults osx-arm64 to macOS 13, so
# without this floor the multi-platform lock cannot place it. Raising the
# target to 15 matches that wheel; every other package's older-macOS wheels
# stay valid (a lower macOS floor is always compatible with a higher target).
macos = "15.0"

[tool.pixi.pypi-dependencies]
# Dev/test env pulls every backend's SDK (`[all]`) so the full suite runs.
earthlens = { path = ".", editable = true, extras = ["all"] }

[tool.pixi.tasks]
test-all = { cmd = "pytest -vvv --cov=src/earthlens -sv --cov-report=xml --cov-report=term-missing", description = "Run all testsuite" }
test-no-e2e = { cmd = "pytest -vvv -m 'not e2e' --cov=src/earthlens -sv --cov-report=xml --cov-report=term-missing", description = "Run unit + integration suite (skips live e2e)" }
test-e2e = { cmd = "pytest -m e2e -v", description = "Run live CDS end-to-end suite (requires CDSAPI_URL / CDSAPI_KEY)" }
# One task for every per-backend suite: `pixi run test-backend <marker>` (e.g.
# `pixi run test-backend gee`). The markers (and which extra each backend
# needs) are documented in [tool.pytest.ini_options] markers.
test-backend = { cmd = "pytest -vvv -m '{{ marker }} and not e2e' --cov=src/earthlens --cov-report=xml --cov-report=term-missing", args = ["marker"], description = "Run one backend's tests by pytest marker (see [tool.pytest.ini_options] markers)" }
test-cli = { cmd = "pytest -vvv -m 'cli and not slow' --cov=src/earthlens --cov-report=xml --cov-report=term-missing", description = "Run federated catalog-query CLI tests (typer and rich are core dependencies)" }
test-doctests = { cmd = "pytest --doctest-modules src/earthlens", description = "Run docstring examples across the package (catches drift in catalog / API docstrings)" }
notebooks = { cmd = "pytest --nbval --nbval-lax --verbose docs/examples", description = "check notebooks" }
jupyter = { cmd = "jupyter lab --no-browser --IdentityProvider.token='' --ServerApp.password='' --port=8889", description = "check notebooks" }
build-dist = { cmd = "python -m build", description = "Build sdist and wheel for PyPI" }
publish-pypi = { cmd = "twine upload --non-interactive --repository pypi dist/*", depends-on = ["build-dist"], description = "Build and upload package to PyPI" }
cz-changelog = { cmd = "cz changelog", description = "Generate changelog using Commitizen" }
cz-bump = { cmd = "cz bump", description = "Bump version using Commitizen" }

[tool.pixi.environments]
default = { solve-group = "default" }
dev = { features = ["dev", "all", "nwp"], solve-group = "default" }
docs = { features = ["docs"], solve-group = "docs" }
py311 = { features = ["py311", "dev", "all"], solve-group = "py311" }
py312 = { features = ["py312", "dev", "all"], solve-group = "py312" }
py313 = { features = ["py313", "dev", "all"], solve-group = "py313" }
py314 = { features = ["py314", "dev", "all"], solve-group = "py314" }
notebook = { features = ["dev", "notebook", "all", "nwp"], solve-group = "default" }

# eccodes C library (conda-forge): herbie-data's cfgrib import chain needs the
# binary at runtime — the pip `eccodes` binding cannot locate the native lib on
# its own (it fails with `OSError: cannot load library 'libeccodes.dll'`). Scoped
# to the `nwp` feature, which the `dev` and `notebook` envs include, so the NWP
# backend and the live `nwp/*` notebooks can decode GRIB. The docs and per-Python
# test-matrix envs deliberately omit it: CI's unit suite fakes herbie, so those
# envs never touch the binary.
[tool.pixi.feature.nwp.dependencies]
eccodes = ">=2.47,<3"

[tool.pixi.feature.py311.dependencies]
python = "3.11.*"
[tool.pixi.feature.py312.dependencies]
python = "3.12.*"
[tool.pixi.feature.py313.dependencies]
python = "3.13.*"
[tool.pixi.feature.py314.dependencies]
python = "3.14.*"
