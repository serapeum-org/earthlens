# Gitleaks configuration for the CI secret scan (`gitleaks dir` in lint.yml) and the
# local gitleaks pre-commit hook. gitleaks is the repo's single secret scanner (it
# replaced detect-secrets). This keeps gitleaks' full built-in ruleset and only
# allowlists paths that are registries or fixtures rather than source secrets.
title = "earthlens"

[extend]
useDefault = true

[allowlist]
description = "Non-source paths: working notes and lockfile hashes"
paths = [
  # Planning / review notes are working documents, not shipped code.
  '''(^|/)planning/''',
  # The dependency lockfile is package hashes, not credentials.
  '''uv\.lock$''',
]
